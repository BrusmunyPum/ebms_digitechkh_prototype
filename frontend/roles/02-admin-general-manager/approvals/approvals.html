<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - មជ្ឈមណ្ឌលអនុម័តសកល</title>

        tailwind.config = {
            theme: {

                    colors: {

                        'primary-dark': "#142842",

<body id="gmPortal" data-role-root=".." data-active="approvals" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Content Top Header -->
        <div id="headerHost" data-title="មជ្ឈមណ្ឌលអនុម័តសកល"
             data-subtitle="ការពិនិត្យ ផ្ទៀងផ្ទាត់ និងអនុម័តសំណើប្រតិបត្តិការអាជីវកម្មលើសពិដានកម្រិតសហគ្រាស"></div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- Super Admin Style Unified Filter Toolbar -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
                        <!-- Search Input with Embedded Sliders Filter Icon -->
                        <div class="relative w-full sm:w-72 md:w-80">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-search text-xs"></i>
                            </span>
                            <input type="text" id="searchInput" oninput="handleSearch()"
                                placeholder="ស្វែងរកតាមលេខកូដ អ្នកស្នើសុំ ឬបរិយាយ..."
                                class="w-full bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/10 rounded-xl pl-9 pr-10 py-2 text-xs text-slate-800 transition outline-none font-medium placeholder:text-slate-400">

                            <!-- Embedded Sliders Filter Icon Button -->
                            <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center filter-popover-container">
                                <button type="button" id="filterToggleBtn" onclick="toggleFilterMenu(event)"
                                    class="relative p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-lg transition cursor-pointer flex items-center justify-center"
                                    title="កំណត់តម្រងកម្រិតខ្ពស់">
                                    <iconify-icon icon="lucide:sliders-horizontal" class="text-sm" id="filterMainIcon"></iconify-icon>
                                    <span id="activeFilterBadge" class="hidden absolute top-0.5 right-0.5 w-2 h-2 rounded-full bg-[#1e3a5f] ring-2 ring-white"></span>
                                </button>

                                <!-- Filter Popover Menu -->
                                <div id="filterPopoverMenu"
                                    class="hidden absolute top-full left-0 sm:left-auto sm:right-0 mt-2 w-80 bg-white border border-slate-200 rounded-2xl shadow-xl p-4 z-50 space-y-4 text-left">
                                    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                                        <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                            <i class="fas fa-sliders text-slate-500 text-xs"></i> កំណត់លក្ខខណ្ឌតម្រង
                                        </span>
                                        <button type="button" onclick="resetFilters()" class="text-[11px] text-slate-500 hover:text-slate-800 font-medium cursor-pointer">
                                            កំណត់ឡើងវិញ
                                        </button>
                                    </div>

                                    <!-- Category Filter Section -->
                                    <div class="space-y-1.5">
                                        <label class="text-[11px] font-semibold text-slate-600">ប្រភេទសំណើ (Request Type)</label>
                                        <div class="grid grid-cols-1 gap-1" id="categoryFilterOptions">
                                            <button type="button" onclick="selectCategoryFilter('all')" data-cat="all"
                                                class="cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer flex items-center justify-between">
                                                <span><i class="fas fa-list-check mr-1.5 text-[11px]"></i>ទាំងអស់</span>
                                                <span id="popCountAll" class="text-[10px] px-1.5 py-0.2 rounded-full bg-white/20">0</span>
                                            </button>
                                            <button type="button" onclick="selectCategoryFilter('disbursement')" data-cat="disbursement"
                                                class="cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer flex items-center justify-between">
                                                <span><i class="fas fa-receipt mr-1.5 text-blue-500 text-[11px]"></i>ប័ណ្ណចំណាយទូទាត់</span>
                                                <span id="popCountDisb" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600">0</span>
                                            </button>
                                            <button type="button" onclick="selectCategoryFilter('purchase_order')" data-cat="purchase_order"
                                                class="cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer flex items-center justify-between">
                                                <span><i class="fas fa-cart-shopping mr-1.5 text-emerald-500 text-[11px]"></i>បញ្ជាទិញទំនិញ</span>
                                                <span id="popCountPO" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600">0</span>
                                            </button>
                                            <button type="button" onclick="selectCategoryFilter('high_discount')" data-cat="high_discount"
                                                class="cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer flex items-center justify-between">
                                                <span><i class="fas fa-tag mr-1.5 text-purple-500 text-[11px]"></i>បញ្ចុះតម្លៃពិសេស</span>
                                                <span id="popCountDisc" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600">0</span>
                                            </button>
                                            <button type="button" onclick="selectCategoryFilter('credit_override')" data-cat="credit_override"
                                                class="cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer flex items-center justify-between">
                                                <span><i class="fas fa-credit-card mr-1.5 text-amber-500 text-[11px]"></i>លើកលែងពិដានឥណទាន</span>
                                                <span id="popCountCredit" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600">0</span>
                                            </button>
                                            <button type="button" onclick="selectCategoryFilter('stock_writeoff')" data-cat="stock_writeoff"
                                                class="cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer flex items-center justify-between">
                                                <span><i class="fas fa-box-open mr-1.5 text-rose-500 text-[11px]"></i>កាត់កងស្តុកខូចខាត</span>
                                                <span id="popCountWriteoff" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600">0</span>
                                            </button>
                                            <button type="button" onclick="selectCategoryFilter('void_invoice')" data-cat="void_invoice"
                                                class="cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer flex items-center justify-between">
                                                <span><i class="fas fa-ban mr-1.5 text-slate-500 text-[11px]"></i>លុបវិក្កយបត្រ</span>
                                                <span id="popCountVoid" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600">0</span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Status Filter Section inside Popover -->
                                    <div class="space-y-1.5 pt-2 border-t border-slate-100">
                                        <label class="text-[11px] font-semibold text-slate-600">ស្ថានភាពសំណើ (Status)</label>
                                        <div class="grid grid-cols-2 gap-1.5" id="popoverStatusOptions">
                                            <button type="button" onclick="selectStatusFilter('all')" data-status="all"
                                                class="pop-status-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer">
                                                ទាំងអស់
                                            </button>
                                            <button type="button" onclick="selectStatusFilter('pending')" data-status="pending"
                                                class="pop-status-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-amber-50 text-slate-700 cursor-pointer">
                                                <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-500 mr-1"></span> រង់ចាំអនុម័ត
                                            </button>
                                            <button type="button" onclick="selectStatusFilter('approved')" data-status="approved"
                                                class="pop-status-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-emerald-50 text-slate-700 cursor-pointer">
                                                <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span> បានអនុម័ត
                                            </button>
                                            <button type="button" onclick="selectStatusFilter('rejected')" data-status="rejected"
                                                class="pop-status-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-rose-50 text-slate-700 cursor-pointer">
                                                <span class="inline-block w-1.5 h-1.5 rounded-full bg-rose-500 mr-1"></span> បានបដិសេធ
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Status Quick Segment Buttons -->
                        <div class="flex items-center gap-1.5 overflow-x-auto">
                            <button type="button" onclick="selectStatusFilter('all')" data-status-bar="all"
                                class="status-bar-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#1e3a5f] text-white transition cursor-pointer">
                                ទាំងអស់
                            </button>
                            <button type="button" onclick="selectStatusFilter('pending')" data-status-bar="pending"
                                class="status-bar-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 inline-block"></span>
                                <span>រង់ចាំអនុម័ត</span>
                                <span id="statusBarCountPending" class="text-[10px] px-1.5 py-0.2 rounded-full bg-amber-100 text-amber-800 font-bold">0</span>
                            </button>
                            <button type="button" onclick="selectStatusFilter('approved')" data-status-bar="approved"
                                class="status-bar-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
                                <span>បានអនុម័ត</span>
                            </button>
                            <button type="button" onclick="selectStatusFilter('rejected')" data-status-bar="rejected"
                                class="status-bar-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 inline-block"></span>
                                <span>បានបដិសេធ</span>
                            </button>

                    </div>

                    <!-- Actions & Date Toolbar -->
                    <div class="flex flex-wrap items-center gap-2.5">
                        <div id="dateFilterHost" class="flex items-center"></div>

                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-50 text-slate-700 text-xs font-medium border border-slate-200">
                            <iconify-icon icon="lucide:layers" class="text-slate-400 text-sm"></iconify-icon>
                            <span>សរុប <b id="totalApprovalsCount" class="text-slate-800 font-bold">0</b> សំណើ</span>
                        </span>

                        <button type="button" onclick="exportApprovalsCSV()"
                            class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-medium transition shadow-xs flex items-center justify-center cursor-pointer no-print"
                            title="នាំចេញរបាយការណ៍ជា CSV">
                            <iconify-icon icon="el:download-alt" class="text-sm text-slate-600"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- Active Category Filter Chip (Visible when specific category is chosen from popover) -->
                <div id="activeCategoryBanner" class="hidden flex items-center gap-2 px-1">
                    <span class="text-xs text-slate-500 font-medium">តម្រងសកម្ម:</span>
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-50 text-sky-800 border border-sky-200 text-xs font-medium">
                        <span id="activeCategoryLabel">ប្រភេទ</span>
                        <button type="button" onclick="selectCategoryFilter('all')" class="text-sky-600 hover:text-sky-900 ml-1 cursor-pointer">
                            <i class="fas fa-xmark text-xs"></i>
                        </button>
                    </span>
                </div>

                <!-- Approvals Table Container -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
                                    <th class="py-3.5 px-4">លេខកូដសំណើ</th>
                                    <th class="py-3.5 px-4">ប្រភេទ</th>
                                    <th class="py-3.5 px-4">អ្នកស្នើសុំ</th>
                                    <th class="py-3.5 px-4">ឯកសារយោង និងបរិយាយ</th>
                                    <th class="py-3.5 px-4 text-right">ទឹកប្រាក់</th>
                                    <th class="py-3.5 px-4">កាលបរិច្ឆេទ</th>
                                    <th class="py-3.5 px-4 text-center">ស្ថានភាព</th>
                                    <th class="py-3.5 px-4 text-center">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="approvalsTableBody" class="divide-y divide-slate-100 text-xs text-slate-700"></tbody>
                        </table>
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="hidden py-12 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3 text-lg">
                            <i class="fas fa-folder-open"></i>
                        </div>
                        <h4 class="text-sm font-semibold text-slate-700">មិនមានសំណើត្រូវបង្ហាញឡើយ</h4>
                        <p class="text-xs text-slate-400 mt-1">សូមសាកល្បងផ្លាស់ប្តូរពាក្យស្វែងរក ឬផ្ទាំងតម្រង</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Floating Row Action Dropdown Menu (Standard 9) -->
    <div id="rowActionDropdown" class="fixed hidden bg-white rounded-2xl shadow-xl border border-slate-200 py-1.5 w-52 z-50 transition-opacity duration-150">
        <div class="px-3 py-1.5 border-b border-slate-100 mb-1">
            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">សកម្មភាពលើសំណើ</span>
            <span id="dropdownRefCode" class="text-xs font-bold text-slate-800 truncate block"></span>
        </div>
        <a id="dropdownViewLink" href="#" class="flex items-center gap-2.5 px-3.5 py-2 text-xs text-slate-700 hover:bg-slate-50 transition">
            <div class="w-6 h-6 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center text-[11px]">
                <i class="fas fa-file-invoice"></i>
            </div>
            <span>ពិនិត្យលម្អិត និងចុះហត្ថលេខា</span>
        </a>
        <button id="dropdownApproveBtn" onclick="quickApproveFromDropdown()" class="w-full flex items-center gap-2.5 px-3.5 py-2 text-xs text-emerald-700 hover:bg-emerald-50 transition text-left cursor-pointer">
            <div class="w-6 h-6 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-[11px]">
                <i class="fas fa-check"></i>
            </div>
            <span>អនុម័តរហ័ស</span>
        </button>
        <button id="dropdownRejectBtn" onclick="quickRejectFromDropdown()" class="w-full flex items-center gap-2.5 px-3.5 py-2 text-xs text-rose-700 hover:bg-rose-50 transition text-left cursor-pointer">
            <div class="w-6 h-6 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-[11px]">
                <i class="fas fa-xmark"></i>
            </div>
            <span>បដិសេធរហ័ស</span>
        </button>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let currentCategory = 'all';
        let currentStatus = 'all';
        let searchQuery = '';
        let activeDropdownRequestId = null;

        const CATEGORY_NAMES = {
            all: 'ទាំងអស់',
            disbursement: 'ប័ណ្ណចំណាយទូទាត់',
            purchase_order: 'បញ្ជាទិញទំនិញ',
            high_discount: 'បញ្ចុះតម្លៃពិសេស',
            credit_override: 'លើកលែងពិដានឥណទាន',
            stock_writeoff: 'កាត់កងស្តុកខូចខាត',
            void_invoice: 'លុបវិក្កយបត្រ'
        };

        function toggleFilterMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('filterPopoverMenu');
            if (menu) {
                menu.classList.toggle('hidden');
            }
        }

        function closeFilterMenu() {
            const menu = document.getElementById('filterPopoverMenu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        }

        function updateFilterButtonState() {
            let activeCount = 0;
            if (currentCategory && currentCategory !== 'all') activeCount++;
            if (currentStatus && currentStatus !== 'all') activeCount++;

            const badge = document.getElementById('activeFilterBadge');
            const icon = document.getElementById('filterMainIcon');

            if (activeCount > 0) {
                if (icon) {
                    icon.classList.remove('text-slate-400');
                    icon.classList.add('text-[#1e3a5f]');
                }
                if (badge) badge.classList.remove('hidden');
            } else {
                if (icon) {
                    icon.classList.add('text-slate-400');
                    icon.classList.remove('text-[#1e3a5f]');
                }
                if (badge) badge.classList.add('hidden');
            }

            // Update Active Category Banner
            const banner = document.getElementById('activeCategoryBanner');
            const bannerLabel = document.getElementById('activeCategoryLabel');
            if (banner && bannerLabel) {
                if (currentCategory && currentCategory !== 'all') {
                    bannerLabel.textContent = `ប្រភេទ: ${CATEGORY_NAMES[currentCategory] || currentCategory}`;
                    banner.classList.remove('hidden');
                } else {
                    banner.classList.add('hidden');
                }
            }
        }

        function selectCategoryFilter(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-opt-btn').forEach(btn => {
                const cat = btn.getAttribute('data-cat');
                if (cat === category) {
                    btn.className = 'cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer flex items-center justify-between';
                } else {
                    btn.className = 'cat-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer flex items-center justify-between';
                }
            });
            updateFilterButtonState();
            renderTable();
        }

        function selectStatusFilter(status) {
            currentStatus = status;
            // Update popover buttons
            document.querySelectorAll('.pop-status-btn').forEach(btn => {
                const s = btn.getAttribute('data-status');
                if (s === status) {
                    btn.className = 'pop-status-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer';
                } else {
                    btn.className = 'pop-status-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer';
                }
            });

            // Update quick status bar buttons
            document.querySelectorAll('.status-bar-btn').forEach(btn => {
                const s = btn.getAttribute('data-status-bar');
                if (s === status) {
                    btn.classList.add('bg-[#1e3a5f]', 'text-white', 'font-semibold');
                    btn.classList.remove('bg-slate-100', 'text-slate-700', 'font-medium');
                } else {
                    btn.classList.remove('bg-[#1e3a5f]', 'text-white', 'font-semibold');
                    btn.classList.add('bg-slate-100', 'text-slate-700', 'font-medium');
                }
            });

            updateFilterButtonState();
            renderTable();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            selectCategoryFilter('all');
            selectStatusFilter('all');
        }

        function handleSearch() {
            searchQuery = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            renderTable();
        }

        function getStatusBadge(status) {
            if (status === 'approved') {
                return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-medium border border-emerald-200"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>បានអនុម័ត</span>';
            }
            if (status === 'rejected') {
                return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 text-[11px] font-medium border border-rose-200"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>បានបដិសេធ</span>';
            }
            return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-[11px] font-medium border border-amber-200"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>រង់ចាំអនុម័ត</span>';
        }

        function renderTable() {
            const all = BMS_GM.getApprovals();
            
            // Update Popover & Status Bar Counts
            const totalCountEl = document.getElementById('totalApprovalsCount');
            if (totalCountEl) totalCountEl.textContent = all.length;

            const pendingCount = all.filter(a => a.status === 'pending').length;
            const statusPendingBadge = document.getElementById('statusBarCountPending');
            if (statusPendingBadge) statusPendingBadge.textContent = pendingCount;

            const setElText = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.textContent = val;
            };

            setElText('popCountAll', all.length);
            setElText('popCountDisb', all.filter(a => a.type === 'disbursement').length);
            setElText('popCountPO', all.filter(a => a.type === 'purchase_order').length);
            setElText('popCountDisc', all.filter(a => a.type === 'high_discount').length);
            setElText('popCountCredit', all.filter(a => a.type === 'credit_override').length);
            setElText('popCountWriteoff', all.filter(a => a.type === 'stock_writeoff').length);
            setElText('popCountVoid', all.filter(a => a.type === 'void_invoice').length);

            let filtered = BMS_GM.getApprovals(currentCategory, currentStatus);

            if (searchQuery) {
                filtered = filtered.filter(a => 
                    a.id.toLowerCase().includes(searchQuery) ||
                    a.refCode.toLowerCase().includes(searchQuery) ||
                    a.requesterName.toLowerCase().includes(searchQuery) ||
                    a.subject.toLowerCase().includes(searchQuery)
                );
            }

            const tbody = document.getElementById('approvalsTableBody');
            const empty = document.getElementById('emptyState');

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            tbody.innerHTML = filtered.map(app => `
                <tr class="hover:bg-slate-50/70 transition">
                    <!-- Code -->
                    <td class="py-3.5 px-4 font-semibold text-primary whitespace-nowrap">
                        <a href="view-approval.html?id=${app.id}" class="hover:underline flex items-center gap-1.5">
                            <i class="fas fa-file-signature text-xs text-slate-400"></i>
                            <span>${app.id}</span>
                        </a>
                    </td>

                    <!-- Type -->
                    <td class="py-3.5 px-4 whitespace-nowrap">
                        <span class="px-2.5 py-1 rounded-md text-[11px] font-medium bg-${app.typeBadgeColor}-50 text-${app.typeBadgeColor}-700 border border-${app.typeBadgeColor}-200">${app.typeNameKh}</span>
                    </td>

                    <!-- Requester -->
                    <td class="py-3.5 px-4">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-medium text-xs flex-shrink-0">
                                ${app.requesterAvatar}
                            </div>
                            <div class="min-w-0">
                                <span class="font-medium text-slate-800 block truncate">${app.requesterName}</span>
                                <span class="text-[11px] text-slate-400 block truncate">${app.requesterRole}</span>
                            </div>
                        </div>
                    </td>

                    <!-- Ref & Subject -->
                    <td class="py-3.5 px-4 max-w-xs">
                        <a href="view-approval.html?id=${app.id}" class="font-semibold text-slate-800 hover:text-primary transition block truncate">${app.refCode}</a>
                        <span class="text-[11px] text-slate-500 block truncate mt-0.5">${app.subject}</span>
                    </td>

                    <!-- Amount -->
                    <td class="py-3.5 px-4 text-right whitespace-nowrap">
                        <span class="text-sm font-bold text-slate-800">${BMS_GM.fmtCurrencyKh(app.amount)}</span>
                        ${app.discountPct ? `<span class="block text-[11px] text-purple-600 font-medium">ចុះ ${app.discountPct}%</span>` : ''}
                    </td>

                    <!-- Date -->
                    <td class="py-3.5 px-4 whitespace-nowrap text-slate-600 text-xs">
                        ${app.requestedDate}
                    </td>

                    <!-- Status -->
                    <td class="py-3.5 px-4 text-center whitespace-nowrap">
                        ${getStatusBadge(app.status)}
                    </td>

                    <!-- Actions -->
                    <td class="py-3.5 px-4 text-center whitespace-nowrap">
                        <button type="button" onclick="openRowAction(event, '${app.id}', '${app.refCode}', '${app.status}')" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 inline-flex items-center justify-center transition cursor-pointer" title="សកម្មភាព">
                            <i class="fas fa-ellipsis-vertical text-xs"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function openRowAction(event, id, refCode, status) {
            event.stopPropagation();
            activeDropdownRequestId = id;
            const dropdown = document.getElementById('rowActionDropdown');
            document.getElementById('dropdownRefCode').textContent = `${id} (${refCode})`;
            document.getElementById('dropdownViewLink').href = `view-approval.html?id=${id}`;

            const approveBtn = document.getElementById('dropdownApproveBtn');
            const rejectBtn = document.getElementById('dropdownRejectBtn');

            if (status === 'approved' || status === 'rejected') {
                approveBtn.classList.add('hidden');
                rejectBtn.classList.add('hidden');
            } else {
                approveBtn.classList.remove('hidden');
                rejectBtn.classList.remove('hidden');
            }

            const btnRect = event.currentTarget.getBoundingClientRect();
            dropdown.style.top = `${btnRect.bottom + window.scrollY + 4}px`;
            dropdown.style.left = `${btnRect.right - 208}px`;
            dropdown.classList.remove('hidden');
        }

        function quickApproveFromDropdown() {
            if (!activeDropdownRequestId) return;
            const reqId = activeDropdownRequestId;
            closeDropdown();
            showCustomConfirm({
                title: 'អនុម័តសំណើជាផ្លូវការ',
                message: `តើលោកអ្នកពិតជាចង់អនុម័តសំណើ ${reqId} នេះមែនទេ? សកម្មភាពនេះនឹងបើកផ្លូវឱ្យប្រតិបត្តិការដំណើរការបន្ត។`,
                confirmText: 'អនុម័តឥឡូវនេះ',
                confirmClass: 'bg-[#1e3a5f] text-white hover:bg-[#142842]',
                onConfirm: () => {
                    const res = BMS_GM.approveRequest(reqId, 'បានអនុម័តរហ័សពីមជ្ឈមណ្ឌលអនុម័ត');
                    if (res.success) {
                        showToast(`សំណើ ${reqId} ត្រូវបានអនុម័តដោយជោគជ័យ!`, 'success');
                        renderTable();
                    } else {
                        showToast(res.message, 'error');
                    }
                }
            });
        }

        function quickRejectFromDropdown() {
            if (!activeDropdownRequestId) return;
            const reqId = activeDropdownRequestId;
            closeDropdown();
            showCustomConfirm({
                title: 'បដិសេធសំណើ',
                message: `តើលោកអ្នកពិតជាចង់បដិសេធសំណើ ${reqId} នេះមែនទេ? សំណើនឹងត្រូវបញ្ជូនត្រឡប់ទៅអ្នកស្នើសុំវិញ។`,
                confirmText: 'បដិសេធ',
                confirmClass: 'bg-rose-600 text-white hover:bg-rose-700',
                onConfirm: () => {
                    const res = BMS_GM.rejectRequest(reqId, 'បានបដិសេធរហ័សពីមជ្ឈមណ្ឌលអនុម័ត');
                    if (res.success) {
                        showToast(`សំណើ ${reqId} ត្រូវបានបដិសេធ!`, 'info');
                        renderTable();
                    } else {
                        showToast(res.message, 'error');
                    }
                }
            });
        }

        function closeDropdown() {
            const dropdown = document.getElementById('rowActionDropdown');
            if (dropdown) dropdown.classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            closeDropdown();
            if (!e.target.closest('.filter-popover-container')) {
                closeFilterMenu();
            }
        });

        function exportApprovalsCSV() {
            const approvals = BMS_GM.getApprovals();
            let csv = "\uFEFFលេខកូដសំណើ,ប្រភេទ,អ្នកស្នើសុំ,ឯកសារយោង,បរិយាយ,ទឹកប្រាក់,កាលបរិច្ឆេទ,ស្ថានភាព\n";
            approvals.forEach(a => {
                csv += `"${a.id}","${a.typeNameKh}","${a.requesterName}","${a.refCode}","${a.subject.replace(/"/g, '""')}","${a.amount}","${a.requestedDate}","${a.status}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `digitechkh_approvals_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('ទាញយករបាយការណ៍សំណើអនុម័តជា CSV ជោគជ័យ!', 'success');
        }

        function initPage() {
            renderPortalSidebar();
            renderTable();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>
</html>
