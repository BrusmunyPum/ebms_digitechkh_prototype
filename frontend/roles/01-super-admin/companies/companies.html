<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - បញ្ជីក្រុមហ៊ុនទាំងអស់</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="saPortal" data-role-root=".." data-active="companies"
    class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="គ្រប់គ្រងក្រុមហ៊ុនទាំងអស់"
            data-subtitle="បញ្ជីឈ្មោះក្រុមហ៊ុនជាវ ស្ថានភាពគណនី និងការគ្រប់គ្រងកញ្ចប់សេវា"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- Filter Toolbar -->
                <div
                    class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <!-- Search Input with Embedded Sliders Filter Icon -->
                    <div class="relative w-full sm:w-72 md:w-80">
                        <span
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-search text-xs"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="applyFilters()"
                            placeholder="ស្វែងរក..."
                            class="w-full bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/10 rounded-xl pl-9 pr-10 py-2 text-xs text-slate-800 transition outline-none font-medium placeholder:text-slate-400">

                        <!-- Embedded Sliders Filter Icon Button -->
                        <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center filter-popover-container">
                            <button type="button" id="filterToggleBtn" onclick="toggleFilterMenu()"
                                class="relative p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-lg transition cursor-pointer flex items-center justify-center"
                                title="កំណត់តម្រង">
                                <iconify-icon icon="lucide:sliders-horizontal" class="text-sm" id="filterMainIcon"></iconify-icon>
                                <span id="activeFilterBadge" class="hidden absolute top-0.5 right-0.5 w-2 h-2 rounded-full bg-[#1e3a5f] ring-2 ring-white"></span>
                            </button>

                            <!-- Filter Popover Menu -->
                            <div id="filterPopoverMenu"
                                class="hidden absolute top-full right-0 mt-2 w-72 bg-white border border-slate-200 rounded-2xl shadow-xl p-4 z-50 space-y-4">
                                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                                    <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                        <i class="fas fa-sliders text-slate-500 text-xs"></i> កំណត់លក្ខខណ្ឌតម្រង
                                    </span>
                                    <button type="button" onclick="resetFilters()" class="text-[11px] text-slate-500 hover:text-slate-800 font-medium cursor-pointer">
                                        កំណត់ឡើងវិញ
                                    </button>
                                </div>

                                <!-- Status Filter Section -->
                                <div class="space-y-1.5">
                                    <label class="text-[11px] font-semibold text-slate-600">ស្ថានភាពក្រុមហ៊ុន (Status)</label>
                                    <div class="grid grid-cols-2 gap-1.5" id="statusFilterOptions">
                                        <button type="button" onclick="selectStatusFilter('')" data-status=""
                                            class="status-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer">
                                            ទាំងអស់
                                        </button>
                                        <button type="button" onclick="selectStatusFilter('active')" data-status="active"
                                            class="status-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-emerald-50 text-slate-700 cursor-pointer">
                                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span> សកម្ម
                                        </button>
                                        <button type="button" onclick="selectStatusFilter('expiring')" data-status="expiring"
                                            class="status-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-amber-50 text-slate-700 cursor-pointer">
                                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-500 mr-1"></span> ជិតផុត
                                        </button>
                                        <button type="button" onclick="selectStatusFilter('suspended')" data-status="suspended"
                                            class="status-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-rose-50 text-slate-700 cursor-pointer">
                                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-rose-500 mr-1"></span> ផ្អាក
                                        </button>
                                    </div>
                                </div>

                                <!-- Plan Filter Section -->
                                <div class="space-y-1.5">
                                    <label class="text-[11px] font-semibold text-slate-600">កញ្ចប់សេវា (Plan)</label>
                                    <div class="grid grid-cols-1 gap-1" id="planFilterOptions">
                                        <button type="button" onclick="selectPlanFilter('')" data-plan=""
                                            class="plan-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer">
                                            ទាំងអស់
                                        </button>
                                        <button type="button" onclick="selectPlanFilter('starter')" data-plan="starter"
                                            class="plan-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-sky-50 text-slate-700 cursor-pointer">
                                            កញ្ចប់ចាប់ផ្តើម (Starter)
                                        </button>
                                        <button type="button" onclick="selectPlanFilter('pro')" data-plan="pro"
                                            class="plan-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-indigo-50 text-slate-700 cursor-pointer">
                                            កញ្ចប់អាជីព (Pro)
                                        </button>
                                        <button type="button" onclick="selectPlanFilter('enterprise')" data-plan="enterprise"
                                            class="plan-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-purple-50 text-slate-700 cursor-pointer">
                                            កញ្ចប់សហគ្រាស (Enterprise)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions & Date Toolbar -->
                    <div class="flex flex-wrap items-center gap-2.5">
                        <!-- Register Company Button (First) -->
                        <a href="create-company.html"
                            class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#1e3a5f] hover:bg-[#142842] text-white text-xs font-medium shadow-sm transition">
                            <i class="fas fa-plus text-xs"></i>
                            <span>ចុះឈ្មោះក្រុមហ៊ុនថ្មី</span>
                        </a>

                        <!-- Date Filter Host (Calendar) -->
                        <div id="dateFilterHost" class="flex items-center"></div>

                        <!-- Export Button (el:download-alt) -->
                        <button type="button" onclick="exportTenantsCSV()"
                            class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-medium border border-slate-200 transition shadow-sm flex items-center justify-center cursor-pointer no-print"
                            title="ទាញយកទិន្នន័យ (CSV / Excel)">
                            <iconify-icon icon="el:download-alt" class="text-sm text-slate-600"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- Companies Table Container -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                        <span id="tableCountLabel" class="text-xs font-medium text-slate-500">កំពុងបង្ហាញ 0
                            ក្រុមហ៊ុន</span>
                        <div class="flex items-center gap-3 text-xs">
                            <span class="inline-flex items-center gap-1.5 text-emerald-700"><span
                                    class="w-2 h-2 rounded-full bg-emerald-500"></span> សកម្ម</span>
                            <span class="inline-flex items-center gap-1.5 text-amber-700"><span
                                    class="w-2 h-2 rounded-full bg-amber-500"></span> ជិតផុត</span>
                            <span class="inline-flex items-center gap-1.5 text-rose-700"><span
                                    class="w-2 h-2 rounded-full bg-rose-500"></span> ផ្អាក</span>
                        </div>
                    </div>

                    <div class="overflow-x-auto min-h-[360px]">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100 text-xs">
                                <tr>
                                    <th class="py-3 px-4 font-semibold w-12 text-center">ល.រ</th>
                                    <th class="py-3 px-4 font-semibold">ឈ្មោះក្រុមហ៊ុន</th>
                                    <th class="py-3 px-4 font-semibold">លេខ TIN</th>
                                    <th class="py-3 px-4 font-semibold">កញ្ចប់សេវា</th>
                                    <th class="py-3 px-4 font-semibold">អ្នកប្រើប្រាស់</th>
                                    <th class="py-3 px-4 font-semibold">ផុតកំណត់</th>
                                    <th class="py-3 px-4 font-semibold">ស្ថានភាព</th>
                                    <th class="py-3 px-4 font-semibold text-right w-20">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="companiesTableBody" class="divide-y divide-slate-100 text-xs text-slate-700">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Floating Row Action Dropdown Menu -->
    <div id="rowActionDropdown"
        class="hidden fixed bg-white border border-slate-200 rounded-2xl shadow-2xl py-1.5 w-56 z-[99999] select-none text-xs">
        <div id="actionHeaderTitle"
            class="px-4 py-1.5 border-b border-slate-100 font-semibold text-slate-700 truncate bg-slate-50/70">
            ជម្រើសសកម្មភាព
        </div>
        <a id="actionViewLink" href="#"
            class="flex items-center gap-2.5 px-4 py-2 text-slate-700 hover:bg-slate-50 hover:text-primary transition font-medium">
            <i class="fas fa-eye text-slate-400 w-4 text-center"></i>
            <span>មើលព័ត៌មានលម្អិត</span>
        </a>
        <a id="actionEditLink" href="#"
            class="flex items-center gap-2.5 px-4 py-2 text-slate-700 hover:bg-slate-50 hover:text-primary transition font-medium">
            <i class="fas fa-pen-to-square text-slate-400 w-4 text-center"></i>
            <span>កែប្រែព័ត៌មាន</span>
        </a>
        <button type="button" onclick="handleActionPlanChange()"
            class="w-full flex items-center gap-2.5 px-4 py-2 text-slate-700 hover:bg-slate-50 hover:text-primary transition font-medium text-left cursor-pointer">
            <i class="fas fa-boxes-packing text-slate-400 w-4 text-center"></i>
            <span>ផ្លាស់ប្តូរកញ្ចប់សេវា</span>
        </button>
        <button type="button" onclick="handleActionResetPassword()"
            class="w-full flex items-center gap-2.5 px-4 py-2 text-slate-700 hover:bg-slate-50 hover:text-primary transition font-medium text-left cursor-pointer">
            <i class="fas fa-key text-amber-500 w-4 text-center"></i>
            <span>កំណត់ពាក្យសម្ងាត់ Admin</span>
        </button>
        <div class="my-1 border-t border-slate-100"></div>
        <button type="button" id="actionToggleStatusBtn" onclick="handleActionToggleStatus()"
            class="w-full flex items-center gap-2.5 px-4 py-2 transition font-medium text-left cursor-pointer">
            <i id="actionToggleIcon" class="fas fa-ban w-4 text-center"></i>
            <span id="actionToggleLabel">ផ្អាកដំណើរការ</span>
        </button>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let currentFilterStatus = '';
        let currentFilterPlan = '';
        let activeRowTenantId = null;

        function getStatusBadge(status) {
            if (status === 'active') {
                return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-medium border border-emerald-200"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>សកម្ម</span>';
            }
            if (status === 'expiring') {
                return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-medium border border-amber-200"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>ជិតផុត</span>';
            }
            return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 text-xs font-medium border border-rose-200"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>ផ្អាក</span>';
        }

        function getPlanBadge(planKey) {
            const plan = SUBSCRIPTION_PLANS[planKey] || { name: planKey, badgeColor: 'slate' };
            const color = plan.badgeColor || 'slate';
            return `<span class="px-2.5 py-0.5 rounded-md bg-${color}-50 text-${color}-700 text-xs font-medium border border-${color}-200">${plan.name}</span>`;
        }

        function toggleFilterMenu() {
            const menu = document.getElementById('filterPopoverMenu');
            if (menu) {
                menu.classList.toggle('hidden');
            }
        }

        function closeFilterMenu() {
            const menu = document.getElementById('filterPopoverMenu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        }

        function updateFilterButtonState() {
            let activeCount = 0;
            if (currentFilterStatus) activeCount++;
            if (currentFilterPlan) activeCount++;

            const badge = document.getElementById('activeFilterBadge');
            const icon = document.getElementById('filterMainIcon');

            if (activeCount > 0) {
                if (icon) {
                    icon.classList.remove('text-slate-400');
                    icon.classList.add('text-[#1e3a5f]');
                }
                if (badge) {
                    badge.classList.remove('hidden');
                }
            } else {
                if (icon) {
                    icon.classList.add('text-slate-400');
                    icon.classList.remove('text-[#1e3a5f]');
                }
                if (badge) {
                    badge.classList.add('hidden');
                }
            }
        }

        function selectStatusFilter(val) {
            currentFilterStatus = val;
            document.querySelectorAll('.status-opt-btn').forEach(btn => {
                if (btn.getAttribute('data-status') === val) {
                    btn.className = 'status-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer';
                } else {
                    btn.className = 'status-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer';
                }
            });
            updateFilterButtonState();
            applyFilters();
        }

        function selectPlanFilter(val) {
            currentFilterPlan = val;
            document.querySelectorAll('.plan-opt-btn').forEach(btn => {
                if (btn.getAttribute('data-plan') === val) {
                    btn.className = 'plan-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border bg-[#1e3a5f] text-white border-[#1e3a5f] cursor-pointer';
                } else {
                    btn.className = 'plan-opt-btn px-2.5 py-1.5 text-xs rounded-lg text-left font-medium transition border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer';
                }
            });
            updateFilterButtonState();
            applyFilters();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            selectStatusFilter('');
            selectPlanFilter('');
        }

        function applyFilters() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const allTenants = getTenants();

            const filtered = allTenants.filter(t => {
                if (currentFilterStatus && t.status !== currentFilterStatus) return false;
                if (currentFilterPlan && t.plan !== currentFilterPlan) return false;
                if (query) {
                    const matchName = t.nameKh.toLowerCase().includes(query) || t.nameEn.toLowerCase().includes(query);
                    const matchTin = t.tin.toLowerCase().includes(query);
                    const matchContact = t.contactName.toLowerCase().includes(query);
                    if (!matchName && !matchTin && !matchContact) return false;
                }
                return true;
            });

            renderTable(filtered);
        }

        function renderTable(list) {
            const body = document.getElementById('companiesTableBody');
            document.getElementById('tableCountLabel').textContent = `កំពុងបង្ហាញ ${list.length} ក្រុមហ៊ុន`;

            if (!list.length) {
                body.innerHTML = `
                    <tr>
                        <td colspan="8" class="py-12 text-center text-slate-400">
                            <i class="fas fa-folder-open text-2xl mb-2 block text-slate-300"></i>
                            មិនមានទិន្នន័យស្របតាមលក្ខខណ្ឌស្វែងរកឡើយ
                        </td>
                    </tr>
                `;
                return;
            }

            body.innerHTML = list.map((t, idx) => `
                <tr class="hover:bg-slate-50/80 transition">
                    <td class="py-3.5 px-4 text-center font-medium text-slate-400">${idx + 1}</td>
                    <td class="py-3.5 px-4 font-medium text-slate-800">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full bg-[#1e3a5f]/10 text-primary font-semibold flex items-center justify-center text-xs flex-shrink-0">
                                ${t.logoInitial}
                            </div>
                            <div>
                                <a href="view-company.html?id=${t.id}" class="hover:text-primary hover:underline font-semibold block">${t.nameKh}</a>
                                <span class="text-[11px] text-slate-400 font-normal">${t.contactName} · ${t.contactPhone}</span>
                            </div>
                        </div>
                    </td>
                    <td class="py-3.5 px-4 font-mono text-slate-600 font-medium">${t.tin}</td>
                    <td class="py-3.5 px-4">${getPlanBadge(t.plan)}</td>
                    <td class="py-3.5 px-4 font-medium">${t.usersCount} / ${t.quotaUsers} នាក់</td>
                    <td class="py-3.5 px-4 text-slate-500">${fmtDateKh(t.expiresAt)}</td>
                    <td class="py-3.5 px-4">${getStatusBadge(t.status)}</td>
                    <td class="py-3.5 px-4 text-right">
                        <button type="button" onclick="openRowAction(event, '${t.id}')"
                            class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition ml-auto cursor-pointer"
                            title="ជម្រើសបន្ថែម">
                            <i class="fas fa-ellipsis-vertical text-xs"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function openRowAction(event, tenantId) {
            event.stopPropagation();
            activeRowTenantId = tenantId;
            const tenant = getTenantById(tenantId);
            if (!tenant) return;

            const dropdown = document.getElementById('rowActionDropdown');
            document.getElementById('actionHeaderTitle').textContent = tenant.nameKh;
            document.getElementById('actionViewLink').href = `view-company.html?id=${tenant.id}`;
            document.getElementById('actionEditLink').href = `edit-company.html?id=${tenant.id}`;

            const isSuspended = tenant.status === 'suspended';
            const toggleBtn = document.getElementById('actionToggleStatusBtn');
            const toggleIcon = document.getElementById('actionToggleIcon');
            const toggleLabel = document.getElementById('actionToggleLabel');

            if (isSuspended) {
                toggleBtn.className = 'w-full flex items-center gap-2.5 px-4 py-2 text-emerald-700 hover:bg-emerald-50 transition font-medium text-left cursor-pointer';
                toggleIcon.className = 'fas fa-circle-check w-4 text-center text-emerald-600';
                toggleLabel.textContent = 'បើកដំណើរការឡើងវិញ';
            } else {
                toggleBtn.className = 'w-full flex items-center gap-2.5 px-4 py-2 text-rose-700 hover:bg-rose-50 transition font-medium text-left cursor-pointer';
                toggleIcon.className = 'fas fa-ban w-4 text-center text-rose-600';
                toggleLabel.textContent = 'ផ្អាកដំណើរការ';
            }

            const rect = event.currentTarget.getBoundingClientRect();
            dropdown.style.top = `${rect.bottom + 4}px`;
            dropdown.style.left = `${Math.min(rect.right - 224, window.innerWidth - 240)}px`;
            dropdown.classList.remove('hidden');
        }

        function closeRowAction() {
            const dropdown = document.getElementById('rowActionDropdown');
            if (dropdown) dropdown.classList.add('hidden');
        }

        function handleActionToggleStatus() {
            closeRowAction();
            const tenant = getTenantById(activeRowTenantId);
            if (!tenant) return;

            const willSuspend = tenant.status !== 'suspended';
            const actionKh = willSuspend ? 'ផ្អាកដំណើរការ' : 'បើកដំណើរការឡើងវិញ';

            showCustomConfirm({
                title: `${actionKh}ក្រុមហ៊ុន`,
                message: `តើលោកអ្នកពិតជាចង់${actionKh}លើក្រុមហ៊ុន «${tenant.nameKh}» មែនទេ?`,
                confirmText: actionKh,
                cancelText: 'បោះបង់',
                danger: willSuspend,
                onConfirm: () => {
                    toggleTenantStatus(activeRowTenantId);
                    showToast(`បាន${actionKh}ក្រុមហ៊ុន «${tenant.nameKh}» ដោយជោគជ័យ`, 'success');
                    applyFilters();
                }
            });
        }

        function handleActionResetPassword() {
            closeRowAction();
            const tenant = getTenantById(activeRowTenantId);
            if (!tenant) return;

            showCustomConfirm({
                title: 'កំណត់ពាក្យសម្ងាត់ Admin ឡើងវិញ',
                message: `តើលោកអ្នកចង់ផ្ញើតំណភ្ជាប់កំណត់ពាក្យសម្ងាត់ថ្មីទៅកាន់អ៊ីមែល ${tenant.contactEmail} មែនទេ?`,
                confirmText: 'ផ្ញើតំណភ្ជាប់',
                cancelText: 'បោះបង់',
                onConfirm: () => {
                    addAuditLog({
                        companyName: tenant.nameKh,
                        companyId: tenant.id,
                        action: 'RESET_PASSWORD',
                        actionLabel: 'កំណត់ពាក្យសម្ងាត់',
                        entity: `Admin (${tenant.contactName})`,
                        result: 'SUCCESS',
                        resultLabel: 'ជោគជ័យ',
                        details: `បានផ្ញើតំណភ្ជាប់កំណត់ពាក្យសម្ងាត់ឡើងវិញទៅកាន់ ${tenant.contactEmail}`
                    });
                    showToast(`បានផ្ញើតំណភ្ជាប់កំណត់ពាក្យសម្ងាត់ថ្មីទៅកាន់ ${tenant.contactEmail} រួចរាល់`, 'success');
                }
            });
        }

        function handleActionPlanChange() {
            closeRowAction();
            window.location.href = `edit-company.html?id=${activeRowTenantId}#subscription`;
        }

        function exportTenantsCSV() {
            const tenants = getTenants();
            let csv = 'ID,Name Kh,Name En,TIN,Plan,Users Count,Quota,Status,Expires At\n';
            tenants.forEach(t => {
                csv += `"${t.id}","${t.nameKh}","${t.nameEn}","${t.tin}","${t.plan}",${t.usersCount},${t.quotaUsers},"${t.status}","${t.expiresAt}"\n`;
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DIGITECHKH_Tenants_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('បានទាញយកឯកសារបញ្ជីក្រុមហ៊ុនជា CSV ដោយជោគជ័យ', 'success');
        }

        // Global click handler to close menus
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#rowActionDropdown') && !e.target.closest('button[onclick*="openRowAction"]')) {
                closeRowAction();
            }
            if (!e.target.closest('.filter-popover-container')) {
                closeFilterMenu();
            }
        });

        function initCompanies() {
            renderPortalSidebar();
            if (typeof renderDateRangePicker === 'function') {
                renderDateRangePicker('dateFilterHost');
            }
            applyFilters();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCompanies);
        } else {
            initCompanies();
        }
    </script>
</body>

</html>
