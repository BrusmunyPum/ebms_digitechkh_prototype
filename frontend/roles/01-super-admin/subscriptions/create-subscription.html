<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បង្កើត / បន្តកញ្ចប់សេវា — eBMS v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        'primary-dark': '#020617'
                    },
                    fontFamily: {
                        sans: ['"Kantumruy Pro"', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased" data-portal="saPortal" data-role-root="../" data-active="subscriptions">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebarHost"></div>

        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Header (72px aligned) -->
        <div id="headerHost" data-title="បង្កើត / បន្តកញ្ចប់សេវាជាវ"
                 data-subtitle="កំណត់កញ្ចប់សេវាប្រព័ន្ធ និងរយៈពេលសុពលភាពសម្រាប់ក្រុមហ៊ុនជាវ"
                 data-back="subscriptions.html"></div>

            <!-- Main Content Form -->
            <main class="flex-1 overflow-y-auto p-6">
            <!-- របារសកម្មភាពទំព័រ — ដកចេញពីក្បាលទំព័រ ដើម្បីរក្សាក្បាលទំព័រឲ្យស្អាត -->
            <div class="w-full max-w-7xl flex flex-wrap items-center justify-end gap-2 mb-4 no-print">
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" onclick="history.back()" class="h-10 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-medium transition cursor-pointer">
                        បោះបង់
                    </button>
                    <button type="button" onclick="submitSubscription()" class="h-10 px-5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium flex items-center gap-2 shadow-sm transition cursor-pointer">
                        <i class="fas fa-check text-xs"></i>
                        <span>បញ្ជាក់ការជាវ</span>
                    </button>
                </div>
            </div>

                <form id="subForm" onsubmit="event.preventDefault(); submitSubscription();" class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl">
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Company Selection -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
                            <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                                <i class="fas fa-building text-slate-500"></i>
                                <span>ជ្រើសរើសក្រុមហ៊ុនជាវ (Tenant)</span>
                            </h3>

                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">ក្រុមហ៊ុន <span class="text-rose-500">*</span></label>
                                <select id="subTenant" onchange="onTenantChange()" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500">
                                    <!-- Rendered by JS -->
                                </select>
                            </div>
                        </div>

                        <!-- Plan Selection -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
                            <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                                <i class="fas fa-cubes text-slate-500"></i>
                                <span>ជ្រើសរើសកញ្ចប់សេវា (Plan Tier)</span>
                            </h3>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <label class="relative p-4 rounded-2xl border-2 border-slate-200 cursor-pointer hover:border-slate-400 transition flex flex-col justify-between" id="planCard-starter">
                                    <input type="radio" name="planChoice" value="starter" onchange="onPlanSelect('starter')" class="sr-only">
                                    <div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-sky-700">Starter</span>
                                            <span class="font-mono font-bold text-sm text-slate-900">$29/ខែ</span>
                                        </div>
                                        <p class="text-[11px] text-slate-500 mt-2">អតិបរមា 5 គណនី</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t border-slate-100 text-[10px] text-slate-600 space-y-1">
                                        <div>✓ ម៉ូឌុលលក់ & POS</div>
                                        <div>✓ ស្តុកទំនិញមូលដ្ឋាន</div>
                                    </div>
                                </label>

                                <label class="relative p-4 rounded-2xl border-2 border-indigo-500 bg-indigo-50/20 cursor-pointer transition flex flex-col justify-between" id="planCard-pro">
                                    <input type="radio" name="planChoice" value="pro" checked onchange="onPlanSelect('pro')" class="sr-only">
                                    <div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-indigo-700">Pro (ពេញនិយម)</span>
                                            <span class="font-mono font-bold text-sm text-slate-900">$69/ខែ</span>
                                        </div>
                                        <p class="text-[11px] text-slate-500 mt-2">អតិបរមា 15 គណនី</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t border-slate-100 text-[10px] text-slate-600 space-y-1">
                                        <div>✓ គ្រប់គ្រងពហុឃ្លាំង</div>
                                        <div>✓ ម៉ូឌុលធនធានមនុស្ស & HR</div>
                                        <div>✓ ជូនដំណឹងតាម Telegram</div>
                                    </div>
                                </label>

                                <label class="relative p-4 rounded-2xl border-2 border-slate-200 cursor-pointer hover:border-slate-400 transition flex flex-col justify-between" id="planCard-enterprise">
                                    <input type="radio" name="planChoice" value="enterprise" onchange="onPlanSelect('enterprise')" class="sr-only">
                                    <div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-purple-700">Enterprise</span>
                                            <span class="font-mono font-bold text-sm text-slate-900">$199/ខែ</span>
                                        </div>
                                        <p class="text-[11px] text-slate-500 mt-2">អតិបរមា 50 គណនី</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t border-slate-100 text-[10px] text-slate-600 space-y-1">
                                        <div>✓ គ្រប់មុខងារ 100%</div>
                                        <div>✓ Digital Showroom</div>
                                        <div>✓ Anti-Fraud & សវនកម្ម</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Duration & Payment Terms -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
                            <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                                <i class="fas fa-calendar-days text-slate-500"></i>
                                <span>រយៈពេលជាវ & ការទូទាត់</span>
                            </h3>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1.5">រយៈពេលជាវ (Duration)</label>
                                    <select id="subDuration" onchange="calculateSubTotal()" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500">
                                        <option value="6">6 ខែ (ពាក់កណ្តាលឆ្នាំ)</option>
                                        <option value="12" selected>12 ខែ (1 ឆ្នាំ — បញ្ចុះតម្លៃ 10%)</option>
                                        <option value="24">24 ខែ (2 ឆ្នាំ — បញ្ចុះតម្លៃ 20%)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1.5">វិធីសាស្ត្រទូទាត់</label>
                                    <select id="subPaymentMethod" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500">
                                        <option value="khqr">Bakong KHQR (ទូទាត់ភ្លាមៗ)</option>
                                        <option value="bank">ផ្ទេរប្រាក់តាមធនាគារ (Bank Transfer)</option>
                                        <option value="cash">សាច់ប្រាក់ផ្ទាល់ (Cash Invoice)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Summary Card -->
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4 sticky top-6">
                            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-3">សង្ខេបការជាវ</h3>

                            <div class="space-y-3 text-xs">
                                <div class="flex justify-between py-1 border-b border-slate-100">
                                    <span class="text-slate-500">កញ្ចប់សេវា៖</span>
                                    <span class="font-bold text-slate-900" id="sumPlanName">Pro Plan</span>
                                </div>
                                <div class="flex justify-between py-1 border-b border-slate-100">
                                    <span class="text-slate-500">តម្លៃប្រចាំខែ៖</span>
                                    <span class="font-mono font-bold text-slate-800 tabular-nums" id="sumMonthly">$69.00</span>
                                </div>
                                <div class="flex justify-between py-1 border-b border-slate-100">
                                    <span class="text-slate-500">រយៈពេល៖</span>
                                    <span class="font-bold text-slate-800" id="sumMonths">12 ខែ</span>
                                </div>
                                <div class="flex justify-between py-1 border-b border-slate-100">
                                    <span class="text-slate-500">ការបញ្ចុះតម្លៃ៖</span>
                                    <span class="font-mono font-bold text-emerald-600" id="sumDiscount">-10% ($82.80)</span>
                                </div>
                                <div class="flex justify-between py-2 border-b-2 border-slate-200 text-sm">
                                    <span class="font-bold text-slate-900">សរុបត្រូវបង់៖</span>
                                    <span class="font-mono font-extrabold text-slate-900 text-base tabular-nums" id="sumGrandTotal">$745.20</span>
                                </div>
                            </div>

                            <div class="pt-2">
                                <button type="button" onclick="submitSubscription()" class="w-full h-11 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold shadow-sm transition flex items-center justify-center gap-2 cursor-pointer">
                                    <i class="fas fa-check"></i>
                                    <span>បញ្ជាក់ និងធ្វើបច្ចុប្បន្នភាពកញ្ចប់</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let selectedPlan = 'pro';

        function initTenants() {
            const tenants = getTenants();
            const sel = document.getElementById('subTenant');
            sel.innerHTML = tenants.map(t => `<option value="${t.id}">${t.nameKh} (${t.id})</option>`).join('');
            calculateSubTotal();
        }

        function onPlanSelect(plan) {
            selectedPlan = plan;
            ['starter', 'pro', 'enterprise'].forEach(p => {
                const card = document.getElementById(`planCard-${p}`);
                if (p === plan) {
                    card.className = 'relative p-4 rounded-2xl border-2 border-indigo-500 bg-indigo-50/20 cursor-pointer transition flex flex-col justify-between';
                } else {
                    card.className = 'relative p-4 rounded-2xl border-2 border-slate-200 cursor-pointer hover:border-slate-400 transition flex flex-col justify-between';
                }
            });
            calculateSubTotal();
        }

        function calculateSubTotal() {
            const planObj = SUBSCRIPTION_PLANS[selectedPlan] || SUBSCRIPTION_PLANS.pro;
            const months = parseInt(document.getElementById('subDuration').value) || 12;
            const basePrice = planObj.price * months;
            
            let discountRate = 0;
            if (months === 12) discountRate = 0.10;
            else if (months === 24) discountRate = 0.20;

            const discountAmount = basePrice * discountRate;
            const grandTotal = basePrice - discountAmount;

            document.getElementById('sumPlanName').innerText = `${planObj.nameKh || planObj.name} (${planObj.nameEn})`;
            document.getElementById('sumMonthly').innerText = fmtUSD(planObj.price);
            document.getElementById('sumMonths').innerText = `${months} ខែ`;
            document.getElementById('sumDiscount').innerText = discountRate > 0 ? `-${discountRate * 100}% (${fmtUSD(discountAmount)})` : '$0.00';
            document.getElementById('sumGrandTotal').innerText = fmtUSD(grandTotal);
        }

        function submitSubscription() {
            const tenantId = document.getElementById('subTenant').value;
            const tenant = getTenant(tenantId);
            if (tenant) {
                tenant.plan = selectedPlan;
                const months = parseInt(document.getElementById('subDuration').value) || 12;
                const d = new Date();
                d.setMonth(d.getMonth() + months);
                tenant.expiresAt = d.toISOString().slice(0, 10);
                tenant.status = 'active';
                saveTenants(getTenants());
            }

            showToast(`បានបន្តកញ្ចប់សេវា ${selectedPlan.toUpperCase()} សម្រាប់ ${tenant ? tenant.nameKh : tenantId} ដោយជោគជ័យ`, 'success');
            setTimeout(() => {
                window.location.href = 'subscriptions.html';
            }, 800);
        }

        document.addEventListener('DOMContentLoaded', initTenants);
    </script>
</body>
</html>
