<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - បន្ថែមអ្នកផ្គត់ផ្គង់ថ្មី</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#d97706",
                        'primary-dark': "#b45309",
                        accent: "#f59e0b",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>
<body id="pmPortal" data-role-root=".." data-active="vendors" class="bg-slate-50 font-sans text-slate-800 text-[16px] flex h-screen overflow-hidden">

    <!-- Unified Sidebar Runtime -->
    <div id="sidebarHost"></div>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

        <!-- Top Header (Standard 2: h-[72px] px-6) -->
        <header class="bg-white px-6 h-[72px] flex justify-between items-center shadow-xs z-10 flex-shrink-0 w-full border-b border-slate-200/70">
            <div class="flex items-center gap-4">
                <a href="vendors.html" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center transition border border-slate-200/70" title="ត្រឡប់ទៅ...">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 leading-tight">បន្ថែមអ្នកផ្គត់ផ្គង់ថ្មី</h2>
                    <p class="text-xs font-normal text-slate-500 mt-0.5">ចុះឈ្មោះក្រុមហ៊ុនផ្គត់ផ្គង់ និងលក្ខខណ្ឌប្រតិបត្តិការ</p>
                </div>
            </div>

            <div class="flex items-center sm:border-l sm:pl-3">
                <div class="w-10 h-10 rounded-full bg-amber-600 text-white flex items-center justify-center font-semibold text-sm shadow-sm">
                    សផ
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-5">
            <form id="createVendorForm" onsubmit="handleSaveVendor(event)" class="w-full max-w-5xl mx-auto space-y-6">

                <!-- Section A: Basic Info -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-xs space-y-4">
                    <h3 class="text-sm font-semibold text-slate-800 pb-3 border-b border-slate-100 flex items-center gap-2">
                        <i class="fas fa-building text-amber-600"></i>
                        <span>ព័ត៌មានទូទៅនៃសហគ្រាស</span>
                    </h3>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">ឈ្មោះអ្នកផ្គត់ផ្គង់ (ភាសាខ្មែរ) <span class="text-rose-500">*</span></label>
                            <input type="text" id="nameKh" required placeholder="ឧ. ក្រុមហ៊ុន ខេមបូ សឹបផ្លាយ ឯ.ក" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">ឈ្មោះជាអក្សរឡាតាំង (English)</label>
                            <input type="text" id="nameEn" placeholder="e.g. Cambo Supply Co., Ltd." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">លេខកូដសម្គាល់អ្នកផ្គត់ផ្គង់</label>
                            <input type="text" id="vendorCode" placeholder="ស្វ័យប្រវត្តិ (ឧ. VND-006)" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-600 outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">លេខអត្តសញ្ញាណកម្មសារពើពន្ធ (TIN)</label>
                            <input type="text" id="tin" placeholder="K001-XXXXXXXXX" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">ទម្រង់អាជីវកម្ម</label>
                            <select id="businessType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                                <option value="ក្រុមហ៊ុនទទួលខុសត្រូវមានកម្រិត">ក្រុមហ៊ុនទទួលខុសត្រូវមានកម្រិត (ឯ.ក)</option>
                                <option value="សហគ្រាសឯកបុគ្គល">សហគ្រាសឯកបុគ្គល</option>
                                <option value="ក្រុមហ៊ុនមហាជនទទួលខុសត្រូវមានកម្រិត">ក្រុមហ៊ុនមហាជនទទួលខុសត្រូវមានកម្រិត</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">ស្ថានភាព</label>
                            <select id="status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                                <option value="Active">សកម្ម (Active)</option>
                                <option value="Inactive">អសកម្ម (Inactive)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Section B: Contact Info -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-xs space-y-4">
                    <h3 class="text-sm font-semibold text-slate-800 pb-3 border-b border-slate-100 flex items-center gap-2">
                        <i class="fas fa-address-book text-sky-600"></i>
                        <span>ព័ត៌មានទំនាក់ទំនង និងអាសយដ្ឋាន</span>
                    </h3>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">លេខទូរស័ព្ទចម្បង <span class="text-rose-500">*</span></label>
                            <input type="text" id="phone" required placeholder="012 345 678" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">អ៊ីមែលផ្លូវការ</label>
                            <input type="email" id="email" placeholder="vendor@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">បុគ្គលទំនាក់ទំនងផ្ទាល់</label>
                            <input type="text" id="contactPerson" placeholder="ឈ្មោះតំណាងលក់" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">រាជធានី/ខេត្ត</label>
                            <input type="text" id="province" value="រាជធានីភ្នំពេញ" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">អាសយដ្ឋានទីតាំងសហគ្រាស <span class="text-rose-500">*</span></label>
                            <textarea id="addressKh" rows="2" required placeholder="លេខផ្ទះ ផ្លូវ សង្កាត់ ខណ្ឌ..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 outline-none focus:border-amber-600"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Section C: Payment & Supply Profile -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-xs space-y-4">
                    <h3 class="text-sm font-semibold text-slate-800 pb-3 border-b border-slate-100 flex items-center gap-2">
                        <i class="fas fa-hand-holding-dollar text-emerald-600"></i>
                        <span>លក្ខខណ្ឌទូទាត់ និងទម្រង់ផ្គត់ផ្គង់</span>
                    </h3>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">លក្ខខណ្ឌទូទាត់ទូទៅ</label>
                            <select id="paymentTerms" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                                <option value="COD">COD (ទូទាត់ពេលប្រគល់ទំនិញ)</option>
                                <option value="Net 7">Net 7 (ទូទាត់ក្នុង 7 ថ្ងៃ)</option>
                                <option value="Net 15">Net 15 (ទូទាត់ក្នុង 15 ថ្ងៃ)</option>
                                <option value="Net 30" selected>Net 30 (ទូទាត់ក្នុង 30 ថ្ងៃ)</option>
                                <option value="Net 60">Net 60 (ទូទាត់ក្នុង 60 ថ្ងៃ)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">រយៈពេលដឹកជញ្ជូនមធ្យម (ថ្ងៃ)</label>
                            <input type="number" id="leadTime" value="7" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">បរិមាណបញ្ជាទិញអប្បបរមា (MOQ)</label>
                            <input type="number" id="moq" value="5" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">ធនាគារ</label>
                            <input type="text" id="bankName" placeholder="ឧ. ធនាគារ អេស៊ីលីដា" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">លេខគណនី</label>
                            <input type="text" id="accountNo" placeholder="XXXXXXXXXXXX" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1.5">ឈ្មោះម្ចាស់គណនី</label>
                            <input type="text" id="accountName" placeholder="ឈ្មោះក្រុមហ៊ុនលើគណនី" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 outline-none focus:border-amber-600">
                        </div>
                    </div>
                </div>

                <!-- Form Action Buttons -->
                <div class="flex items-center justify-end gap-3 pt-2">
                    <a href="vendors.html" class="px-5 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        បោះបង់
                    </a>
                    <button type="submit" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-xl shadow-xs transition cursor-pointer flex items-center gap-2">
                        <i class="fas fa-check"></i>
                        <span>រក្សាទុកអ្នកផ្គត់ផ្គង់</span>
                    </button>
                </div>

            </form>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPortalSidebar();
        });

        function handleSaveVendor(e) {
            e.preventDefault();

            const newVendor = {
                nameKh: document.getElementById('nameKh').value.trim(),
                nameEn: document.getElementById('nameEn').value.trim(),
                code: document.getElementById('vendorCode').value.trim(),
                tin: document.getElementById('tin').value.trim(),
                businessType: document.getElementById('businessType').value,
                status: document.getElementById('status').value,
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim(),
                contactPerson: document.getElementById('contactPerson').value.trim(),
                addressKh: document.getElementById('addressKh').value.trim(),
                paymentTerms: document.getElementById('paymentTerms').value,
                currency: 'USD',
                leadTime: parseInt(document.getElementById('leadTime').value) || 7,
                moq: parseInt(document.getElementById('moq').value) || 5,
                bankName: document.getElementById('bankName').value.trim(),
                accountNo: document.getElementById('accountNo').value.trim(),
                accountName: document.getElementById('accountName').value.trim(),
                onTimeRate: 100,
                totalSpend: 0,
                outstandingAp: 0,
                lastOrderDate: 'មិនទាន់មាន',
                categories: ['general']
            };

            const saved = saveVendor(newVendor);
            showToast(`បានចុះឈ្មោះអ្នកផ្គត់ផ្គង់ ${saved.nameKh} ដោយជោគជ័យ!`, 'success');

            setTimeout(() => {
                window.location.href = `view-vendor.html?id=${saved.id}`;
            }, 800);
        }
    </script>
</body>
</html>
