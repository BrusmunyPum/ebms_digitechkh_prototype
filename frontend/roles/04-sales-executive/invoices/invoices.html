<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - បញ្ជីវិក្កយបត្រ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1e3a5f", 'primary-dark': "#142842", accent: "#0ea5e9" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>
<body id="sePortal" data-role-root=".." data-active="invoices" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បញ្ជីវិក្កយបត្រ"
             data-subtitle="តាមដានស្ថានភាពទូទាត់ និងការប្រមូលប្រាក់"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <div id="summaryRow" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div id="statusTabs" class="flex flex-wrap items-center gap-2"></div>
                    <div class="flex flex-wrap items-center gap-2">
                        <div id="dateFilterHost" class="flex items-center pr-1"></div>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <a href="create-invoice.html" class="sm-badge inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#0f2b5c] hover:bg-[#0a1d3f] text-white font-semibold shadow-sm transition">
                                <i class="fas fa-plus"></i> <span class="hidden sm:inline">បង្កើតវិក្កយបត្រ</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div id="customerFilterChip" class="hidden"></div>

                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                <tr>
                                    <th class="sm-th py-3.5 px-4">លេខវិក្កយបត្រ</th>
                                    <th class="sm-th py-3.5 px-4">អតិថិជន</th>
                                    <th class="sm-th py-3.5 px-4">កាលបរិច្ឆេទចេញ</th>
                                    <th class="sm-th py-3.5 px-4">ផុតកំណត់ទូទាត់</th>
                                    <th class="sm-th py-3.5 px-4">ស្ថានភាពទូទាត់</th>
                                    <th class="sm-th py-3.5 px-4 text-right">ទឹកប្រាក់សរុប</th>
                                    <th class="sm-th py-3.5 px-4 text-right">នៅជំពាក់</th>
                                    <th class="sm-th py-3.5 px-4 text-right">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="invoiceBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                        </table>
                    </div>
                    <div id="invoiceEmpty" class="hidden py-14 px-6 text-center">
                        <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-receipt text-2xl"></i>
                        </div>
                        <h3 class="sm-card-title text-slate-700">គ្មានវិក្កយបត្រក្នុងលក្ខខណ្ឌនេះទេ</h3>
                        <p class="sm-card-sub text-slate-500 mt-1">សូមប្តូរតម្រងស្ថានភាព ឬកំឡុងពេល។</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let filterState = 'all';
        let filterCustomer = new URLSearchParams(location.search).get('customer') || '';

        const TABS = [
            { id: 'all', label: 'ទាំងអស់' },
            { id: 'overdue', label: 'ហួសកាលកំណត់' },
            { id: 'unpaid', label: 'មិនទាន់ទូទាត់' },
            { id: 'partial', label: 'ទូទាត់មួយផ្នែក' },
            { id: 'paid', label: 'បានទូទាត់ពេញ' }
        ];

        function scopedInvoices() {
            return INVOICES.filter(i => !filterCustomer || i.customerId === filterCustomer);
        }

        function renderSummary() {
            const list = scopedInvoices();
            const total = list.reduce((s, i) => s + docTotals(i).grandTotal, 0);
            const collected = list.reduce((s, i) => s + i.paid, 0);
            const due = list.reduce((s, i) => s + invoiceState(i).due, 0);
            const overdue = list.filter(i => invoiceState(i).key === 'overdue');
            const overdueAmount = overdue.reduce((s, i) => s + invoiceState(i).due, 0);

            const card = (label, value, tone, sub) => `
                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                    <span class="sm-kpi-label text-slate-500">${label}</span>
                    <h3 class="sm-kpi-value ${tone} mt-1">${value}</h3>
                    <p class="sm-kpi-sub text-slate-500 mt-1">${sub}</p>
                </div>`;

            document.getElementById('summaryRow').innerHTML =
                card('ទឹកប្រាក់វិក្កយបត្រសរុប', fmtUSD(total), 'text-slate-700', `${list.length} វិក្កយបត្រ`) +
                card('ប្រមូលបានរួច', fmtUSD(collected), 'text-emerald-600', 'ទទួលបានជាក់ស្តែង') +
                card('នៅត្រូវប្រមូល', fmtUSD(due), 'text-amber-600', 'រង់ចាំការទូទាត់') +
                card('ហួសកាលកំណត់', fmtUSD(overdueAmount), 'text-rose-600', `${overdue.length} វិក្កយបត្រ`);
        }

        function renderTabs() {
            const list = scopedInvoices();
            document.getElementById('statusTabs').innerHTML = TABS.map(t => {
                const count = t.id === 'all' ? list.length : list.filter(i => invoiceState(i).key === t.id).length;
                const active = filterState === t.id;
                return `<button onclick="pickState('${t.id}')" class="sm-badge px-4 py-2 rounded-xl transition ${active
                    ? 'bg-[#1e3a5f] text-white font-semibold shadow-sm'
                    : 'text-slate-600 hover:bg-slate-100 font-medium'}">${t.label} (${count})</button>`;
            }).join('');
        }

        function pickState(id) {
            filterState = id;
            closeAllFloatingDropdowns();
            renderTabs();
            renderInvoices();
        }

        function clearCustomerFilter() {
            filterCustomer = '';
            history.replaceState(null, '', location.pathname);
            renderCustomerChip();
            renderSummary();
            renderTabs();
            renderInvoices();
        }

        function renderCustomerChip() {
            const chip = document.getElementById('customerFilterChip');
            if (!filterCustomer) {
                chip.classList.add('hidden');
                setPortalSubtitle('តាមដានស្ថានភាពទូទាត់ និងការប្រមូលប្រាក់');
                return;
            }
            const cust = getCustomer(filterCustomer);
            chip.classList.remove('hidden');
            chip.innerHTML = `
                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <span class="sm-td text-slate-600 inline-flex items-center gap-2">
                        <i class="fas fa-filter text-slate-400 text-xs"></i>
                        កំពុងបង្ហាញតែវិក្កយបត្ររបស់ <span class="sm-value text-slate-700">${cust.name}</span>
                    </span>
                    <button onclick="clearCustomerFilter()" class="sm-badge px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium transition inline-flex items-center gap-1.5">
                        <i class="fas fa-xmark text-xs"></i> សម្អាតតម្រង
                    </button>
                </div>`;
            setPortalSubtitle(`វិក្កយបត្ររបស់ ${cust.name}`);
        }

        function renderInvoices() {
            const range = getSelectedRange();
            const rows = scopedInvoices()
                .filter(i => filterState === 'all' || invoiceState(i).key === filterState)
                .filter(i => inRange(i.date, range))
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            const body = document.getElementById('invoiceBody');
            const empty = document.getElementById('invoiceEmpty');
            if (!rows.length) {
                body.innerHTML = '';
                body.parentElement.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            body.parentElement.classList.remove('hidden');
            empty.classList.add('hidden');

            body.innerHTML = rows.map(inv => {
                const cust = getCustomer(inv.customerId);
                const st = invoiceState(inv);
                const menuId = 'invMenu-' + inv.id;
                const dueNote = st.key === 'overdue'
                    ? `<p class="sm-td-sub text-rose-600 font-semibold">ហួស ${st.overdueDays} ថ្ងៃ</p>`
                    : st.key === 'paid' ? '' : `<p class="sm-td-sub text-slate-400">នៅសល់ ${Math.abs(st.overdueDays)} ថ្ងៃ</p>`;

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="sm-td-strong py-3.5 px-4">${inv.id}</td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${cust.name}</p>
                            <span class="sm-badge px-2 py-0.5 rounded-full border ${tierTone(cust.tier)} mt-1 inline-block">${tierLabel(cust.tier)}</span>
                        </td>
                        <td class="sm-td py-3.5 px-4 text-slate-500">${fmtKhDate(inv.date)}</td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${fmtKhDate(inv.dueDate)}</p>
                            ${dueNote}
                        </td>
                        <td class="py-3.5 px-4">
                            <span class="sm-badge px-2 py-0.5 rounded-full border ${st.tone}">${st.label}</span>
                        </td>
                        <td class="sm-td-strong py-3.5 px-4 text-right">${fmtUSD(st.totals.grandTotal)}</td>
                        <td class="sm-td-strong py-3.5 px-4 text-right ${st.due > 0 ? 'text-rose-600' : 'text-emerald-600'}">${fmtUSD(st.due)}</td>
                        <td class="py-3.5 px-4 text-right">
                            <button onclick="toggleRowActionMenu(event, '${menuId}')" title="សកម្មភាព"
                                class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-slate-700 border border-slate-200/70 inline-flex items-center justify-center transition">
                                <i class="fas fa-ellipsis-vertical text-sm"></i>
                            </button>
                            <div id="${menuId}" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left">
                                <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                                    <p class="sm-td-sub text-slate-400">សកម្មភាពលើវិក្កយបត្រ</p>
                                    <p class="sm-value text-slate-700">${inv.id}</p>
                                </div>
                                <a href="view-invoice.html?id=${inv.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                    <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0"><i class="fas fa-eye text-[11px]"></i></span>
                                    ពិនិត្យលម្អិត និងបោះពុម្ព
                                </a>
                                ${st.due > 0 ? `
                                <button onclick="remindPayment('${inv.id}')" class="sm-row-menu-item w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-amber-700 hover:bg-amber-50 transition text-left">
                                    <span class="w-7 h-7 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-bell text-[11px]"></i></span>
                                    ផ្ញើការរំលឹកទារប្រាក់
                                </button>` : ''}
                                <a href="tel:${cust.phone.replace(/\s/g, '')}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                    <span class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-phone text-[11px]"></i></span>
                                    ទូរស័ព្ទទៅ ${cust.contact}
                                </a>
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        function remindPayment(id) {
            closeAllFloatingDropdowns();
            const inv = getInvoice(id);
            const cust = getCustomer(inv.customerId);
            showToast(`បានផ្ញើការរំលឹកទារប្រាក់ ${fmtUSD(invoiceState(inv).due)} ជូន ${cust.name}`, 'success');
        }

        window.onDateRangeApplied = renderInvoices;

        document.addEventListener('DOMContentLoaded', () => {
            renderDateRangePicker('dateFilterHost');
            if (filterCustomer && !getCustomer(filterCustomer)) filterCustomer = '';
            renderCustomerChip();
            renderSummary();
            renderTabs();
            renderInvoices();
        });
    </script>
</body>
</html>
