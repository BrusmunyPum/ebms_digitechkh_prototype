<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កែប្រែវិក្កយបត្រ — eBMS v2</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1e3a5f", 'primary-dark': "#142842", accent: "#0ea5e9" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>
<body id="sePortal" data-role-root=".." data-active="invoices" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="កែប្រែវិក្កយបត្រ"
             data-subtitle="កែសម្រួលព័ត៌មានមុខទំនិញ និងលក្ខខណ្ឌទូទាត់"
             data-back="invoices.html"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-6">
            <!-- របារសកម្មភាពទំព័រ — ដកចេញពីក្បាលទំព័រ ដើម្បីរក្សាក្បាលទំព័រឲ្យស្អាត -->
            <div class="w-full flex flex-wrap items-center justify-end gap-2 mb-4 no-print">
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="saveInvoice()" class="sm-badge px-5 py-2.5 rounded-xl bg-[#0f2b5c] hover:bg-[#0a1d3f] text-white font-semibold shadow-sm transition inline-flex items-center gap-2 cursor-pointer">
                        <i class="fas fa-check"></i> <span>រក្សាទុក</span>
                    </button>
                </div>
            </div>

            <div class="w-full grid grid-cols-1 lg:grid-cols-3 gap-6">

                <div class="lg:col-span-2 space-y-6">
                    <!-- Customer -->
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                        <h3 class="sm-card-title text-slate-700 border-b border-slate-100 pb-3 mb-4">អតិថិជន</h3>
                        <div id="customerPickerHost"></div>
                    </div>

                    <!-- Item lines -->
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <h3 class="sm-card-title text-slate-700">មុខទំនិញ</h3>
                                <p class="sm-card-sub text-slate-500">តម្លៃឯកតាកំណត់តាមកម្រិតអតិថិជនដោយស្វ័យប្រវត្តិ</p>
                            </div>
                            <button onclick="addLine()" class="sm-badge px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold transition inline-flex items-center gap-2 cursor-pointer">
                                <i class="fas fa-plus text-xs"></i> បន្ថែមបន្ទាត់
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                    <tr>
                                        <th class="sm-th py-3 px-3">មុខទំនិញ</th>
                                        <th class="sm-th py-3 px-3">ចំនួន</th>
                                        <th class="sm-th py-3 px-3">តម្លៃឯកតា</th>
                                        <th class="sm-th py-3 px-3 text-right">សរុប</th>
                                        <th class="sm-th py-3 px-3"></th>
                                    </tr>
                                </thead>
                                <tbody id="itemLinesBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                            </table>
                        </div>
                        <div id="itemLinesEmpty" class="hidden py-10 px-6 text-center">
                            <p class="sm-card-sub text-slate-500">មិនទាន់មានបន្ទាត់មុខទំនិញទេ</p>
                        </div>
                    </div>

                    <!-- Note -->
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                        <label class="sm-label text-slate-700 font-semibold block mb-2">កំណត់ចំណាំ និងលក្ខខណ្ឌទូទាត់</label>
                        <textarea id="fNote" rows="2" placeholder="ឧទាហរណ៍៖ ទូទាត់តាម ABA KHQR ឬផ្ទេរចូលគណនីក្រុមហ៊ុន..."
                            class="sm-td w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 focus:outline-none focus:border-[#1e3a5f] transition resize-none"></textarea>
                    </div>
                </div>

                <!-- Right sidebar -->
                <div class="space-y-6">
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4">
                        <h3 class="sm-card-title text-slate-700 border-b border-slate-100 pb-3">លក្ខខណ្ឌវិក្កយបត្រ</h3>

                        <div>
                            <label class="sm-label text-slate-600 block mb-1.5">កាលបរិច្ឆេទចេញ</label>
                            <input id="fDate" type="date"
                                class="sm-td w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 focus:outline-none focus:border-[#1e3a5f]">
                        </div>

                        <div>
                            <label class="sm-label text-slate-600 block mb-1.5">កាលកំណត់ទូទាត់</label>
                            <input id="fDueDate" type="date"
                                class="sm-td w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 focus:outline-none focus:border-[#1e3a5f]">
                        </div>

                        <div>
                            <label class="sm-label text-slate-600 block mb-1.5">អ្នកចេញវិក្កយបត្រ</label>
                            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-[#1e3a5f] text-white flex items-center justify-center font-semibold text-xs">សស</div>
                                <div>
                                    <div class="sm-value text-slate-700 font-semibold">សៅ សុខា</div>
                                    <div class="sm-td-sub text-slate-400">បុគ្គលិកប្រតិបត្តិផ្នែកលក់</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Summary Card -->
                    <div id="summaryHost"></div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../doc-editor.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let editInvId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            editInvId = params.get('id');

            const inv = editInvId ? getInvoice(editInvId) : null;
            if (!inv) {
                showToast('រកមិនឃើញវិក្កយបត្រនេះទេ', 'error');
                setTimeout(() => { window.location.href = 'invoices.html'; }, 1200);
                return;
            }
            if (inv.status !== 'ISSUED' || inv.payments.length) {
                showToast('វិក្កយបត្រដែលបានទទួលការទូទាត់ ឬត្រូវបានលុបចោលហើយ មិនអាចកែប្រែបានទេ', 'warning');
                setTimeout(() => { window.location.href = `view-invoice.html?id=${inv.id}`; }, 1400);
                return;
            }

            document.getElementById('portalTitle').innerText = `កែប្រែវិក្កយបត្រ ${inv.id}`;
            setPortalSubtitle(`ស្ថានភាពបច្ចុប្បន្ន៖ ${invoiceState(inv).label}`);
            document.getElementById('fDate').value = inv.date.slice(0, 10);
            document.getElementById('fDate').disabled = true;
            document.getElementById('fDueDate').value = inv.dueDate;
            document.getElementById('fNote').value = inv.note || '';

            DOC_EDITOR.customerId = inv.customerId;
            DOC_EDITOR.items = inv.items.map(it => ({ ...it }));
            DOC_EDITOR.discountPercent = inv.discountPercent || 0;
            DOC_EDITOR.downPayment = inv.downPayment || 0;

            initDocEditor({ mode: 'invoice' });
        });

        async function saveInvoice() {
            const error = validateDoc();
            if (error) return showToast(error, 'error');

            const ok = await showCustomConfirm({
                title: 'រក្សាទុកការកែប្រែ',
                message: `តើលោកអ្នកពិតជារក្សាទុកការកែប្រែវិក្កយបត្រ ${editInvId} មែនទេ?`,
                confirmText: 'រក្សាទុក',
                cancelText: 'បោះបង់'
            });
            if (!ok) return;

            const res = seActions.updateInvoice(editInvId, {
                ...collectDoc(),
                dueDate: document.getElementById('fDueDate').value,
                note: document.getElementById('fNote').value.trim()
            });
            if (!res.ok) return showToast(res.error, 'error');

            showToast(`បានរក្សាទុកការកែប្រែវិក្កយបត្រ ${editInvId} ដោយជោគជ័យ`, 'success');
            setTimeout(() => { window.location.href = `view-invoice.html?id=${editInvId}`; }, 800);
        }
    </script>
</body>
</html>
