<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - អតិថិជនរបស់ខ្ញុំ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1e3a5f", 'primary-dark': "#142842", accent: "#0ea5e9" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
    <style>
        /* ផ្ទាំងកាតអតិថិជន — ទទឹងអប្បបរមា 280px តាមឯកសាររចនាលេខ 04 ផ្នែក 3.2 */
        #customerGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
    </style>
</head>
<body id="sePortal" data-role-root=".." data-active="customers" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="អតិថិជនរបស់ខ្ញុំ"
             data-subtitle="បញ្ជីអតិថិជនដែលខ្ញុំទទួលបន្ទុក ជាមួយបំណុល និងការប្រើប្រាស់ឥណទាន"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- របារស្វែងរក និងសកម្មភាព -->
                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="relative flex-1 min-w-[240px]">
                            <i class="fas fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input id="searchInput" type="text" oninput="debouncedSearch()"
                                placeholder="ស្វែងរកតាមឈ្មោះ លេខកូដ ឬលេខទូរស័ព្ទ..."
                                class="sm-td w-full h-10 pl-10 pr-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 focus:outline-none focus:border-[#1e3a5f] focus:bg-white transition">
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <div id="tierFilterHost" class="relative"></div>
                            <span class="w-px h-6 bg-slate-200 hidden sm:!block"></span>
                            <a href="create-customer.html" class="sm-badge inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#0f2b5c] hover:bg-[#0a1d3f] text-white font-semibold shadow-sm transition">
                                <i class="fas fa-user-plus"></i> <span class="hidden sm:!inline">បន្ថែមអតិថិជន</span>
                            </a>
                        </div>
                    </div>

                    <!-- គ្រាប់តម្រង -->
                    <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-3">
                        <div id="filterPills" class="flex flex-wrap items-center gap-2"></div>
                        <span id="resultCount" class="sm-badge text-slate-500 flex-shrink-0"></span>
                    </div>
                </div>

                <!-- ផ្ទាំងកាត -->
                <div id="customerGrid"></div>

                <div id="customerEmpty" class="hidden bg-white rounded-2xl border border-slate-200/80 shadow-sm py-16 px-6 text-center">
                    <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-user-slash text-2xl"></i>
                    </div>
                    <h3 class="sm-card-title text-slate-700">រកមិនឃើញអតិថិជន</h3>
                    <p class="sm-card-sub text-slate-500 mt-1">សូមកែពាក្យស្វែងរក ឬជម្រះតម្រង។</p>
                    <div class="flex flex-wrap items-center justify-center gap-2 mt-4">
                        <button onclick="clearFilters()" class="sm-badge px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">ជម្រះតម្រង</button>
                        <a href="create-customer.html" class="sm-badge px-4 py-2 rounded-xl bg-[#0f2b5c] hover:bg-[#0a1d3f] text-white font-semibold transition">បន្ថែមអតិថិជន</a>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let filterTier = '';
        let filterPill = 'all';
        let searchTimer = null;

        const PILLS = [
            { id: 'all', label: 'ទាំងអស់' },
            { id: 'active', label: 'សកម្ម' },
            { id: 'overdue', label: 'បំណុលហួសកាលកំណត់' }
        ];

        /* ពណ៌រូបតំណាង — ជ្រើសពីក្តារពណ៌ស្ងប់ស្ងាត់តាមឈ្មោះ ដើម្បីកុំឱ្យក្លាយជាឥន្ទធនូ */
        const AVATAR_TONES = [
            'bg-slate-100 text-slate-600', 'bg-sky-100 text-sky-700', 'bg-emerald-100 text-emerald-700',
            'bg-amber-100 text-amber-700', 'bg-violet-100 text-violet-700', 'bg-teal-100 text-teal-700'
        ];

        function avatarTone(name) {
            let sum = 0;
            for (const ch of String(name)) sum += ch.codePointAt(0);
            return AVATAR_TONES[sum % AVATAR_TONES.length];
        }

        function debouncedSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderCustomers, 300);
        }

        function renderTierFilter() {
            const options = [{ value: '', label: 'កម្រិតទាំងអស់' }]
                .concat(Object.keys(TIER_LABEL).map(k => ({ value: k, label: TIER_LABEL[k] })));
            const active = options.find(o => o.value === filterTier);

            document.getElementById('tierFilterHost').innerHTML = `
                <button onclick="toggleRowActionMenu(event, 'tierFilterMenu')" type="button"
                    class="h-10 px-3.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-xl inline-flex items-center gap-2 transition focus:outline-none cursor-pointer">
                    <i class="fas fa-layer-group text-slate-400 text-xs"></i>
                    <span class="sm-badge font-medium text-slate-700">${active.label}</span>
                    <i class="fas fa-chevron-down text-[10px] text-slate-400"></i>
                </button>
                <div id="tierFilterMenu" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left">
                    <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                        <p class="sm-td-sub text-slate-400">ជ្រើសរើសកម្រិតអតិថិជន</p>
                    </div>
                    ${options.map(o => `
                        <button onclick="pickTier('${o.value}')" class="sm-row-menu-item w-full flex items-center justify-between gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition text-left">
                            <span>${o.label}</span>
                            ${o.value === filterTier ? '<i class="fas fa-check text-[11px] text-emerald-600"></i>' : ''}
                        </button>`).join('')}
                </div>`;
        }

        function pickTier(value) {
            filterTier = value;
            closeAllFloatingDropdowns();
            renderTierFilter();
            renderCustomers();
        }

        function pickPill(id) {
            filterPill = id;
            renderPills();
            renderCustomers();
        }

        function clearFilters() {
            filterTier = '';
            filterPill = 'all';
            document.getElementById('searchInput').value = '';
            renderTierFilter();
            renderPills();
            renderCustomers();
        }

        /* សកម្ម = មានការទិញក្នុងរយៈពេល 90 ថ្ងៃចុងក្រោយ */
        function isActive(c) {
            return c.lastOrder && daysBetween(c.lastOrder) <= 90;
        }

        function matchPill(c) {
            if (filterPill === 'active') return isActive(c);
            if (filterPill === 'overdue') return c.overdueCount > 0;
            return true;
        }

        function renderPills() {
            const all = customerCards();
            document.getElementById('filterPills').innerHTML = PILLS.map(p => {
                const saved = filterPill;
                filterPill = p.id;
                const count = all.filter(matchPill).length;
                filterPill = saved;
                const active = filterPill === p.id;
                return `<button onclick="pickPill('${p.id}')" type="button"
                    class="sm-badge px-4 py-1.5 rounded-full border transition ${active
                        ? 'bg-[#1e3a5f] text-white border-[#1e3a5f] font-semibold'
                        : 'bg-white text-[#1e3a5f] border-slate-200 hover:border-[#1e3a5f] font-medium'}">${p.label} (${count})</button>`;
            }).join('');
        }

        function creditBar(c) {
            if (!c.creditLimit) return '';
            const tone = c.usage > 90 ? '#f43f5e' : c.usage >= 70 ? '#f59e0b' : '#10b981';
            return `
                <div class="mt-3">
                    <div class="flex items-baseline justify-between gap-2">
                        <span class="sm-td-sub text-slate-500">ការប្រើប្រាស់ឥណទាន</span>
                        <span class="sm-td-sub text-slate-500 sm-figure">${fmtUSD(c.debt)} / ${fmtUSD(c.creditLimit)}</span>
                    </div>
                    <div class="sm-rail mt-1.5" style="height:6px">
                        <span style="width:${c.usage}%;background-color:${tone}"></span>
                    </div>
                </div>`;
        }

        function arRow(c) {
            if (c.overdueCount) {
                return `<span class="sm-value text-rose-600 sm-figure inline-flex items-center gap-1.5">
                    <i class="fas fa-triangle-exclamation text-[11px]"></i> ${fmtUSD(c.debt)}
                </span>`;
            }
            if (c.debt > 0) return `<span class="sm-value text-rose-600 sm-figure">${fmtUSD(c.debt)}</span>`;
            return '<span class="sm-value text-emerald-600 inline-flex items-center gap-1.5"><i class="fas fa-check text-[11px]"></i> គ្មាន</span>';
        }

        function renderCustomers() {
            const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const all = customerCards();
            const rows = all
                .filter(matchPill)
                .filter(c => !filterTier || c.tier === filterTier)
                .filter(c => !q || c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.phone.includes(q))
                .sort((a, b) => b.overdueAmount - a.overdueAmount || b.debt - a.debt);

            document.getElementById('resultCount').textContent = `បង្ហាញ ${rows.length} ក្នុងចំណោម ${all.length} អតិថិជន`;

            const grid = document.getElementById('customerGrid');
            const empty = document.getElementById('customerEmpty');
            if (!rows.length) {
                grid.innerHTML = '';
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            grid.classList.remove('hidden');
            empty.classList.add('hidden');

            grid.innerHTML = rows.map(c => {
                const menuId = 'custMenu-' + c.id;
                const tel = String(c.phone).replace(/\s/g, '');
                return `
                <article class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col ${c.overdueCount ? 'border-l-[3px] border-l-rose-400' : ''}">
                    <div class="p-4 flex-1">
                        <div class="flex items-start gap-3">
                            <div class="w-12 h-12 rounded-2xl ${avatarTone(c.name)} flex items-center justify-center flex-shrink-0 text-lg font-semibold">
                                ${customerInitial(c.name)}
                            </div>
                            <div class="min-w-0 flex-1">
                                <p class="sm-value text-slate-700 truncate">${c.name}</p>
                                <div class="flex flex-wrap items-center gap-1.5 mt-1">
                                    <span class="sm-badge px-2 py-0.5 rounded-full border ${tierTone(c.tier)}">${tierLabel(c.tier)}</span>
                                    <span class="sm-td-sub text-slate-400 sm-figure">${c.code}</span>
                                </div>
                            </div>
                            <div class="flex-shrink-0">
                                <button onclick="toggleRowActionMenu(event, '${menuId}')" type="button"
                                    class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-slate-700 border border-slate-200/70 inline-flex items-center justify-center transition">
                                    <i class="fas fa-ellipsis-vertical text-sm"></i>
                                </button>
                                <div id="${menuId}" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left">
                                    <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                                        <p class="sm-td-sub text-slate-400">សកម្មភាពលើអតិថិជន</p>
                                        <p class="sm-value text-slate-700 sm-figure">${c.code}</p>
                                    </div>
                                    <a href="edit-customer.html?id=${c.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                        <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0"><i class="fas fa-pen text-[11px]"></i></span>
                                        កែប្រែព័ត៌មាន
                                    </a>
                                    <a href="../invoices/create-invoice.html?customer=${c.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                        <span class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-receipt text-[11px]"></i></span>
                                        ចេញវិក្កយបត្រ
                                    </a>
                                    <a href="../quotes/quotes.html?tab=invoices&customer=${c.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                        <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0"><i class="fas fa-clock-rotate-left text-[11px]"></i></span>
                                        ប្រវត្តិវិក្កយបត្រ
                                    </a>
                                    <a href="tel:${tel}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                        <span class="w-7 h-7 rounded-lg bg-teal-100 text-teal-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-phone text-[11px]"></i></span>
                                        ទូរស័ព្ទទៅ ${c.contact}
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3.5 pt-3.5 border-t border-slate-100 space-y-1.5">
                            <p class="sm-td-sub text-slate-500 flex items-center gap-2">
                                <i class="fas fa-phone text-slate-300 text-[11px] w-3.5"></i>
                                <span class="sm-figure">${c.phone}</span>
                            </p>
                            <p class="sm-td-sub text-slate-500 flex items-center gap-2">
                                <i class="fas fa-calendar-day text-slate-300 text-[11px] w-3.5"></i>
                                ${c.lastOrder ? `ទិញចុងក្រោយ ${fmtKhDate(c.lastOrder)}` : 'មិនទាន់មានការទិញ'}
                            </p>
                        </div>

                        <div class="mt-3 flex items-baseline justify-between gap-2">
                            <span class="sm-td-sub text-slate-500">បំណុលនៅជំពាក់</span>
                            ${arRow(c)}
                        </div>
                        ${creditBar(c)}
                    </div>

                    <div class="px-4 py-3 border-t border-slate-100 bg-slate-50/60 flex items-center gap-2">
                        <a href="view-customer.html?id=${c.id}"
                           class="sm-badge flex-1 text-center px-3 py-2 rounded-xl border border-[#1e3a5f]/25 text-[#1e3a5f] hover:bg-[#1e3a5f] hover:text-white font-semibold transition">មើល</a>
                        <a href="../quotes/create-quote.html?customer=${c.id}"
                           class="sm-badge flex-1 text-center px-3 py-2 rounded-xl border border-[#1e3a5f]/25 text-[#1e3a5f] hover:bg-[#1e3a5f] hover:text-white font-semibold transition">សម្រង់ថ្មី</a>
                    </div>
                </article>`;
            }).join('');
        }

        function refreshAll() {
            renderPills();
            renderCustomers();
        }

        window.onStoreChanged = refreshAll;

        document.addEventListener('DOMContentLoaded', () => {
            renderTierFilter();
            renderPills();
            renderCustomers();
            updatePortalBadges();
        });
    </script>
</body>
</html>
