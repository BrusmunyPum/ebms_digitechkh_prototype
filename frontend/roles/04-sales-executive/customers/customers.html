<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - អតិថិជនរបស់ខ្ញុំ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1e3a5f", 'primary-dark': "#142842", accent: "#0ea5e9" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>
<body id="sePortal" data-role-root=".." data-active="customers" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="អតិថិជនរបស់ខ្ញុំ"
             data-subtitle="បញ្ជីអតិថិជនដែលខ្ញុំទទួលបន្ទុក ជាមួយកម្រិត និងពិដានឥណទាន"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- Filters -->
                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-2">
                        <div class="relative">
                            <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input id="searchInput" type="text" oninput="renderCustomers()" placeholder="ស្វែងរកឈ្មោះ លេខកូដ ឬលេខទូរស័ព្ទ..."
                                class="sm-td h-9 pl-9 pr-3 w-[280px] max-w-full rounded-xl bg-slate-50 border border-slate-200 text-slate-700 focus:outline-none focus:border-[#1e3a5f] transition">
                        </div>
                        <div id="tierFilterHost" class="relative"></div>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <span id="resultCount" class="sm-badge text-slate-500"></span>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <a href="create-customer.html" class="sm-badge inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#0f2b5c] hover:bg-[#0a1d3f] text-white font-semibold shadow-sm transition">
                                <i class="fas fa-user-plus"></i> <span class="hidden sm:inline">ចុះឈ្មោះអតិថិជនថ្មី</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                <tr>
                                    <th class="sm-th py-3.5 px-4">លេខកូដ</th>
                                    <th class="sm-th py-3.5 px-4">ឈ្មោះអតិថិជន</th>
                                    <th class="sm-th py-3.5 px-4">កម្រិត</th>
                                    <th class="sm-th py-3.5 px-4">ទំនាក់ទំនង</th>
                                    <th class="sm-th py-3.5 px-4">ពិដានឥណទាន</th>
                                    <th class="sm-th py-3.5 px-4">ការប្រើប្រាស់ឥណទាន</th>
                                    <th class="sm-th py-3.5 px-4 text-right">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="customerBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                        </table>
                    </div>
                    <div id="customerEmpty" class="hidden py-14 px-6 text-center">
                        <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-user-slash text-2xl"></i>
                        </div>
                        <h3 class="sm-card-title text-slate-700">រកមិនឃើញអតិថិជនទេ</h3>
                        <p class="sm-card-sub text-slate-500 mt-1">សូមកែសម្រួលពាក្យស្វែងរក ឬតម្រងកម្រិតអតិថិជន។</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let filterTier = '';

        function customerDebt(id) {
            return INVOICES.filter(i => i.customerId === id)
                .reduce((sum, i) => sum + invoiceState(i).due, 0);
        }

        function renderTierFilter() {
            const options = [{ value: '', label: 'កម្រិតទាំងអស់' }]
                .concat(Object.keys(TIER_LABEL).map(k => ({ value: k, label: TIER_LABEL[k] })));
            const active = options.find(o => o.value === filterTier);

            document.getElementById('tierFilterHost').innerHTML = `
                <button onclick="toggleRowActionMenu(event, 'tierFilterMenu')" type="button"
                    class="h-9 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-xl inline-flex items-center gap-2 shadow-sm transition-all focus:outline-none cursor-pointer">
                    <i class="fas fa-layer-group text-primary text-xs"></i>
                    <span class="sm-badge font-medium text-slate-800">${active.label}</span>
                    <i class="fas fa-chevron-down text-[10px] text-slate-400 ml-0.5"></i>
                </button>
                <div id="tierFilterMenu" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left">
                    <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                        <p class="sm-td-sub text-slate-400">ជ្រើសរើសកម្រិតអតិថិជន</p>
                    </div>
                    ${options.map(o => `
                        <button onclick="pickTier('${o.value}')" class="sm-row-menu-item w-full flex items-center justify-between gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition text-left">
                            <span>${o.label}</span>
                            ${o.value === filterTier ? '<i class="fas fa-check text-[11px] text-emerald-600"></i>' : ''}
                        </button>`).join('')}
                </div>`;
        }

        function pickTier(value) {
            filterTier = value;
            closeAllFloatingDropdowns();
            renderTierFilter();
            renderCustomers();
        }

        function renderCustomers() {
            const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const rows = CUSTOMERS
                .filter(c => !filterTier || c.tier === filterTier)
                .filter(c => !q || c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.phone.includes(q));

            document.getElementById('resultCount').textContent = `បង្ហាញ ${rows.length} ក្នុងចំណោម ${CUSTOMERS.length} អតិថិជន`;

            const body = document.getElementById('customerBody');
            const empty = document.getElementById('customerEmpty');
            if (!rows.length) {
                body.innerHTML = '';
                body.parentElement.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            body.parentElement.classList.remove('hidden');
            empty.classList.add('hidden');

            body.innerHTML = rows.map(c => {
                const debt = customerDebt(c.id);
                const usage = Math.min((debt / c.creditLimit) * 100, 100);
                const barTone = usage >= 100 ? 'bg-rose-500' : usage > 80 ? 'bg-amber-500' : 'bg-emerald-500';
                const menuId = 'custMenu-' + c.id;

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="sm-td-strong py-3.5 px-4">${c.code}</td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${c.name}</p>
                            <p class="sm-td-sub text-slate-400">អតិថិជនតាំងពី ${fmtKhDate(c.since)}</p>
                        </td>
                        <td class="py-3.5 px-4">
                            <span class="sm-badge px-2 py-0.5 rounded-full border ${tierTone(c.tier)}">${tierLabel(c.tier)}</span>
                        </td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${c.contact}</p>
                            <p class="sm-td-sub text-slate-400">${c.phone}</p>
                        </td>
                        <td class="sm-td py-3.5 px-4">${fmtUSD(c.creditLimit)}</td>
                        <td class="py-3.5 px-4 min-w-[170px]">
                            <div class="flex items-center justify-between gap-2">
                                <span class="sm-td-sub text-slate-500">${fmtUSD(debt)}</span>
                                <span class="sm-td-sub text-slate-400">${fmtPercent(usage, 0)}</span>
                            </div>
                            <div class="w-full h-1.5 rounded-full bg-slate-100 overflow-hidden mt-1">
                                <div class="h-full ${barTone} rounded-full" style="width: ${usage}%"></div>
                            </div>
                        </td>
                        <td class="py-3.5 px-4 text-right">
                            <button onclick="toggleRowActionMenu(event, '${menuId}')" title="សកម្មភាព"
                                class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-slate-700 border border-slate-200/70 inline-flex items-center justify-center transition">
                                <i class="fas fa-ellipsis-vertical text-sm"></i>
                            </button>
                            <div id="${menuId}" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left">
                                <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                                    <p class="sm-td-sub text-slate-400">សកម្មភាពលើអតិថិជន</p>
                                    <p class="sm-value text-slate-700">${c.code}</p>
                                </div>
                                <a href="../quotes/create-quote.html?customer=${c.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                    <span class="w-7 h-7 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-file-circle-plus text-[11px]"></i></span>
                                    បង្កើតសម្រង់តម្លៃ
                                </a>
                                <a href="../invoices/create-invoice.html?customer=${c.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                    <span class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-receipt text-[11px]"></i></span>
                                    បង្កើតវិក្កយបត្រ
                                </a>
                                <a href="../invoices/invoices.html?customer=${c.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                    <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0"><i class="fas fa-clock-rotate-left text-[11px]"></i></span>
                                    ប្រវត្តិវិក្កយបត្រ
                                </a>
                                <a href="tel:${c.phone.replace(/\s/g, '')}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                                    <span class="w-7 h-7 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-phone text-[11px]"></i></span>
                                    ទូរស័ព្ទទៅ ${c.phone}
                                </a>
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTierFilter();
            renderCustomers();
        });
    </script>
</body>
</html>
