<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កែប្រែព័ត៌មានអតិថិជន — eBMS v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a5f',
                        'primary-dark': '#142842',
                        accent: '#10b981'
                    },
                    fontFamily: {
                        sans: ['"Kantumruy Pro"', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased" data-portal="sePortal" data-role-root="../" data-active="customers">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebarHost"></div>

        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Header (72px aligned) -->
        <div id="headerHost" data-title="កែប្រែព័ត៌មានអតិថិជន"
                 data-subtitle="ធ្វើបច្ចុប្បន្នភាពព័ត៌មានក្រុមហ៊ុន និងអាសយដ្ឋានទំនាក់ទំនង"
                 data-back="customers.html"></div>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto p-6">
            <!-- របារសកម្មភាពទំព័រ — ដកចេញពីក្បាលទំព័រ ដើម្បីរក្សាក្បាលទំព័រឲ្យស្អាត -->
            <div class="w-full max-w-4xl flex flex-wrap items-center justify-end gap-2 mb-4 no-print">
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" onclick="history.back()" class="h-10 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-medium transition cursor-pointer">
                        បោះបង់
                    </button>
                    <button type="button" onclick="saveCustomerEdit()" class="h-10 px-5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium flex items-center gap-2 shadow-sm transition cursor-pointer">
                        <i class="fas fa-save text-xs"></i>
                        <span>រក្សាទុកការកែប្រែ</span>
                    </button>
                </div>
            </div>

                <form id="editCustForm" onsubmit="event.preventDefault(); saveCustomerEdit();" class="max-w-4xl space-y-6">
                    <!-- Section 1: Basic Info -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
                        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                            <i class="fas fa-building text-slate-500"></i>
                            <span>ព័ត៌មានក្រុមហ៊ុន & ចំណាត់ថ្នាក់</span>
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">ឈ្មោះក្រុមហ៊ុន / អតិថិជន <span class="text-rose-500">*</span></label>
                                <input type="text" id="custNameInput" required class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">កម្រិតអតិថិជន (Tier) <span class="text-rose-500">*</span></label>
                                <select id="custTierSelect" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500">
                                    <option value="retail">អតិថិជនរាយ</option>
                                    <option value="wholesale">អតិថិជនដុំ</option>
                                    <option value="vip">តំណាងចែកចាយ · VIP</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">កម្រិតឥណទាន (Credit Limit USD)</label>
                                <input type="number" id="custCreditLimitInput" step="100" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500 font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">លក្ខខណ្ឌទូទាត់ (ថ្ងៃ)</label>
                                <input type="number" id="custTermsInput" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500 font-mono">
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Contact Info -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
                        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                            <i class="fas fa-user-tie text-slate-500"></i>
                            <span>ព័ត៌មានទំនាក់ទំនង & ទីតាំង</span>
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">បុគ្គលទំនាក់ទំនង <span class="text-rose-500">*</span></label>
                                <input type="text" id="custContactInput" required class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">លេខទូរស័ព្ទ <span class="text-rose-500">*</span></label>
                                <input type="text" id="custPhoneInput" required class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500 font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">អ៊ីមែល</label>
                                <input type="email" id="custEmailInput" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1.5">អាសយដ្ឋានលម្អិត</label>
                            <textarea id="custAddressInput" rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-slate-500"></textarea>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let editCust = null;

        function loadCustomerForm() {
            const urlParams = new URLSearchParams(window.location.search);
            editCust = getCustomer(urlParams.get('id')) || listCustomers()[0];

            if (!editCust) return;

            document.getElementById('portalTitle').innerText = `កែប្រែព័ត៌មាន — ${editCust.name}`;
            document.getElementById('custNameInput').value = editCust.name;
            document.getElementById('custTierSelect').value = editCust.tier;
            document.getElementById('custCreditLimitInput').value = editCust.creditLimit;
            document.getElementById('custTermsInput').value = editCust.paymentTerms;
            document.getElementById('custContactInput').value = editCust.contact;
            document.getElementById('custPhoneInput').value = editCust.phone;
            document.getElementById('custEmailInput').value = editCust.email || '';
            document.getElementById('custAddressInput').value = editCust.address;
        }

        function saveCustomerEdit() {
            if (!editCust) return;
            const name = document.getElementById('custNameInput').value.trim();
            if (!name) return showToast('សូមបញ្ចូលឈ្មោះអតិថិជន ឬក្រុមហ៊ុន', 'error');
            const res = seActions.updateCustomer(editCust.id, {
                name,
                tier: document.getElementById('custTierSelect').value,
                creditLimit: parseFloat(document.getElementById('custCreditLimitInput').value) || 0,
                paymentTerms: parseInt(document.getElementById('custTermsInput').value) || 0,
                contact: document.getElementById('custContactInput').value.trim(),
                phone: document.getElementById('custPhoneInput').value.trim(),
                email: document.getElementById('custEmailInput').value.trim(),
                address: document.getElementById('custAddressInput').value.trim()
            });
            if (!res.ok) return showToast(res.error, 'error');

            showToast(`បានរក្សាទុកព័ត៌មានអតិថិជន ${name} ដោយជោគជ័យ` + (res.creditRequested ? ' · សំណើបង្កើនពិដានឥណទានបានផ្ញើទៅអ្នកគ្រប់គ្រង' : ''), 'success');
            setTimeout(() => {
                window.location.href = `view-customer.html?id=${editCust.id}`;
            }, 700);
        }

        document.addEventListener('DOMContentLoaded', loadCustomerForm);
    </script>
</body>
</html>
