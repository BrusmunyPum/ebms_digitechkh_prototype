<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ផ្ទាំងការងារបុគ្គលិកលក់</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1e3a5f", 'primary-dark': "#142842", accent: "#0ea5e9" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="sePortal" data-role-root="." data-active="dashboard" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ផ្ទាំងការងាររបស់ខ្ញុំ"
             data-subtitle="សូមស្វាគមន៍ សៅ សុខា · តាមដានគោលដៅ សម្រង់តម្លៃ និងការប្រមូលប្រាក់"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-5">

                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-filter text-slate-400 text-xs"></i>
                        <span class="sm-label text-slate-600">ទិន្នន័យក្នុងកំឡុងពេល</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <div id="dateFilterHost" class="flex items-center"></div>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <a href="quotes/create-quote.html" class="sm-badge hidden sm:inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#0f2b5c] hover:bg-[#0a1d3f] text-white font-semibold shadow-sm transition">
                                <i class="fas fa-plus"></i> បង្កើតសម្រង់តម្លៃ
                            </a>
                        </div>
                    </div>
                </div>

                <div id="kpiRow" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

                <!-- Quota + Commission -->
                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <div>
                            <h3 class="sm-card-title text-slate-700">គោលដៅលក់ផ្ទាល់ខ្លួន</h3>
                            <p id="quotaSubtitle" class="sm-card-sub text-slate-500"></p>
                        </div>
                        <span id="quotaBadge" class="sm-badge px-3 py-1 rounded-full border"></span>
                    </div>
                    <div class="w-full h-3 rounded-full bg-slate-100 overflow-hidden">
                        <div id="quotaBar" class="h-full bg-[#1e3a5f] rounded-full transition-all" style="width: 0%"></div>
                    </div>
                    <div id="quotaStats" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4"></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                    <!-- Follow-ups -->
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden lg:col-span-1 order-2 lg:order-1">
                        <div class="p-4 border-b border-slate-100 flex items-center gap-2">
                            <i class="fas fa-bell text-amber-500 text-sm"></i>
                            <h3 class="sm-card-title text-slate-700">ការរំលឹកតាមដានអតិថិជន</h3>
                        </div>
                        <div id="followUpList" class="divide-y divide-slate-100 max-h-[420px] overflow-y-auto scrollbar-hide"></div>
                    </div>

                    <!-- Weekly chart -->
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm lg:col-span-2 order-1 lg:order-2">
                        <div class="mb-3">
                            <h3 class="sm-card-title text-slate-700">ការលក់ប្រចាំសប្តាហ៍របស់ខ្ញុំ</h3>
                            <p class="sm-card-sub text-slate-500">ទឹកប្រាក់វិក្កយបត្រដែលបានចេញក្នុងខែនេះ</p>
                        </div>
                        <div id="weeklyChart" class="w-full h-64"></div>
                    </div>
                </div>

                <!-- Recent documents -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-100 flex items-center justify-between gap-2">
                            <h3 class="sm-card-title text-slate-700">សម្រង់តម្លៃថ្មីៗ</h3>
                            <a href="quotes/quotes.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline">មើលទាំងអស់</a>
                        </div>
                        <div id="recentQuotes" class="divide-y divide-slate-100"></div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-100 flex items-center justify-between gap-2">
                            <h3 class="sm-card-title text-slate-700">វិក្កយបត្រត្រូវតាមដានការទូទាត់</h3>
                            <a href="invoices/invoices.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline">មើលទាំងអស់</a>
                        </div>
                        <div id="recentInvoices" class="divide-y divide-slate-100"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/data/seed.js"></script>
    <script src="../../shared/scripts/status-meta.js"></script>
    <script src="../../shared/scripts/store.js"></script>
    <script src="data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        function kpiCard(opts) {
            return `
                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                    <div class="flex items-center justify-between mb-2 gap-2">
                        <span class="sm-kpi-label text-slate-500">${opts.label}</span>
                        <div class="w-9 h-9 rounded-xl bg-${opts.tone}-50 text-${opts.tone}-600 flex items-center justify-center flex-shrink-0">
                            <i class="fas ${opts.icon} text-sm"></i>
                        </div>
                    </div>
                    <h3 class="sm-kpi-value text-slate-700">${opts.value}</h3>
                    <p class="sm-kpi-sub ${opts.subTone || 'text-slate-500'} mt-1">${opts.sub}</p>
                </div>`;
        }

        function renderKpis(m) {
            document.getElementById('kpiRow').innerHTML =
                kpiCard({
                    label: 'ចំណូលលក់របស់ខ្ញុំ', icon: 'fa-chart-line', tone: 'emerald',
                    value: fmtUSD(m.revenue),
                    sub: `${m.invoiceCount} វិក្កយបត្រ · សម្រេច ${fmtPercent(m.quotaPercent)} នៃគោលដៅ`,
                    subTone: 'text-emerald-600 font-semibold'
                }) +
                `<a href="quotes/quotes.html" class="block bg-white rounded-2xl p-5 border-2 border-amber-200 shadow-sm bg-amber-50/20 hover:border-amber-300 transition">
                    <div class="flex items-center justify-between mb-2 gap-2">
                        <span class="sm-kpi-label text-amber-700 font-semibold">សម្រង់តម្លៃរង់ចាំការអនុម័ត</span>
                        <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-hourglass-half text-sm"></i>
                        </div>
                    </div>
                    <h3 class="sm-kpi-value text-amber-700">${m.pendingCount} <span class="sm-kpi-unit text-amber-600">សំណើ</span></h3>
                    <p class="sm-kpi-sub text-amber-700 font-semibold mt-1">រង់ចាំ ${CURRENT_REP.manager} សម្រេច</p>
                </a>` +
                kpiCard({
                    label: 'ប្រាក់ត្រូវប្រមូល', icon: 'fa-hand-holding-dollar', tone: 'blue',
                    value: fmtUSD(m.receivable),
                    sub: m.overdueAmount > 0 ? `ក្នុងនោះ ${fmtUSD(m.overdueAmount)} ហួសកាលកំណត់` : 'គ្មានបំណុលហួសកាលកំណត់',
                    subTone: m.overdueAmount > 0 ? 'text-rose-600 font-semibold' : 'text-emerald-600 font-semibold'
                }) +
                kpiCard({
                    label: 'អត្រាបិទការលក់', icon: 'fa-bullseye', tone: 'purple',
                    value: fmtPercent(m.winRate),
                    sub: `${m.convertedCount} ក្នុងចំណោម ${m.quoteCount} សម្រង់តម្លៃ`
                });
        }

        function renderQuota(m) {
            const pct = Math.min(m.quotaPercent, 100);
            const tone = m.quotaPercent >= 100 ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                : m.quotaPercent >= 70 ? 'bg-blue-50 text-blue-700 border-blue-200'
                : 'bg-amber-50 text-amber-700 border-amber-200';

            document.getElementById('quotaSubtitle').textContent =
                `គោលដៅប្រចាំខែ ${fmtUSD(m.target)} · សម្រេចបាន ${fmtUSD(m.revenue)}`;
            const badge = document.getElementById('quotaBadge');
            badge.textContent = `សម្រេច ${fmtPercent(m.quotaPercent)}`;
            badge.className = `sm-badge px-3 py-1 rounded-full border ${tone}`;
            document.getElementById('quotaBar').style.width = pct + '%';

            document.getElementById('quotaStats').innerHTML = `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <span class="sm-kpi-sub text-slate-500 block">នៅខ្វះដើម្បីសម្រេចគោលដៅ</span>
                    <span class="sm-value text-slate-700">${fmtUSD(Math.max(m.target - m.revenue, 0))}</span>
                </div>
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <span class="sm-kpi-sub text-slate-500 block">ប្រាក់ដែលខ្ញុំប្រមូលបាន</span>
                    <span class="sm-value text-slate-700">${fmtUSD(m.collected)}</span>
                </div>
                <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-100">
                    <span class="sm-kpi-sub text-emerald-700 block">កម្រៃជើងសារប៉ាន់ស្មាន ${fmtPercent(CURRENT_REP.commissionRate)}</span>
                    <span class="sm-value text-emerald-700">${fmtUSD(m.commission)}</span>
                </div>`;
        }

        function renderFollowUps() {
            const rows = followUps();
            const iconOf = { quote: 'fa-file-lines', payment: 'fa-money-bill-wave', lead: 'fa-user-plus' };
            const toneOf = {
                overdue: { box: 'bg-rose-100 text-rose-600', label: 'text-rose-600 font-semibold' },
                today: { box: 'bg-amber-100 text-amber-600', label: 'text-amber-600 font-semibold' },
                upcoming: { box: 'bg-slate-100 text-slate-500', label: 'text-slate-500' }
            };

            document.getElementById('followUpList').innerHTML = rows.map(f => {
                const t = toneOf[f.urgency];
                const when = f.urgency === 'overdue' ? `ហួស ${f.late} ថ្ងៃ`
                    : f.urgency === 'today' ? 'ត្រូវធ្វើថ្ងៃនេះ'
                    : `នៅសល់ ${Math.abs(f.late)} ថ្ងៃ`;
                return `
                    <div class="p-4 flex items-start gap-3">
                        <div class="w-9 h-9 rounded-xl ${t.box} flex items-center justify-center flex-shrink-0">
                            <i class="fas ${iconOf[f.type]} text-xs"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="sm-td text-slate-700 truncate">${f.customer.name}</p>
                            <p class="sm-td-sub text-slate-500 mt-0.5">${f.note}</p>
                            <p class="sm-td-sub ${t.label} mt-1">${f.refId} · ${when}</p>
                        </div>
                    </div>`;
            }).join('');
        }

        function renderRecent() {
            const quotes = listQuotes().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 4);
            document.getElementById('recentQuotes').innerHTML = quotes.map(q => {
                const cust = getCustomer(q.customerId);
                const exp = quoteExpiry(q);
                return `
                    <a href="quotes/view-quote.html?id=${q.id}" class="p-4 flex items-center justify-between gap-3 hover:bg-slate-50 transition">
                        <div class="min-w-0">
                            <p class="sm-td text-slate-700 truncate">${cust.name}</p>
                            <p class="sm-td-sub text-slate-400">${q.id} · ${exp.label}</p>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="sm-td-strong text-slate-700">${fmtUSD(docTotals(q).grandTotal)}</p>
                            <span class="mt-1 inline-block">${statusBadge(q.status)}</span>
                        </div>
                    </a>`;
            }).join('');

            const invs = listInvoices()
                .filter(i => !['PAID', 'CANCELLED'].includes(invoiceState(i).key))
                .sort((a, b) => invoiceState(b).overdueDays - invoiceState(a).overdueDays)
                .slice(0, 4);
            document.getElementById('recentInvoices').innerHTML = invs.map(inv => {
                const cust = getCustomer(inv.customerId);
                const st = invoiceState(inv);
                return `
                    <a href="invoices/view-invoice.html?id=${inv.id}" class="p-4 flex items-center justify-between gap-3 hover:bg-slate-50 transition">
                        <div class="min-w-0">
                            <p class="sm-td text-slate-700 truncate">${cust.name}</p>
                            <p class="sm-td-sub text-slate-400">${inv.id} · ផុតកំណត់ ${fmtKhDate(inv.dueDate)}</p>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="sm-td-strong text-slate-700">${fmtUSD(st.due)}</p>
                            <span class="mt-1 inline-block">${statusBadge(st.key)}</span>
                        </div>
                    </a>`;
            }).join('');
        }

        function renderDashboard() {
            const m = myMetrics(getSelectedRange());
            renderKpis(m);
            renderQuota(m);
            renderFollowUps();
            renderRecent();
            updatePortalBadges();
        }

        window.onDateRangeApplied = renderDashboard;
        window.onStoreChanged = renderDashboard;

        document.addEventListener('DOMContentLoaded', () => {
            renderDateRangePicker('dateFilterHost');
            renderDashboard();

            const el = document.getElementById('weeklyChart');
            if (el) {
                const chart = echarts.init(el);
                chart.setOption({
                    tooltip: { trigger: 'axis', textStyle: { fontFamily: 'Kantumruy Pro' } },
                    grid: { top: '12%', left: '3%', right: '4%', bottom: '10%', containLabel: true },
                    xAxis: { type: 'category', data: weeklySales().map(w => w.week), axisLabel: { fontFamily: 'Kantumruy Pro' } },
                    yAxis: { type: 'value', axisLabel: { fontFamily: 'Kantumruy Pro' } },
                    series: [{
                        name: 'ការលក់', type: 'bar',
                        data: weeklySales().map(w => w.actual),
                        itemStyle: { color: '#1e3a5f', borderRadius: [6, 6, 0, 0] }
                    }]
                });
                window.addEventListener('resize', () => chart.resize());
            }
        });
    </script>
</body>
</html>
