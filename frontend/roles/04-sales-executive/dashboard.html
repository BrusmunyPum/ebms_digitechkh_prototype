<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ផ្ទាំងការងារបុគ្គលិកលក់</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1e3a5f", 'primary-dark': "#142842", accent: "#0ea5e9" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="sePortal" data-role-root="." data-active="dashboard" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ផ្ទាំងការងាររបស់ខ្ញុំ"
             data-subtitle="គោលដៅខែនេះ អ្នកដែលត្រូវទាក់ទង និងឯកសារដែលត្រូវចាត់ការ"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-6">

                <!-- តំបន់ទី 1 — បន្ទះគោលដៅ និងសកម្មភាពដំបូងពីរ
                     ប៊ូតុងទាំងពីរដាក់លើផ្ទៃងងឹត ដើម្បីឱ្យវាលេចធ្លោជាងអ្វីៗទាំងអស់លើទំព័រ -->
                <section class="rounded-2xl bg-[#1e3a5f] text-white overflow-hidden shadow-sm">
                    <div class="px-6 pt-6 pb-5 grid grid-cols-1 lg:grid-cols-5 gap-6 items-start">

                        <div class="lg:col-span-3 min-w-0">
                            <p id="heroGreeting" class="sm-eyebrow text-white/50"></p>
                            <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2 mt-1.5">
                                <div class="min-w-0">
                                    <p id="heroSold" class="sm-hero-value text-white"></p>
                                    <p id="heroTarget" class="sm-card-sub text-white/60 mt-1"></p>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <p id="heroPercent" class="sm-hero-value"></p>
                                    <p id="heroCompare" class="sm-card-sub text-white/60 mt-1"></p>
                                </div>
                            </div>
                            <div class="sm-rail bg-white/15 mt-5"><span id="heroRail" style="width:0%"></span></div>
                        </div>

                        <!-- សកម្មភាពដំបូងពីរ — ធំជាងគេ និងនៅលើគេ -->
                        <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <a href="quotes/create-quote.html"
                               class="min-h-[72px] rounded-xl bg-white text-[#1e3a5f] hover:bg-slate-100 transition flex items-center gap-3 px-4 py-3 shadow-sm">
                                <span class="w-10 h-10 rounded-xl bg-[#1e3a5f] text-white flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-file-circle-plus"></i>
                                </span>
                                <span class="min-w-0">
                                    <span class="sm-value block leading-tight">បង្កើតសម្រង់តម្លៃថ្មី</span>
                                    <span class="sm-card-sub block text-[#1e3a5f]/60 mt-0.5">ត្រូវអនុម័តមុនផ្ញើ</span>
                                </span>
                            </a>
                            <a href="invoices/create-invoice.html"
                               class="min-h-[72px] rounded-xl bg-emerald-500 text-white hover:bg-emerald-600 transition flex items-center gap-3 px-4 py-3 shadow-sm">
                                <span class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-receipt"></i>
                                </span>
                                <span class="min-w-0">
                                    <span class="sm-value block leading-tight text-white">ចេញវិក្កយបត្រថ្មី</span>
                                    <span class="sm-card-sub block text-white/70 mt-0.5">ចេញបានភ្លាម មិនត្រូវអនុម័ត</span>
                                </span>
                            </a>
                        </div>
                    </div>

                    <!-- តួលេខរងបែងចែកដោយបន្ទាត់ — មិនមែនកាតដាច់ដោយឡែក -->
                    <div id="heroStats" class="grid grid-cols-1 sm:grid-cols-3 border-t border-white/10"></div>
                </section>

                <!-- តំបន់ទី 2 — ឯកសារដែលរង់ចាំសកម្មភាពពីខ្ញុំ -->
                <section id="actionStrip" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden"></section>

                <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">

                    <!-- តំបន់ទី 3 — បញ្ជីទូរស័ព្ទតាមដាន -->
                    <section class="xl:col-span-3 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                            <div>
                                <p class="sm-eyebrow text-slate-400">អ្នកដែលត្រូវទាក់ទងថ្ងៃនេះ</p>
                                <p id="callSub" class="sm-card-sub text-slate-500 mt-1"></p>
                            </div>
                            <a href="customers/customers.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline inline-flex items-center gap-1 flex-shrink-0">
                                អតិថិជនរបស់ខ្ញុំ <i class="fas fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                        <div id="callRows" class="divide-y divide-slate-100 border-t border-slate-100"></div>
                    </section>

                    <!-- តំបន់ទី 4 — ប្រាក់ត្រូវប្រមូល -->
                    <section class="xl:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                            <div>
                                <p class="sm-eyebrow text-slate-400">ប្រាក់ត្រូវប្រមូល</p>
                                <p class="sm-card-sub text-slate-500 mt-1">តម្រៀបតាមភាពយឺតបំផុត</p>
                            </div>
                            <span id="collectPill" class="sm-badge font-semibold flex-shrink-0"></span>
                        </div>
                        <div id="collectRows" class="divide-y divide-slate-100 border-t border-slate-100"></div>
                    </section>

                </div>

            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/data/seed.js"></script>
    <script src="../../shared/scripts/status-meta.js"></script>
    <script src="../../shared/scripts/store.js"></script>
    <script src="data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* ផ្ទាំងការងារបែប "សកម្មភាពមុនគេ" — គ្មានគំនូសតាង គ្មានតម្រងកាលបរិច្ឆេទ
           (ឯកសាររចនាលេខ 04 ផ្នែក 3.1)។ គ្រប់តួលេខគិតលើខែបច្ចុប្បន្នតែប៉ុណ្ណោះ។ */

        const KH_MONTH = ['មករា', 'កុម្ភៈ', 'មីនា', 'មេសា', 'ឧសភា', 'មិថុនា',
            'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា', 'វិច្ឆិកា', 'ធ្នូ'];

        function railColor(percent) {
            if (percent >= 100) return '#10b981';
            if (percent >= 80) return '#f59e0b';
            return '#f43f5e';
        }

        function textTone(percent) {
            if (percent >= 100) return 'text-emerald-600';
            if (percent >= 80) return 'text-amber-600';
            return 'text-rose-600';
        }

        /* ===== តំបន់ទី 1 ===== */

        function heroStat(opts) {
            const tag = opts.href ? 'a' : 'div';
            const attrs = opts.href
                ? `href="${opts.href}" class="block px-6 py-4 hover:bg-white/5 transition group"`
                : 'class="px-6 py-4"';
            return `<${tag} ${attrs}>
                <p class="sm-eyebrow text-white/45">${opts.label}</p>
                <p class="sm-value text-white sm-figure mt-1.5 flex items-baseline gap-1.5">
                    <span class="sm-kpi-value ${opts.tone || 'text-white'}">${opts.value}</span>
                    <span class="sm-kpi-unit text-white/50">${opts.unit || ''}</span>
                </p>
                <p class="sm-card-sub ${opts.subTone || 'text-white/55'} mt-0.5">
                    ${opts.sub}${opts.href ? ' <i class="fas fa-arrow-right text-[10px] ml-0.5 opacity-0 group-hover:opacity-100 transition"></i>' : ''}
                </p>
            </${tag}>`;
        }

        function renderHero(m, prev) {
            const first = CURRENT_REP.name.trim().split(/\s+/).pop();
            document.getElementById('heroGreeting').textContent =
                `ជំរាបសួរ ${first} · ថ្ងៃទី ${BMS_TODAY.getDate()} ខែ${KH_MONTH[BMS_TODAY.getMonth()]} ឆ្នាំ ${BMS_TODAY.getFullYear()}`;

            document.getElementById('heroSold').textContent = fmtUSD(m.revenue);

            if (!m.target) {
                document.getElementById('heroTarget').textContent =
                    'គោលដៅប្រចាំខែមិនទាន់កំណត់។ សូមទាក់ទង' + CURRENT_REP.manager;
            } else {
                document.getElementById('heroTarget').textContent =
                    `គោលដៅខែនេះ ${fmtUSD(m.target)} · នៅខ្វះ ${fmtUSD(Math.max(m.target - m.revenue, 0))}`;
            }

            const pctEl = document.getElementById('heroPercent');
            pctEl.textContent = m.target ? fmtPercent(m.quotaPercent) : '—';
            pctEl.className = 'sm-hero-value ' + (m.quotaPercent >= 100 ? 'text-emerald-300'
                : m.quotaPercent >= 80 ? 'text-amber-300' : 'text-rose-300');

            // ដើមខែ តួលេខខែនេះនៅតិច — បង្ហាញលទ្ធផលខែមុនជាចំណុចប្រៀបធៀប
            document.getElementById('heroCompare').textContent =
                `នៃគោលដៅ · ខែមុនសម្រេច ${fmtUSD(prev.revenue)}`;

            const rail = document.getElementById('heroRail');
            rail.style.width = Math.min(m.quotaPercent, 100) + '%';
            rail.style.backgroundColor = railColor(m.quotaPercent);

            document.getElementById('heroStats').innerHTML =
                heroStat({
                    label: 'ប្រាក់ដែលខ្ញុំប្រមូលបាន',
                    value: fmtUSD(m.collected),
                    sub: `ក្នុងចំណោមវិក្កយបត្រ ${m.invoiceCount} ច្បាប់ខែនេះ`
                }) +
                heroStat({
                    label: `កម្រៃជើងសារប៉ាន់ស្មាន · ${fmtPercent(CURRENT_REP.commissionRate)}`,
                    value: fmtUSD(m.commission),
                    tone: 'text-emerald-300',
                    sub: 'គិតលើប្រាក់ដែលប្រមូលបានជាក់ស្តែង'
                }) +
                heroStat({
                    label: 'អត្រាបិទការលក់',
                    value: fmtPercent(m.winRate),
                    sub: `បំប្លែងបាន ${m.convertedCount} ក្នុងចំណោម ${m.quoteCount} សម្រង់តម្លៃ`,
                    href: 'quotes/quotes.html'
                });
        }

        /* ===== តំបន់ទី 2 — ឯកសារត្រូវចាត់ការ ===== */

        const ACTION_TONE = {
            amber: { rail: '#f59e0b', text: 'text-amber-700', chip: 'bg-amber-50 text-amber-700 border-amber-200' },
            rose: { rail: '#f43f5e', text: 'text-rose-700', chip: 'bg-rose-50 text-rose-700 border-rose-200' },
            sky: { rail: '#0ea5e9', text: 'text-sky-700', chip: 'bg-sky-50 text-sky-700 border-sky-200' },
            emerald: { rail: '#10b981', text: 'text-emerald-700', chip: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
        };

        function actionCta(q) {
            if (SE_ACTION_HINT[q.status].cta === 'send') {
                return `<button onclick="sendQuote('${q.id}')" type="button"
                    class="sm-badge px-3.5 py-2 rounded-xl bg-[#1e3a5f] hover:bg-[#142842] text-white font-semibold transition inline-flex items-center gap-1.5 flex-shrink-0">
                    <i class="fas fa-paper-plane text-[11px]"></i> ផ្ញើជូនអតិថិជន
                </button>`;
            }
            if (SE_ACTION_HINT[q.status].cta === 'convert') {
                return `<a href="invoices/create-invoice.html?from=${q.id}"
                    class="sm-badge px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold transition inline-flex items-center gap-1.5 flex-shrink-0">
                    <i class="fas fa-file-invoice-dollar text-[11px]"></i> បំប្លែងជាវិក្កយបត្រ
                </a>`;
            }
            if (SE_ACTION_HINT[q.status].cta === 'edit') {
                return `<a href="quotes/edit-quote.html?id=${q.id}"
                    class="sm-badge px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition inline-flex items-center gap-1.5 flex-shrink-0">
                    <i class="fas fa-pen text-[11px]"></i> កែតាមមតិ
                </a>`;
            }
            return `<a href="quotes/view-quote.html?id=${q.id}"
                class="sm-badge px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition inline-flex items-center gap-1.5 flex-shrink-0">
                <i class="fas fa-eye text-[11px]"></i> ពិនិត្យ
            </a>`;
        }

        function renderActionStrip() {
            const rows = quotesNeedingAction(6);
            const host = document.getElementById('actionStrip');

            if (!rows.length) {
                host.innerHTML = `
                    <div class="px-6 py-10 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-check text-xl"></i>
                        </div>
                        <p class="sm-card-title text-slate-700">គ្មានឯកសាររង់ចាំសកម្មភាពពីលោកអ្នកទេ</p>
                        <p class="sm-card-sub text-slate-500 mt-1">ចាប់ផ្តើមឱកាសថ្មីដោយបង្កើតសម្រង់តម្លៃខាងលើ។</p>
                    </div>`;
                return;
            }

            const total = quotesNeedingAction().length;
            host.innerHTML = `
                <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                    <div>
                        <p class="sm-eyebrow text-slate-400">ឯកសារត្រូវចាត់ការ</p>
                        <p class="sm-card-sub text-slate-500 mt-1">តម្រៀបតាមអ្វីដែលរាំងស្ទះលំហូរលក់មុនគេ</p>
                    </div>
                    <a href="quotes/quotes.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline inline-flex items-center gap-1 flex-shrink-0">
                        ឯកសារលក់ទាំង ${total} <i class="fas fa-arrow-right text-[10px]"></i>
                    </a>
                </div>
                <div class="divide-y divide-slate-100 border-t border-slate-100">
                    ${rows.map(q => {
                        const hint = SE_ACTION_HINT[q.status];
                        const t = ACTION_TONE[hint.tone];
                        const c = getCustomer(q.customerId);
                        const exp = quoteExpiry(q);
                        const reason = q.status === 'REJECTED' && q.rejectionReason
                            ? `មតិ៖ ${q.rejectionReason}`
                            : q.status === 'PENDING_APPROVAL'
                                ? `រង់ចាំ${APPROVAL_LEVEL_LABEL[q.pendingLevel]}សម្រេច`
                                : exp.label;
                        return `
                        <div class="sm-worklist-row px-5 py-3.5 flex flex-wrap items-center gap-x-4 gap-y-2" style="border-left-color:${t.rail}">
                            <div class="min-w-0 flex-1">
                                <p class="sm-value text-slate-700 truncate">${c ? c.name : q.customerId}</p>
                                <p class="sm-td-sub text-slate-500 mt-0.5 truncate">
                                    <span class="sm-figure">${q.id}</span> · ${reason}
                                </p>
                            </div>
                            <span class="sm-badge px-2.5 py-1 rounded-full border ${t.chip} flex-shrink-0">${hint.label}</span>
                            <p class="sm-value text-slate-700 sm-figure w-24 text-right flex-shrink-0">${fmtUSD(docTotals(q).grandTotal)}</p>
                            ${actionCta(q)}
                        </div>`;
                    }).join('')}
                </div>`;
        }

        async function sendQuote(id) {
            const q = getQuote(id);
            const cust = getCustomer(q.customerId);
            const ok = await showCustomConfirm({
                title: 'ផ្ញើជូនអតិថិជន',
                message: `តើលោកអ្នកពិតជាផ្ញើសម្រង់តម្លៃ ${id} ទឹកប្រាក់ ${fmtUSD(docTotals(q).grandTotal)} ជូន ${cust.name} មែនទេ?`,
                confirmText: 'ផ្ញើជូនអតិថិជន',
                cancelText: 'បោះបង់'
            });
            if (!ok) return;
            const res = seActions.sendQuotation(id);
            showToast(res.ok ? `បានផ្ញើសម្រង់តម្លៃ ${id} ជូន ${cust.name}` : res.error, res.ok ? 'success' : 'error');
        }

        /* ===== តំបន់ទី 3 — បញ្ជីទូរស័ព្ទ ===== */

        const CALL_TONE = {
            rose: 'bg-rose-50 text-rose-700 border-rose-200',
            amber: 'bg-amber-50 text-amber-700 border-amber-200',
            sky: 'bg-sky-50 text-sky-700 border-sky-200'
        };

        /* លេខទូរស័ព្ទបង្ហាញពេញនៅពេលចុច — ការពារការមើលឃើញដោយចៃដន្យលើអេក្រង់រួម */
        function revealPhone(elId, phone) {
            const el = document.getElementById(elId);
            if (el) el.textContent = phone;
        }

        function renderCallList() {
            const rows = callList(8);
            const all = callList();
            document.getElementById('callSub').textContent = rows.length
                ? `${all.length} អតិថិជន · បំណុលហួសកាលកំណត់មុនគេ`
                : 'មិនមានការហៅតាមដានថ្ងៃនេះទេ';

            const host = document.getElementById('callRows');
            if (!rows.length) {
                host.innerHTML = `
                    <div class="px-5 py-10 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-mug-hot text-xl"></i>
                        </div>
                        <p class="sm-card-title text-slate-700">មិនមានការហៅតាមដានថ្ងៃនេះ</p>
                        <p class="sm-card-sub text-slate-500 mt-1">អតិថិជនទាំងអស់ទូទាត់ទាន់ពេល។</p>
                    </div>`;
                return;
            }

            host.innerHTML = rows.map((r, idx) => {
                const phoneId = 'callPhone-' + idx;
                const tel = String(r.customer.phone || '').replace(/\s/g, '');
                return `
                <div class="px-5 py-3.5 flex flex-wrap items-center gap-x-4 gap-y-2">
                    <div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0 font-semibold">
                        ${customerInitial(r.customer.name)}
                    </div>
                    <div class="min-w-0 flex-1">
                        <p class="sm-value text-slate-700 truncate">${r.customer.name}</p>
                        <p class="sm-td-sub text-slate-500 mt-0.5 truncate">
                            <span id="${phoneId}" class="sm-figure">${maskedPhone(r.customer.phone)}</span> · ${r.detail}
                        </p>
                    </div>
                    <span class="sm-badge px-2.5 py-1 rounded-full border ${CALL_TONE[r.tone]} flex-shrink-0">${r.reasonLabel}</span>
                    ${r.amount > 0
                        ? `<p class="sm-value text-rose-600 sm-figure w-24 text-right flex-shrink-0">${fmtUSD(r.amount)}</p>`
                        : '<span class="w-24 flex-shrink-0"></span>'}
                    <a href="tel:${tel}" onclick="revealPhone('${phoneId}', '${r.customer.phone}')"
                       class="sm-badge px-3.5 py-2 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 font-semibold transition inline-flex items-center gap-1.5 flex-shrink-0">
                        <i class="fas fa-phone text-[11px]"></i> ខល
                    </a>
                </div>`;
            }).join('');
        }

        /* ===== តំបន់ទី 4 — ប្រាក់ត្រូវប្រមូល ===== */

        function renderCollect(m) {
            const rows = listInvoices()
                .map(i => ({ i, s: invoiceState(i) }))
                .filter(x => x.s.due > 0 && x.s.key !== 'CANCELLED')
                .sort((a, b) => b.s.overdueDays - a.s.overdueDays)
                .slice(0, 6);

            const pill = document.getElementById('collectPill');
            pill.textContent = fmtUSD(m.receivable);
            pill.className = 'sm-badge font-semibold flex-shrink-0 ' + (m.overdueAmount > 0 ? 'text-rose-600' : 'text-slate-600');

            const host = document.getElementById('collectRows');
            if (!rows.length) {
                host.innerHTML = `
                    <div class="px-5 py-10 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-sack-dollar text-xl"></i>
                        </div>
                        <p class="sm-card-title text-slate-700">គ្មានប្រាក់នៅជំពាក់ទេ</p>
                        <p class="sm-card-sub text-slate-500 mt-1">វិក្កយបត្រទាំងអស់ត្រូវបានទូទាត់ពេញ។</p>
                    </div>`;
                return;
            }

            host.innerHTML = rows.map(x => {
                const c = getCustomer(x.i.customerId);
                const late = x.s.key === 'OVERDUE';
                return `
                <a href="invoices/view-invoice.html?id=${x.i.id}"
                   class="sm-worklist-row px-5 py-3.5 flex items-center gap-3 hover:bg-slate-50 transition"
                   style="border-left-color:${late ? '#f43f5e' : 'transparent'}">
                    <div class="min-w-0 flex-1">
                        <p class="sm-value text-slate-700 truncate">${c ? c.name : x.i.customerId}</p>
                        <p class="sm-td-sub ${late ? 'text-rose-600 font-semibold' : 'text-slate-500'} mt-0.5">
                            <span class="sm-figure">${x.i.id}</span> · ${late ? `យឺត ${x.s.overdueDays} ថ្ងៃ` : `នៅសល់ ${Math.abs(x.s.overdueDays)} ថ្ងៃ`}
                        </p>
                    </div>
                    <p class="sm-value ${late ? 'text-rose-600' : 'text-slate-700'} sm-figure flex-shrink-0">${fmtUSD(x.s.due)}</p>
                </a>`;
            }).join('');
        }

        function renderDashboard() {
            const m = myMetrics(monthRange());
            renderHero(m, myMetrics(monthRange(1)));
            renderActionStrip();
            renderCallList();
            renderCollect(m);
            updatePortalBadges();
        }

        window.onStoreChanged = renderDashboard;

        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>
</html>
