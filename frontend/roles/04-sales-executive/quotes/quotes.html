<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - បញ្ជីសម្រង់តម្លៃ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1e3a5f", 'primary-dark': "#142842", accent: "#0ea5e9" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>
<body id="sePortal" data-role-root=".." data-active="quotes" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បញ្ជីសម្រង់តម្លៃ"
             data-subtitle="តាមដានស្ថានភាពអនុម័ត និងកាលបរិច្ឆេទផុតសុពលភាព"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- Status tabs + date filter -->
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div id="statusTabs" class="flex flex-wrap items-center gap-2"></div>
                    <div class="flex flex-wrap items-center gap-2">
                        <div id="dateFilterHost" class="flex items-center pr-1"></div>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <a href="create-quote.html" class="sm-badge inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#0f2b5c] hover:bg-[#0a1d3f] text-white font-semibold shadow-sm transition">
                                <i class="fas fa-plus"></i> <span class="hidden sm:inline">បង្កើតថ្មី</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Expiring soon banner -->
                <div id="expiringBanner" class="hidden bg-amber-50/80 border border-amber-200 rounded-2xl p-4 flex items-start gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center text-lg flex-shrink-0">
                        <i class="fas fa-hourglass-end"></i>
                    </div>
                    <div>
                        <h4 class="sm-card-title text-amber-900">សម្រង់តម្លៃជិតផុតសុពលភាព</h4>
                        <p id="expiringText" class="sm-card-sub text-amber-800 mt-0.5"></p>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                <tr>
                                    <th class="sm-th py-3.5 px-4">លេខសម្រង់តម្លៃ</th>
                                    <th class="sm-th py-3.5 px-4">អតិថិជន</th>
                                    <th class="sm-th py-3.5 px-4">កាលបរិច្ឆេទចេញ</th>
                                    <th class="sm-th py-3.5 px-4">សុពលភាពដល់</th>
                                    <th class="sm-th py-3.5 px-4">ស្ថានភាព</th>
                                    <th class="sm-th py-3.5 px-4 text-right">ទឹកប្រាក់សរុប</th>
                                    <th class="sm-th py-3.5 px-4 text-right">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="quoteBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                        </table>
                    </div>
                    <div id="quoteEmpty" class="hidden py-14 px-6 text-center">
                        <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-file-circle-question text-2xl"></i>
                        </div>
                        <h3 class="sm-card-title text-slate-700">គ្មានសម្រង់តម្លៃក្នុងលក្ខខណ្ឌនេះទេ</h3>
                        <p class="sm-card-sub text-slate-500 mt-1">សូមប្តូរតម្រងស្ថានភាព ឬកំឡុងពេល។</p>
                        <button onclick="clearFilters()" class="sm-badge mt-4 px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">ជម្រះតម្រង</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let filterStatus = 'all';

        const TAB_ORDER = ['DRAFT', 'PENDING_APPROVAL', 'REJECTED', 'APPROVED', 'SENT_TO_CUSTOMER', 'ACCEPTED_BY_CUSTOMER',
            'CONVERTED_TO_INVOICE', 'DECLINED_BY_CUSTOMER', 'EXPIRED', 'CANCELLED'];
        const TABS = [{ id: 'all', label: 'ទាំងអស់' }].concat(TAB_ORDER.map(code => ({ id: code, label: statusLabel(code) })));

        function renderTabs() {
            const all = listQuotes();
            document.getElementById('statusTabs').innerHTML = TABS.map(t => {
                const count = t.id === 'all' ? all.length : all.filter(q => q.status === t.id).length;
                const active = filterStatus === t.id;
                return `<button onclick="pickStatus('${t.id}')" class="sm-badge px-4 py-2 rounded-xl transition ${active
                    ? 'bg-[#1e3a5f] text-white font-semibold shadow-sm'
                    : 'text-slate-600 hover:bg-slate-100 font-medium'}">${t.label} (${count})</button>`;
            }).join('');
        }

        function pickStatus(id) {
            filterStatus = id;
            closeAllFloatingDropdowns();
            renderTabs();
            renderQuotes();
        }

        function clearFilters() {
            filterStatus = 'all';
            clearRangeTag();
            renderTabs();
            renderQuotes();
        }

        function pendingNote(q) {
            if (q.status !== 'PENDING_APPROVAL') return '';
            return `<p class="sm-td-sub text-slate-500 mt-1">រង់ចាំ ${APPROVAL_LEVEL_LABEL[q.pendingLevel]}</p>`;
        }

        function menuItem(href, icon, tone, text) {
            const tag = href.startsWith('javascript:') ? 'button' : 'a';
            const attr = tag === 'a' ? `href="${href}"` : `onclick="${href.replace('javascript:', '')}" type="button"`;
            return `
                <${tag} ${attr} class="sm-row-menu-item w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl ${tone.text} ${tone.hover} transition text-left">
                    <span class="w-7 h-7 rounded-lg ${tone.box} flex items-center justify-center flex-shrink-0"><i class="fas ${icon} text-[11px]"></i></span>
                    ${text}
                </${tag}>`;
        }

        const TONE = {
            slate: { text: 'text-slate-700', hover: 'hover:bg-slate-50', box: 'bg-slate-100 text-slate-600' },
            emerald: { text: 'text-emerald-700', hover: 'hover:bg-emerald-50', box: 'bg-emerald-100 text-emerald-700' },
            blue: { text: 'text-blue-700', hover: 'hover:bg-blue-50', box: 'bg-blue-100 text-blue-700' },
            amber: { text: 'text-slate-700', hover: 'hover:bg-slate-50', box: 'bg-amber-100 text-amber-700' }
        };

        function renderQuotes() {
            const range = getSelectedRange();
            const all = listQuotes();
            const rows = all
                .filter(q => filterStatus === 'all' || q.status === filterStatus)
                .filter(q => inRange(q.date, range))
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            // ផ្ទាំងព្រមានសម្រង់តម្លៃដែលនៅសកម្ម ប៉ុន្តែជិតផុតសុពលភាព
            const expiring = all.filter(q => {
                if (!['DRAFT', 'PENDING_APPROVAL', 'APPROVED', 'SENT_TO_CUSTOMER'].includes(q.status)) return false;
                const left = quoteExpiry(q).days;
                return left >= 0 && left <= 3;
            });
            const banner = document.getElementById('expiringBanner');
            if (expiring.length) {
                banner.classList.remove('hidden');
                document.getElementById('expiringText').textContent =
                    `មាន ${expiring.length} សម្រង់តម្លៃដែលនឹងផុតសុពលភាពក្នុងរយៈពេល 3 ថ្ងៃ៖ ` +
                    expiring.map(q => `${q.id} (${getCustomer(q.customerId).name})`).join(' · ');
            } else {
                banner.classList.add('hidden');
            }

            const body = document.getElementById('quoteBody');
            const empty = document.getElementById('quoteEmpty');
            if (!rows.length) {
                body.innerHTML = '';
                body.parentElement.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            body.parentElement.classList.remove('hidden');
            empty.classList.add('hidden');

            body.innerHTML = rows.map(q => {
                const cust = getCustomer(q.customerId);
                const exp = quoteExpiry(q);
                const totals = docTotals(q);
                const menuId = 'quoteMenu-' + q.id;

                const items = [menuItem(`view-quote.html?id=${q.id}`, 'fa-eye', TONE.slate, 'មើលលម្អិត')];
                if (['DRAFT', 'REJECTED'].includes(q.status)) items.push(menuItem(`edit-quote.html?id=${q.id}`, 'fa-pen', TONE.slate, 'កែប្រែ'));
                if (q.status === 'APPROVED') items.push(menuItem(`javascript:sendQuote('${q.id}')`, 'fa-paper-plane', TONE.blue, 'ផ្ញើជូនអតិថិជន'));
                if (q.status === 'ACCEPTED_BY_CUSTOMER') items.push(menuItem(`../invoices/create-invoice.html?from=${q.id}`, 'fa-file-invoice-dollar', TONE.emerald, 'បំប្លែងជាវិក្កយបត្រ'));
                if (q.status === 'CONVERTED_TO_INVOICE' && q.invoiceId) items.push(menuItem(`../invoices/view-invoice.html?id=${q.invoiceId}`, 'fa-receipt', TONE.blue, `មើលវិក្កយបត្រ ${q.invoiceId}`));
                items.push(menuItem(`tel:${cust.phone.replace(/\s/g, '')}`, 'fa-phone', TONE.amber, 'ទូរស័ព្ទតាមដានអតិថិជន'));

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="sm-td-strong py-3.5 px-4">${q.id}</td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${cust.name}</p>
                            <span class="sm-badge px-2 py-0.5 rounded-full border ${tierTone(cust.tier)} mt-1 inline-block">${tierLabel(cust.tier)}</span>
                        </td>
                        <td class="sm-td py-3.5 px-4 text-slate-500">${fmtKhDate(q.date)}</td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${fmtKhDate(q.validUntil)}</p>
                            <p class="sm-td-sub ${exp.tone}">${exp.label}</p>
                        </td>
                        <td class="py-3.5 px-4">
                            ${statusBadge(q.status)}
                            ${pendingNote(q)}
                            ${q.discountPercent > DISCOUNT_SELF_LIMIT ? `<p class="sm-td-sub text-amber-600 mt-1">បញ្ចុះតម្លៃ ${fmtPercent(q.discountPercent)}</p>` : ''}
                        </td>
                        <td class="sm-td-strong py-3.5 px-4 text-right">${fmtUSD(totals.grandTotal)}</td>
                        <td class="py-3.5 px-4 text-right">
                            <button onclick="toggleRowActionMenu(event, '${menuId}')"
                                class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-slate-700 border border-slate-200/70 inline-flex items-center justify-center transition">
                                <i class="fas fa-ellipsis-vertical text-sm"></i>
                            </button>
                            <div id="${menuId}" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left">
                                <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                                    <p class="sm-td-sub text-slate-400">សកម្មភាពលើសម្រង់តម្លៃ</p>
                                    <p class="sm-value text-slate-700">${q.id}</p>
                                </div>
                                ${items.join('')}
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function sendQuote(id) {
            closeAllFloatingDropdowns();
            const q = getQuote(id);
            const cust = getCustomer(q.customerId);
            const ok = await showCustomConfirm({
                title: 'ផ្ញើជូនអតិថិជន',
                message: `តើលោកអ្នកពិតជាផ្ញើសម្រង់តម្លៃ ${id} ទឹកប្រាក់ ${fmtUSD(docTotals(q).grandTotal)} ជូន ${cust.name} មែនទេ?`,
                confirmText: 'ផ្ញើជូនអតិថិជន',
                cancelText: 'បោះបង់'
            });
            if (!ok) return;
            const res = seActions.sendQuotation(id);
            showToast(res.ok ? `បានផ្ញើសម្រង់តម្លៃ ${id} ជូន ${cust.name}` : res.error, res.ok ? 'success' : 'error');
        }

        window.onDateRangeApplied = renderQuotes;
        window.onStoreChanged = () => { renderTabs(); renderQuotes(); };

        document.addEventListener('DOMContentLoaded', () => {
            renderDateRangePicker('dateFilterHost');
            renderTabs();
            renderQuotes();
        });
    </script>
</body>
</html>
