<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - របាយការណ៍ហិរញ្ញវត្ថុ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root=".." data-active="financial-statements" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="របាយការណ៍ហិរញ្ញវត្ថុ"
             data-subtitle="ចំណេញ-ខាត និងតារាងតុល្យការ គណនាពីទិនានុប្បវត្តិដែលបានចុះបញ្ជី"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- របារតម្រង និងថេប -->
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center gap-2">
                    <button id="tabBtn-pnl" onclick="switchStatementTab('pnl')"
                        class="sm-badge px-4 py-2 rounded-xl bg-[#1e3a5f] text-white font-semibold shadow-sm transition">
                        ចំណេញ-ខាត
                    </button>
                    <button id="tabBtn-bs" onclick="switchStatementTab('bs')"
                        class="sm-badge px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition">
                        តារាងតុល្យការ
                    </button>
                    <div id="dateFilterHost" class="flex items-center ml-2"></div>
                    <span class="ml-auto w-px h-6 bg-slate-200 hidden sm:block"></span>
                    <div class="flex flex-wrap items-center gap-2 no-print">
                        <button onclick="window.print()"
                            class="sm-badge px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition flex items-center gap-1.5">
                            <i class="fas fa-print text-slate-500"></i> បោះពុម្ព
                        </button>
                    </div>
                </div>

                <!-- ចំណេញ-ខាត -->
                <div id="panel-pnl">
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden sm-print-block">
                        <div class="px-6 pt-6 pb-4 border-b border-slate-100">
                            <h2 class="sm-card-title text-slate-800">របាយការណ៍លទ្ធផល</h2>
                            <p id="pnlPeriod" class="sm-card-sub text-slate-500 mt-1"></p>
                        </div>
                        <div id="pnlBody"></div>
                    </div>
                </div>

                <!-- តារាងតុល្យការ -->
                <div id="panel-bs" class="hidden">
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden sm-print-block">
                        <div class="px-6 pt-6 pb-4 border-b border-slate-100 flex flex-wrap items-baseline justify-between gap-2">
                            <div>
                                <h2 class="sm-card-title text-slate-800">តារាងតុល្យការ</h2>
                                <p id="bsPeriod" class="sm-card-sub text-slate-500 mt-1"></p>
                            </div>
                            <span id="bsBalanced" class="sm-badge font-semibold flex-shrink-0"></span>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-slate-100">
                            <div id="bsAssets"></div>
                            <div id="bsEquityLiab"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        function line(label, value, opts) {
            const o = opts || {};
            return `
                <div class="px-6 py-3 flex items-baseline justify-between gap-4 ${o.strong ? 'bg-slate-50 border-y border-slate-100' : ''}">
                    <span class="${o.strong ? 'sm-td-strong text-slate-800' : 'sm-td text-slate-600'} ${o.indent ? 'pl-5' : ''}">${label}</span>
                    <span class="${o.strong ? 'sm-td-strong' : 'sm-td'} ${o.tone || 'text-slate-700'} sm-figure flex-shrink-0">${value}</span>
                </div>`;
        }

        function sectionHead(text) {
            return `<div class="px-6 pt-5 pb-2"><p class="sm-eyebrow text-slate-400">${text}</p></div>`;
        }

        function emptyBlock(message) {
            return `<div class="px-6 py-14 text-center">
                <i class="fas fa-chart-bar text-2xl text-slate-300"></i>
                <p class="sm-card-sub text-slate-500 mt-2">${message}</p>
            </div>`;
        }

        function renderPnl(range) {
            const p = incomeStatement(range);
            document.getElementById('pnlPeriod').textContent =
                `គ្រា ${periodName(range)} · រឹមចំណេញដុល ${fmtPercent(p.grossMarginPercent)} · រឹមចំណេញសុទ្ធ ${fmtPercent(p.netMarginPercent)}`;

            const host = document.getElementById('pnlBody');
            if (!p.revenue && !p.cogs && !p.opex) {
                host.innerHTML = emptyBlock('គ្មានចលនាគណនេយ្យក្នុងកំឡុងពេលនេះទេ');
                return;
            }

            host.innerHTML =
                sectionHead('ចំណូល') +
                p.revenueRows.map(r => line(r.name, fmtUSD(r.amount), { indent: true })).join('') +
                line('ចំណូលសរុប', fmtUSD(p.revenue), { strong: true }) +

                sectionHead('ថ្លៃដើមទំនិញលក់') +
                (p.cogsRows.length
                    ? p.cogsRows.map(r => line(r.name, '−' + fmtUSD(r.amount), { indent: true, tone: 'text-rose-600' })).join('')
                    : line('គ្មានថ្លៃដើមកត់ត្រា', fmtUSD(0), { indent: true, tone: 'text-slate-400' })) +
                line('ចំណេញដុល', fmtUSD(p.grossProfit), { strong: true, tone: 'text-emerald-700' }) +

                sectionHead('ចំណាយប្រតិបត្តិការ') +
                (p.opexRows.length
                    ? p.opexRows.map(r => line(r.name, '−' + fmtUSD(r.amount), { indent: true, tone: 'text-rose-600' })).join('')
                    : line('គ្មានចំណាយកត់ត្រា', fmtUSD(0), { indent: true, tone: 'text-slate-400' })) +
                line('ចំណាយប្រតិបត្តិការសរុប', '−' + fmtUSD(p.opex), { strong: true, tone: 'text-rose-600' }) +

                line('ចំណេញសុទ្ធក្នុងគ្រា', fmtUSD(p.netProfit), {
                    strong: true, tone: p.netProfit >= 0 ? 'text-emerald-700' : 'text-rose-600'
                });
        }

        function renderBalanceSheet() {
            const bs = balanceSheet();
            document.getElementById('bsPeriod').textContent = `គិតត្រឹមថ្ងៃទី ${fmtKhDate(toIsoDate(BMS_TODAY))}`;

            const pill = document.getElementById('bsBalanced');
            pill.className = `sm-badge font-semibold flex-shrink-0 ${bs.balanced ? 'text-emerald-600' : 'text-rose-600'}`;
            pill.textContent = bs.balanced ? 'តុល្យការស្មើគ្នា' : 'តុល្យការមិនស្មើគ្នា';

            document.getElementById('bsAssets').innerHTML =
                sectionHead('ទ្រព្យសកម្ម') +
                (bs.assets.length
                    ? bs.assets.map(r => line(r.name, fmtUSD(r.amount), { indent: true })).join('')
                    : line('គ្មានទ្រព្យសកម្ម', fmtUSD(0), { indent: true, tone: 'text-slate-400' })) +
                line('ទ្រព្យសកម្មសរុប', fmtUSD(bs.totalAssets), { strong: true });

            document.getElementById('bsEquityLiab').innerHTML =
                sectionHead('បំណុល') +
                (bs.liabilities.length
                    ? bs.liabilities.map(r => line(r.name, fmtUSD(r.amount), { indent: true })).join('')
                    : line('គ្មានបំណុល', fmtUSD(0), { indent: true, tone: 'text-slate-400' })) +
                line('បំណុលសរុប', fmtUSD(bs.totalLiabilities), { strong: true }) +

                sectionHead('មូលធន') +
                bs.equity.map(r => line(r.name, fmtUSD(r.amount), { indent: true })).join('') +
                line('ចំណេញក្នុងគ្រាមិនទាន់បិទបញ្ជី', fmtUSD(bs.periodProfit), {
                    indent: true, tone: bs.periodProfit >= 0 ? 'text-emerald-700' : 'text-rose-600'
                }) +
                line('មូលធនសរុប', fmtUSD(bs.totalEquity), { strong: true }) +
                line('បំណុល និងមូលធនសរុប', fmtUSD(bs.totalLiabilities + bs.totalEquity), { strong: true });
        }

        function renderStatements() {
            const range = safeRange(getSelectedRange());
            renderPnl(range);
            renderBalanceSheet();
            updatePortalBadges();
        }

        function switchStatementTab(name) {
            closeAllFloatingDropdowns();
            ['pnl', 'bs'].forEach(t => {
                document.getElementById('panel-' + t).classList.toggle('hidden', t !== name);
                document.getElementById('tabBtn-' + t).className = t === name
                    ? 'sm-badge px-4 py-2 rounded-xl bg-[#1e3a5f] text-white font-semibold shadow-sm transition'
                    : 'sm-badge px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition';
            });
        }

        window.onDateRangeApplied = renderStatements;
        window.onStoreChanged = renderStatements;

        document.addEventListener('DOMContentLoaded', () => {
            renderDateRangePicker('dateFilterHost');
            renderStatements();
        });
    </script>
</body>

</html>
