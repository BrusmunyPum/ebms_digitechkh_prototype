<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ព័ត៌មានលម្អិតទិនានុប្បវត្តិ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root=".." data-active="ledger" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ព័ត៌មានលម្អិតទិនានុប្បវត្តិ"
             data-subtitle="ជួរឥណពន្ធ និងឥណទាន និងឯកសារយោង"
             data-back="ledger.html"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">
                <div class="w-full flex flex-wrap items-center justify-between gap-2 no-print">
                    <div class="flex flex-wrap items-center gap-2">
                        <span id="jeStatusBadge"></span>
                        <span id="jeSourceBadge"></span>
                    </div>
                    <button onclick="window.print()"
                        class="sm-badge px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition flex items-center gap-1.5">
                        <i class="fas fa-print text-slate-500"></i> បោះពុម្ព
                    </button>
                </div>

                <div id="pageBody" class="w-full space-y-4"></div>
            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        const journalId = new URLSearchParams(location.search).get('id') || '';

        function renderNotFound() {
            setPortalTitle('រកមិនឃើញឯកសារ');
            setPortalSubtitle(`លេខទិនានុប្បវត្តិ ${journalId} មិនមានក្នុងប្រព័ន្ធទេ`);
            document.getElementById('jeStatusBadge').innerHTML = '';
            document.getElementById('jeSourceBadge').innerHTML = '';
            document.getElementById('pageBody').innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm py-16 text-center">
                    <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-file-circle-question text-2xl"></i>
                    </div>
                    <h3 class="sm-card-title text-slate-700">រកមិនឃើញទិនានុប្បវត្តិនេះទេ</h3>
                    <p class="sm-card-sub text-slate-500 mt-1">សូមត្រឡប់ទៅសៀវភៅធំ ដើម្បីជ្រើសរើសឯកសារផ្សេង។</p>
                    <a href="ledger.html" class="sm-badge inline-flex items-center gap-2 mt-4 px-4 py-2.5 rounded-xl bg-[#1e3a5f] text-white font-semibold">
                        <i class="fas fa-arrow-left"></i> ត្រឡប់ទៅសៀវភៅធំ
                    </a>
                </div>`;
        }

        function renderJournal() {
            const j = getJournal(journalId);
            if (!j) return renderNotFound();

            const t = journalTotals(j);
            const balanced = Math.abs(t.dr - t.cr) < 0.01;

            setPortalTitle('ទិនានុប្បវត្តិ ' + j.id);
            setPortalSubtitle(`${j.description} · ${fmtKhDate(j.date)}`);

            document.getElementById('jeStatusBadge').innerHTML = statusBadge(j.status);
            document.getElementById('jeSourceBadge').innerHTML =
                `<span class="sm-badge px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">${sourceLabel(j.source)}</span>`;

            document.getElementById('pageBody').innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden sm-print-block">
                    <div class="px-6 pt-6 pb-4 border-b border-slate-100 grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <div>
                            <p class="sm-eyebrow text-slate-400">លេខទិនានុប្បវត្តិ</p>
                            <p class="sm-value text-slate-800 sm-figure mt-1">${j.id}</p>
                        </div>
                        <div>
                            <p class="sm-eyebrow text-slate-400">កាលបរិច្ឆេទ</p>
                            <p class="sm-value text-slate-800 sm-figure mt-1">${fmtKhDate(j.date)}</p>
                        </div>
                        <div>
                            <p class="sm-eyebrow text-slate-400">ឯកសារយោង</p>
                            <p class="sm-value text-slate-800 sm-figure mt-1">${j.reference || '—'}</p>
                        </div>
                        <div>
                            <p class="sm-eyebrow text-slate-400">ចុះបញ្ជីដោយ</p>
                            <p class="sm-value text-slate-800 mt-1">${(BMS_STORE.user(j.postedBy) || {}).name || '—'}</p>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                <tr>
                                    <th class="sm-th py-3 px-6">លេខគណនី</th>
                                    <th class="sm-th py-3 px-4">ឈ្មោះគណនី</th>
                                    <th class="sm-th py-3 px-4">ការពិពណ៌នា</th>
                                    <th class="sm-th py-3 px-4 text-right">ឥណពន្ធ</th>
                                    <th class="sm-th py-3 px-6 text-right">ឥណទាន</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-slate-700">
                                ${j.lines.map(l => `
                                    <tr class="hover:bg-slate-50 transition">
                                        <td class="sm-td py-3 px-6 sm-figure text-slate-500">${l.accountCode}</td>
                                        <td class="sm-td py-3 px-4">${accountName(l.accountCode)}</td>
                                        <td class="sm-td-sub py-3 px-4 text-slate-500">${l.description || '—'}</td>
                                        <td class="sm-td py-3 px-4 text-right sm-figure ${l.dr ? 'text-slate-800' : 'text-slate-300'}">${l.dr ? fmtUSD(l.dr) : '—'}</td>
                                        <td class="sm-td py-3 px-6 text-right sm-figure ${l.cr ? 'text-slate-800' : 'text-slate-300'}">${l.cr ? fmtUSD(l.cr) : '—'}</td>
                                    </tr>`).join('')}
                            </tbody>
                            <tfoot class="bg-slate-50 border-t-2 border-slate-200">
                                <tr>
                                    <td colspan="3" class="sm-td-strong py-3 px-6 text-slate-700">សរុប</td>
                                    <td class="sm-td-strong py-3 px-4 text-right sm-figure text-slate-800">${fmtUSD(t.dr)}</td>
                                    <td class="sm-td-strong py-3 px-6 text-right sm-figure text-slate-800">${fmtUSD(t.cr)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <div class="px-6 py-4 border-t border-slate-100 flex items-center gap-2">
                        <i class="fas ${balanced ? 'fa-circle-check text-emerald-500' : 'fa-triangle-exclamation text-rose-500'} text-sm"></i>
                        <p class="sm-td-sub ${balanced ? 'text-emerald-700' : 'text-rose-700'}">
                            ${balanced ? 'ឥណពន្ធ និងឥណទានស្មើគ្នា' : 'ឥណពន្ធ និងឥណទានមិនស្មើគ្នា'}
                        </p>
                    </div>
                </div>`;
        }

        window.onStoreChanged = renderJournal;

        document.addEventListener('DOMContentLoaded', () => {
            renderJournal();
            updatePortalBadges();
        });
    </script>
</body>

</html>
