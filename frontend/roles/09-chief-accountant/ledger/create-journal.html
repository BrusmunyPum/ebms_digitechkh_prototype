<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - បង្កើតទិនានុប្បវត្តិ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root=".." data-active="ledger" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បង្កើតទិនានុប្បវត្តិថ្មី"
             data-subtitle="កត់ត្រាដោយដៃ — ឥណពន្ធត្រូវស្មើឥណទានមុននឹងចុះបញ្ជី"
             data-back="ledger.html"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <div class="w-full flex flex-wrap items-center justify-end gap-2 no-print">
                    <a href="ledger.html"
                        class="sm-badge px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
                        បោះបង់
                    </a>
                    <button type="button" onclick="submitJournal('DRAFT')"
                        class="sm-badge px-4 py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold transition">
                        រក្សាទុកជាព្រាង
                    </button>
                    <button type="button" onclick="submitJournal('POSTED')"
                        class="sm-badge px-4 py-2 rounded-xl bg-[#1e3a5f] hover:bg-[#142842] text-white font-semibold shadow-sm transition inline-flex items-center gap-2">
                        <i class="fas fa-check text-[11px]"></i> ចុះបញ្ជីចូលសៀវភៅធំ
                    </button>
                </div>

                <!-- ព័ត៌មានទូទៅ -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm">
                    <p class="sm-eyebrow text-slate-400">ព័ត៌មានទូទៅ</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                        <div>
                            <span class="sm-label text-slate-600 block mb-1.5">កាលបរិច្ឆេទ</span>
                            <!-- ប្រើកម្មវិធីជ្រើសកាលបរិច្ឆេទផ្ទាល់ខ្លួន មិនមែន input type=date របស់កម្មវិធីរុករក -->
                            <div class="relative bms-date-picker">
                                <input type="hidden" id="fDate">
                                <button type="button" onclick="toggleSingleDatePicker('fDate')"
                                    class="w-full h-10 px-3.5 bg-slate-50 hover:bg-slate-100/70 border border-slate-200 rounded-xl sm-td text-slate-800 flex items-center justify-between focus:outline-none focus:bg-white focus:border-primary transition group cursor-pointer">
                                    <span id="fDate-display" class="bms-date-label font-medium text-slate-800 sm-figure"></span>
                                    <i class="fas fa-calendar-days text-primary text-xs opacity-75 group-hover:opacity-100 transition"></i>
                                </button>
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <label for="fDescription" class="sm-label text-slate-600 block mb-1.5">ការពិពណ៌នា</label>
                            <input type="text" id="fDescription" placeholder="ឧទាហរណ៍ បង់ថ្លៃជួលការិយាល័យប្រចាំខែ"
                                class="w-full h-10 px-3.5 bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/10 rounded-xl sm-td text-slate-800 transition outline-none placeholder:text-slate-400">
                        </div>
                        <div>
                            <label for="fReference" class="sm-label text-slate-600 block mb-1.5">ឯកសារយោង</label>
                            <input type="text" id="fReference" placeholder="ឧទាហរណ៍ RENT-M"
                                class="w-full h-10 px-3.5 bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/10 rounded-xl sm-td text-slate-800 transition outline-none placeholder:text-slate-400">
                        </div>
                    </div>
                </div>

                <!-- ជួរគណនី -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="px-6 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                        <div>
                            <p class="sm-eyebrow text-slate-400">ជួរគណនី</p>
                            <p class="sm-card-sub text-slate-500 mt-1">ត្រូវមានយ៉ាងហោចណាស់ 2 ជួរ</p>
                        </div>
                        <button type="button" onclick="addLine()"
                            class="sm-badge px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition inline-flex items-center gap-1.5 no-print">
                            <i class="fas fa-plus text-[11px]"></i> បន្ថែមជួរ
                        </button>
                    </div>
                    <div class="overflow-x-auto border-t border-slate-100">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                <tr>
                                    <th class="sm-th py-3 px-4">គណនី</th>
                                    <th class="sm-th py-3 px-4">ការពិពណ៌នា</th>
                                    <th class="sm-th py-3 px-4 text-right w-40">ឥណពន្ធ</th>
                                    <th class="sm-th py-3 px-4 text-right w-40">ឥណទាន</th>
                                    <th class="sm-th py-3 px-4 w-12"></th>
                                </tr>
                            </thead>
                            <tbody id="lineBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                            <tfoot id="lineFoot" class="bg-slate-50 border-t-2 border-slate-200"></tfoot>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let lines = [];

        function entryDate() {
            const el = document.getElementById('fDate');
            return (el && el.value) ? el.value : toIsoDate(BMS_TODAY);
        }

        function blankLine() {
            return { accountCode: '', description: '', dr: '', cr: '' };
        }

        function accountOptions(selected, index) {
            const menuId = 'acctMenu-' + index;
            const acct = selected ? getAccount(selected) : null;
            return `
                <button type="button" onclick="toggleRowActionMenu(event, '${menuId}')"
                    class="w-full h-10 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-xl inline-flex items-center justify-between gap-2 transition cursor-pointer">
                    <span class="sm-td truncate ${acct ? 'text-slate-800' : 'text-slate-400'}">${acct ? acct.code + ' · ' + acct.nameKh : 'ជ្រើសរើសគណនី'}</span>
                    <i class="fas fa-chevron-down text-[10px] text-slate-400 flex-shrink-0"></i>
                </button>
                <div id="${menuId}" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left max-h-80 overflow-y-auto scrollbar-hide">
                    <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                        <p class="sm-td-sub text-slate-400">ជ្រើសរើសគណនី</p>
                    </div>
                    ${postableAccounts().map(a => `
                        <button type="button" onclick="pickAccount(${index}, '${a.code}')"
                            class="sm-row-menu-item w-full flex items-center justify-between gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition text-left">
                            <span><span class="sm-figure text-slate-400">${a.code}</span> · ${a.nameKh}</span>
                            ${a.code === selected ? '<i class="fas fa-check text-[11px] text-emerald-600"></i>' : ''}
                        </button>`).join('')}
                </div>`;
        }

        function renderLines() {
            if (!lines.length) {
                document.getElementById('lineBody').innerHTML = `
                    <tr><td colspan="5" class="py-12 text-center">
                        <i class="fas fa-list-ul text-2xl text-slate-300"></i>
                        <p class="sm-card-sub text-slate-500 mt-2">គ្មានជួរគណនីទេ — សូមបន្ថែមជួរយ៉ាងហោចណាស់ 2</p>
                    </td></tr>`;
                document.getElementById('lineFoot').innerHTML = '';
                return;
            }
            document.getElementById('lineBody').innerHTML = lines.map((l, i) => `
                <tr>
                    <td class="py-2.5 px-4 min-w-[240px]"><div class="relative">${accountOptions(l.accountCode, i)}</div></td>
                    <td class="py-2.5 px-4">
                        <input type="text" value="${l.description}" oninput="updateLine(${i}, 'description', this.value)"
                            placeholder="ការពិពណ៌នាជួរ"
                            class="w-full h-10 px-3 bg-slate-50 focus:bg-white border border-slate-200 focus:border-primary rounded-xl sm-td text-slate-800 outline-none transition placeholder:text-slate-400">
                    </td>
                    <td class="py-2.5 px-4">
                        <input type="number" min="0" step="0.01" value="${l.dr}" oninput="updateLine(${i}, 'dr', this.value)"
                            class="w-full h-10 px-3 bg-slate-50 focus:bg-white border border-slate-200 focus:border-primary rounded-xl sm-td text-slate-800 text-right sm-figure outline-none transition">
                    </td>
                    <td class="py-2.5 px-4">
                        <input type="number" min="0" step="0.01" value="${l.cr}" oninput="updateLine(${i}, 'cr', this.value)"
                            class="w-full h-10 px-3 bg-slate-50 focus:bg-white border border-slate-200 focus:border-primary rounded-xl sm-td text-slate-800 text-right sm-figure outline-none transition">
                    </td>
                    <td class="py-2.5 px-4 text-right">
                        <button type="button" onclick="removeLine(${i})" aria-label="លុបជួរ"
                            class="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 inline-flex items-center justify-center transition no-print">
                            <i class="fas fa-xmark text-xs"></i>
                        </button>
                    </td>
                </tr>`).join('');

            const dr = lines.reduce((s, l) => s + (Number(l.dr) || 0), 0);
            const cr = lines.reduce((s, l) => s + (Number(l.cr) || 0), 0);
            const diff = dr - cr;
            const balanced = Math.abs(diff) < 0.005;

            document.getElementById('lineFoot').innerHTML = `
                <tr>
                    <td colspan="2" class="sm-td-strong py-3 px-4 text-slate-700">សរុប</td>
                    <td class="sm-td-strong py-3 px-4 text-right sm-figure text-slate-800">${fmtUSD(dr)}</td>
                    <td class="sm-td-strong py-3 px-4 text-right sm-figure text-slate-800">${fmtUSD(cr)}</td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="5" class="py-2.5 px-4">
                        <span class="sm-td-sub ${balanced ? 'text-emerald-700' : 'text-rose-700'} font-semibold">
                            <i class="fas ${balanced ? 'fa-circle-check' : 'fa-triangle-exclamation'} mr-1"></i>
                            ${balanced ? 'ឥណពន្ធ និងឥណទានស្មើគ្នា' : `គម្លាត ${fmtUSD(Math.abs(diff))} — មិនទាន់អាចចុះបញ្ជីបានទេ`}
                        </span>
                    </td>
                </tr>`;
        }

        function addLine() { lines.push(blankLine()); renderLines(); }
        function removeLine(i) { lines.splice(i, 1); if (!lines.length) lines = [blankLine(), blankLine()]; renderLines(); }
        function updateLine(i, field, value) { lines[i][field] = value; if (field !== 'description') renderLines(); }
        function pickAccount(i, code) { lines[i].accountCode = code; closeAllFloatingDropdowns(); renderLines(); }

        async function submitJournal(status) {
            const description = document.getElementById('fDescription').value.trim();
            if (!description) return showToast('សូមបញ្ចូលការពិពណ៌នា', 'error');

            const payload = {
                date: entryDate(),
                description,
                reference: document.getElementById('fReference').value.trim(),
                status,
                lines: lines.map(l => ({
                    accountCode: l.accountCode,
                    description: l.description,
                    dr: Number(l.dr) || 0,
                    cr: Number(l.cr) || 0
                }))
            };

            if (status === 'POSTED') {
                const ok = await showCustomConfirm({
                    title: 'ចុះបញ្ជីចូលសៀវភៅធំ',
                    message: 'ទិនានុប្បវត្តិដែលបានចុះបញ្ជី មិនអាចលុបចោលបានទេ។ ការកែតម្រូវត្រូវធ្វើតាមទិនានុប្បវត្តិបញ្ច្រាស។ តើបន្តមែនទេ?',
                    confirmText: 'ចុះបញ្ជី',
                    cancelText: 'បោះបង់'
                });
                if (!ok) return;
            }

            const res = caActions.createJournal(payload);
            if (!res.ok) return showToast(res.error, 'error');

            showToast(status === 'POSTED'
                ? `បានចុះបញ្ជីទិនានុប្បវត្តិ ${res.record.id} ចូលសៀវភៅធំ`
                : `បានរក្សាទុកទិនានុប្បវត្តិ ${res.record.id} ជាព្រាង`, 'success');
            setTimeout(() => { window.location.href = `view-journal.html?id=${res.record.id}`; }, 700);
        }

        document.addEventListener('DOMContentLoaded', () => {
            lines = [blankLine(), blankLine()];
            renderLines();
            document.getElementById('fDate').value = toIsoDate(BMS_TODAY);
            initSingleDatePicker('fDate');
            updatePortalBadges();
        });
    </script>
</body>

</html>
