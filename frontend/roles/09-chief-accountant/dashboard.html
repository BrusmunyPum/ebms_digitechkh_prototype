<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ផ្ទាំងគ្រប់គ្រងហិរញ្ញវត្ថុ</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- គំនូសតាងទាំងអស់នៅទំព័ររបាយការណ៍ មិនមែននៅផ្ទាំងគ្រប់គ្រង (ស្តង់ដារឯកសារ 00 ផ្នែក 3.2) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root="." data-active="dashboard" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ផ្ទាំងគ្រប់គ្រងហិរញ្ញវត្ថុ"
             data-subtitle="សាច់ប្រាក់ ចំណេញ-ខាត និងការងារគណនេយ្យដែលត្រូវសម្រេច"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-6">

                <!-- តំបន់ទី 1 — សាច់ប្រាក់ជាចំណុចផ្តោត បូកនឹងតួលេខចំណេញ-ខាតក្នុងគ្រា -->
                <section class="rounded-2xl bg-[#1e3a5f] text-white overflow-hidden shadow-sm">
                    <div class="px-6 pt-6 pb-5 flex flex-wrap items-end justify-between gap-x-8 gap-y-4">
                        <div class="min-w-0">
                            <p class="sm-eyebrow text-white/50">សាច់ប្រាក់ និងប្រាក់បញ្ញើធនាគារ</p>
                            <p id="heroCash" class="sm-hero-value text-white mt-1.5"></p>
                            <p id="heroPeriod" class="sm-card-sub text-white/60 mt-1"></p>
                        </div>
                        <div id="heroCashRows" class="flex flex-wrap gap-x-7 gap-y-2"></div>
                    </div>
                    <div id="heroStats" class="grid grid-cols-1 sm:grid-cols-3 border-t border-white/10"></div>
                </section>

                <!-- តំបន់ទី 2 — ការងារដែលត្រូវសម្រេច -->
                <section id="workQueue" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden no-print"></section>

                <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">

                    <!-- តំបន់ទី 3 — ចលនាចំណេញ-ខាតក្នុងគ្រា (តារាង មិនមែនគំនូសតាង) -->
                    <section class="xl:col-span-3 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                            <div>
                                <p class="sm-eyebrow text-slate-400">ចំណេញ-ខាតក្នុងគ្រា</p>
                                <p id="pnlSub" class="sm-card-sub text-slate-500 mt-1"></p>
                            </div>
                            <a href="financial-statements/financial-statements.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline inline-flex items-center gap-1 flex-shrink-0">
                                របាយការណ៍ពេញលេញ <i class="fas fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                        <div id="pnlRows" class="border-t border-slate-100"></div>
                    </section>

                    <!-- តំបន់ទី 4 — ស្ថានភាពពន្ធ និងបំណុល -->
                    <section class="xl:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 pt-5 pb-3">
                            <p class="sm-eyebrow text-slate-400">បំណុល និងពន្ធ</p>
                            <p class="sm-card-sub text-slate-500 mt-1">សមតុល្យតាមសៀវភៅធំ</p>
                        </div>
                        <div id="obligationRows" class="divide-y divide-slate-100 border-t border-slate-100"></div>
                    </section>

                </div>

            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/data/seed.js"></script>
    <script src="../../shared/scripts/status-meta.js"></script>
    <script src="../../shared/scripts/store.js"></script>
    <script src="data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* ផ្ទាំងគ្រប់គ្រងបែប "សកម្មភាពមុនគេ" — គ្មានគំនូសតាង គ្មានតម្រងកាលបរិច្ឆេទ
           តួលេខទាំងអស់គណនាចេញពីទិនានុប្បវត្តិដែលបានចុះជាក់ស្តែង។ */

        function signTone(value) {
            return value < 0 ? 'text-rose-300' : 'text-white';
        }

        function heroStat(label, value, sub, subTone) {
            return `<div class="px-6 py-4">
                <p class="sm-eyebrow text-white/45">${label}</p>
                <p class="sm-kpi-value ${signTone(value.raw)} sm-figure mt-1.5">${value.text}</p>
                <p class="sm-card-sub ${subTone || 'text-white/55'} mt-0.5">${sub}</p>
            </div>`;
        }

        function renderHero(m) {
            document.getElementById('heroCash').textContent = fmtUSD(m.cashTotal);
            document.getElementById('heroPeriod').textContent = `គ្រា ${m.periodName} · គិតត្រឹមថ្ងៃនេះ`;

            document.getElementById('heroCashRows').innerHTML = m.cashRows.map(c => `
                <span class="min-w-0">
                    <span class="sm-eyebrow text-white/40 block truncate">${c.name}</span>
                    <span class="sm-value text-white sm-figure block mt-0.5">${fmtUSD(c.amount)}</span>
                </span>`).join('');

            document.getElementById('heroStats').innerHTML =
                heroStat('ចំណូលក្នុងគ្រា', { raw: m.revenue, text: fmtUSD(m.revenue) },
                    `ចំណេញដុល ${fmtUSD(m.grossProfit)}`) +
                `<div class="sm:border-l border-white/10">` +
                heroStat('ចំណេញសុទ្ធ', { raw: m.netProfit, text: fmtUSD(m.netProfit) },
                    `រឹមចំណេញ ${fmtPercent(m.netMarginPercent)}`,
                    m.netProfit >= 0 ? 'text-emerald-300/80' : 'text-rose-200/80') +
                `</div><div class="sm:border-l border-white/10">` +
                heroStat('បំណុលត្រូវទារ', { raw: m.receivable, text: fmtUSD(m.receivable) },
                    m.overdueCount ? `ហួសកាលកំណត់ ${fmtUSD(m.overdueAmount)}` : 'គ្មានបំណុលហួសកាលកំណត់',
                    m.overdueCount ? 'text-rose-200/80' : 'text-emerald-300/80') +
                `</div>`;
        }

        /* ===== តំបន់ទី 2 — ការងារដែលត្រូវសម្រេច ===== */

        function workRow(opts) {
            return `
                <a href="${opts.href}" class="sm-worklist-row px-5 py-4 flex items-center gap-4 block"
                   style="border-left-color:${opts.accent}">
                    <span class="w-9 h-9 rounded-lg ${opts.iconClass} flex items-center justify-center flex-shrink-0">
                        <i class="fas ${opts.icon} text-sm"></i>
                    </span>
                    <span class="min-w-0 flex-1">
                        <span class="sm-td text-slate-800 block">${opts.title}</span>
                        <span class="sm-td-sub text-slate-500 block truncate">${opts.note}</span>
                    </span>
                    <span class="sm-kpi-value ${opts.countClass} sm-figure flex-shrink-0">${opts.count}</span>
                    <i class="fas fa-chevron-right text-xs text-slate-300 flex-shrink-0"></i>
                </a>`;
        }

        function renderWorkQueue(m) {
            const host = document.getElementById('workQueue');
            const rows = [];

            if (m.draftJournals.length) {
                rows.push(workRow({
                    href: 'ledger/ledger.html',
                    accent: '#f59e0b', icon: 'fa-file-pen',
                    iconClass: 'bg-amber-50 text-amber-600',
                    countClass: 'text-amber-600',
                    title: 'ទិនានុប្បវត្តិព្រាងរង់ចាំការចុះបញ្ជី',
                    note: m.draftJournals.slice(0, 2).map(j => `${j.id} · ${j.description}`).join(' · '),
                    count: m.draftJournals.length
                }));
            }

            if (m.unverifiedClaims.length) {
                rows.push(workRow({
                    href: 'ledger/ledger.html',
                    accent: '#0ea5e9', icon: 'fa-building-columns',
                    iconClass: 'bg-sky-50 text-sky-600',
                    countClass: 'text-sky-600',
                    title: 'ការទូទាត់រង់ចាំការផ្ទៀងផ្ទាត់ធនាគារ',
                    note: `សរុប ${fmtUSD(m.unverifiedClaims.reduce((s, c) => s + c.amount, 0))}`,
                    count: m.unverifiedClaims.length
                }));
            }

            if (m.overdueCount) {
                rows.push(workRow({
                    href: 'reports/financial-reports.html',
                    accent: '#f43f5e', icon: 'fa-triangle-exclamation',
                    iconClass: 'bg-rose-50 text-rose-600',
                    countClass: 'text-rose-600',
                    title: 'វិក្កយបត្រហួសកាលកំណត់ទូទាត់',
                    note: `សរុបត្រូវទារ ${fmtUSD(m.overdueAmount)}`,
                    count: m.overdueCount
                }));
            }

            const head = `
                <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                    <div>
                        <p class="sm-eyebrow text-amber-600">ត្រូវសម្រេចថ្ងៃនេះ</p>
                        <p class="sm-card-sub text-slate-500 mt-1">
                            ${rows.length ? `ការងារ ${rows.length} ប្រភេទរង់ចាំការសម្រេចរបស់លោកអ្នក` : 'គ្មានការងារជាប់គាំងទេ'}
                        </p>
                    </div>
                    <a href="ledger/ledger.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline inline-flex items-center gap-1 flex-shrink-0">
                        សៀវភៅធំ <i class="fas fa-arrow-right text-[10px]"></i>
                    </a>
                </div>`;

            host.innerHTML = head + (rows.length
                ? `<div class="border-t border-slate-100 divide-y divide-slate-100">${rows.join('')}</div>`
                : `<div class="border-t border-slate-100 px-5 py-10 flex flex-col items-center gap-2 text-center">
                       <i class="fas fa-circle-check text-2xl text-emerald-400"></i>
                       <p class="sm-td text-slate-600">សៀវភៅគណនេយ្យស្អាតហើយ</p>
                       <p class="sm-td-sub text-slate-400">គ្មានទិនានុប្បវត្តិព្រាង ឬការទូទាត់រង់ចាំទេ</p>
                   </div>`);
        }

        /* ===== តំបន់ទី 3 — ចំណេញ-ខាត ===== */

        function pnlLine(label, value, opts) {
            const o = opts || {};
            return `
                <div class="px-5 py-3 flex items-baseline justify-between gap-4 ${o.strong ? 'bg-slate-50' : ''}">
                    <span class="${o.strong ? 'sm-td-strong text-slate-800' : 'sm-td text-slate-600'} ${o.indent ? 'pl-4' : ''}">${label}</span>
                    <span class="${o.strong ? 'sm-td-strong' : 'sm-td'} ${o.tone || 'text-slate-700'} sm-figure flex-shrink-0">${value}</span>
                </div>`;
        }

        function renderPnl(m) {
            const p = incomeStatement(m.range);
            document.getElementById('pnlSub').textContent =
                `${m.periodName} · រឹមចំណេញដុល ${fmtPercent(p.grossMarginPercent)}`;

            const host = document.getElementById('pnlRows');
            if (!p.revenue && !p.cogs && !p.opex) {
                host.innerHTML = `<div class="px-5 py-10 text-center">
                    <i class="fas fa-chart-bar text-2xl text-slate-300"></i>
                    <p class="sm-td-sub text-slate-400 mt-2">គ្មានចលនាគណនេយ្យក្នុងគ្រានេះទេ</p>
                </div>`;
                return;
            }

            host.innerHTML =
                pnlLine('ចំណូលពីការលក់', fmtUSD(p.revenue), { strong: true }) +
                p.cogsRows.map(r => pnlLine(r.name, '−' + fmtUSD(r.amount), { indent: true, tone: 'text-rose-600' })).join('') +
                pnlLine('ចំណេញដុល', fmtUSD(p.grossProfit), { strong: true, tone: 'text-emerald-700' }) +
                p.opexRows.map(r => pnlLine(r.name, '−' + fmtUSD(r.amount), { indent: true, tone: 'text-rose-600' })).join('') +
                pnlLine('ចំណេញសុទ្ធក្នុងគ្រា', fmtUSD(p.netProfit), {
                    strong: true, tone: p.netProfit >= 0 ? 'text-emerald-700' : 'text-rose-600'
                });
        }

        /* ===== តំបន់ទី 4 — បំណុល និងពន្ធ ===== */

        function obligationRow(label, amount, note, tone) {
            return `
                <div class="px-5 py-4">
                    <div class="flex items-baseline justify-between gap-3">
                        <span class="sm-td text-slate-700">${label}</span>
                        <span class="sm-td-strong ${tone || 'text-slate-800'} sm-figure flex-shrink-0">${fmtUSD(amount)}</span>
                    </div>
                    <p class="sm-td-sub text-slate-400 mt-0.5">${note}</p>
                </div>`;
        }

        function renderObligations(m) {
            const vat = vatReturn();
            document.getElementById('obligationRows').innerHTML =
                obligationRow('បំណុលត្រូវសងអ្នកផ្គត់ផ្គង់', m.payable, 'សមតុល្យគណនី ' + accountName('2111'), 'text-amber-700') +
                obligationRow('អាករលើតម្លៃបន្ថែមត្រូវបង់', m.vatPayable,
                    `គ្រា ${vat.period} · ការលក់ជាប់អាករ ${fmtUSD(vat.taxableSales)}`, 'text-slate-800') +
                obligationRow('ពន្ធកាត់ទុកត្រូវបង់', m.whtPayable,
                    `អត្រាទំនិញ ${fmtPercent(BMS_STORE.settings().whtGoods * 100)} · សេវា ${fmtPercent(BMS_STORE.settings().whtServices * 100)}`, 'text-slate-800') +
                obligationRow('បំណុលត្រូវទារហួសកាលកំណត់', m.overdueAmount,
                    m.overdueCount ? `វិក្កយបត្រ ${m.overdueCount} ច្បាប់` : 'គ្មានវិក្កយបត្រហួសកាលកំណត់',
                    m.overdueCount ? 'text-rose-600' : 'text-emerald-700');
        }

        /* ===== ដំណើរការ ===== */

        function renderDashboard() {
            const m = dashboardMetrics();
            renderHero(m);
            renderWorkQueue(m);
            renderPnl(m);
            renderObligations(m);
            updatePortalBadges();
        }

        window.onStoreChanged = renderDashboard;

        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>

</html>
