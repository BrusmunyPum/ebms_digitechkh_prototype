<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - របាយការណ៍ពន្ធដារ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root=".." data-active="tax-reports" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="របាយការណ៍ពន្ធដារ"
             data-subtitle="អាករលើតម្លៃបន្ថែម និងពន្ធកាត់ទុក គណនាពីឯកសារជាក់ស្តែង"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-filter text-slate-400 text-xs"></i>
                        <span class="sm-label text-slate-600">គ្រាពន្ធ</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <div id="dateFilterHost" class="flex items-center"></div>
                        <span class="w-px h-6 bg-slate-200 hidden sm:!block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <button onclick="window.print()"
                                class="sm-badge px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition flex items-center gap-1.5">
                                <i class="fas fa-print text-slate-500"></i> បោះពុម្ព
                            </button>
                        </div>
                    </div>
                </div>

                <div id="taxSummary" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>

                <!-- អាករលើតម្លៃបន្ថែម -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden sm-print-block">
                    <div class="px-6 pt-6 pb-4 border-b border-slate-100">
                        <h2 class="sm-card-title text-slate-800">អាករលើតម្លៃបន្ថែម</h2>
                        <p id="vatPeriod" class="sm-card-sub text-slate-500 mt-1"></p>
                    </div>
                    <div id="vatBody"></div>
                </div>

                <!-- ពន្ធកាត់ទុក -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden sm-print-block">
                    <div class="px-6 pt-6 pb-4 border-b border-slate-100">
                        <h2 class="sm-card-title text-slate-800">ពន្ធកាត់ទុក</h2>
                        <p id="whtPeriod" class="sm-card-sub text-slate-500 mt-1"></p>
                    </div>
                    <div id="whtBody"></div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        function statCard(label, value, tone, sub) {
            return `<div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                <p class="sm-eyebrow text-slate-400">${label}</p>
                <p class="sm-kpi-value ${tone} sm-figure mt-1.5">${value}</p>
                ${sub ? `<p class="sm-kpi-sub text-slate-500 mt-1">${sub}</p>` : ''}
            </div>`;
        }

        function taxLine(label, value, opts) {
            const o = opts || {};
            return `
                <div class="px-6 py-3 flex items-baseline justify-between gap-4 ${o.strong ? 'bg-slate-50 border-y border-slate-100' : ''}">
                    <span class="${o.strong ? 'sm-td-strong text-slate-800' : 'sm-td text-slate-600'} ${o.indent ? 'pl-5' : ''}">${label}</span>
                    <span class="${o.strong ? 'sm-td-strong' : 'sm-td'} ${o.tone || 'text-slate-700'} sm-figure flex-shrink-0">${value}</span>
                </div>`;
        }

        function renderTax() {
            const range = safeRange(getSelectedRange());
            const vat = vatReturn(range);
            const wht = whtReturn(range);

            document.getElementById('taxSummary').innerHTML =
                statCard('អាករលើតម្លៃបន្ថែមត្រូវបង់', fmtUSD(vat.netPayable),
                    vat.netPayable > 0 ? 'text-slate-800' : 'text-emerald-600', `គ្រា ${vat.period}`) +
                statCard('ពន្ធកាត់ទុកត្រូវបង់', fmtUSD(wht.bookBalance),
                    wht.bookBalance > 0 ? 'text-slate-800' : 'text-emerald-600', 'តាមសមតុល្យសៀវភៅធំ') +
                statCard('ការលក់ជាប់អាករ', fmtUSD(vat.taxableSales), 'text-slate-700',
                    `វិក្កយបត្រ ${vat.invoiceCount} ច្បាប់`);

            document.getElementById('vatPeriod').textContent =
                `គ្រា ${vat.period} · អត្រា ${fmtPercent(vat.rate * 100)}`;

            const vatHost = document.getElementById('vatBody');
            if (!vat.invoiceCount) {
                vatHost.innerHTML = `<div class="px-6 py-14 text-center">
                    <i class="fas fa-file-invoice text-2xl text-slate-300"></i>
                    <p class="sm-card-sub text-slate-500 mt-2">គ្មានវិក្កយបត្រក្នុងគ្រានេះទេ</p>
                </div>`;
            } else {
                vatHost.innerHTML =
                    taxLine('ការលក់ជាប់អាករ (មិនរាប់អាករ)', fmtUSD(vat.taxableSales)) +
                    taxLine(`អាករលើការលក់ចេញ ${fmtPercent(vat.rate * 100)}`, fmtUSD(vat.outputVat), { indent: true }) +
                    taxLine('អាករលើការទិញចូល', fmtUSD(vat.inputVat), { indent: true, tone: 'text-slate-400' }) +
                    taxLine('អាករសុទ្ធត្រូវបង់', fmtUSD(vat.netPayable), { strong: true }) +
                    taxLine('សមតុល្យតាមសៀវភៅធំ', fmtUSD(vat.bookBalance), { tone: 'text-slate-500' }) +
                    `<div class="px-6 py-4 border-t border-slate-100">
                        <p class="sm-td-sub text-slate-400">
                            អាករលើការទិញចូលនឹងលេចឡើង នៅពេលវដ្តទិញចូល និងវិក្កយបត្រអ្នកផ្គត់ផ្គង់ត្រូវបានដាក់ឱ្យប្រើប្រាស់
                        </p>
                    </div>`;
            }

            document.getElementById('whtPeriod').textContent =
                `គ្រា ${wht.period} · អត្រាទំនិញ ${fmtPercent(wht.goodsRate * 100)} · អត្រាសេវា ${fmtPercent(wht.servicesRate * 100)}`;

            document.getElementById('whtBody').innerHTML =
                taxLine('សមតុល្យពន្ធកាត់ទុកត្រូវបង់', fmtUSD(wht.bookBalance), { strong: true }) +
                `<div class="px-6 py-4 border-t border-slate-100">
                    <p class="sm-td-sub text-slate-400">
                        ពន្ធកាត់ទុកកើតឡើងនៅពេលទូទាត់ជូនអ្នកផ្គត់ផ្គង់។ តួលេខលម្អិតនឹងបង្ហាញ
                        នៅពេលប័ណ្ណចំណាយត្រូវបានដាក់ឱ្យប្រើប្រាស់ក្នុងប្រព័ន្ធ។
                    </p>
                </div>`;

            updatePortalBadges();
        }

        window.onDateRangeApplied = renderTax;
        window.onStoreChanged = renderTax;

        document.addEventListener('DOMContentLoaded', () => {
            renderDateRangePicker('dateFilterHost');
            renderTax();
        });
    </script>
</body>

</html>
