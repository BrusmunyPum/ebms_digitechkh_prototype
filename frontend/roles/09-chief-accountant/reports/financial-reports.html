<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - វិភាគហិរញ្ញវត្ថុ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root=".." data-active="financial-statements" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="វិភាគហិរញ្ញវត្ថុ"
             data-subtitle="និន្នាការចំណូល ចំណេញ និងរចនាសម្ព័ន្ធបំណុល"
             data-back="../financial-statements/financial-statements.html"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-filter text-slate-400 text-xs"></i>
                        <span class="sm-label text-slate-600">កំឡុងពេលវិភាគ</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <div id="dateFilterHost" class="flex items-center"></div>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <button onclick="window.print()"
                                class="sm-badge px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition flex items-center gap-1.5">
                                <i class="fas fa-print text-slate-500"></i> បោះពុម្ព
                            </button>
                        </div>
                    </div>
                </div>

                <div id="reportSummary" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                    <div class="mb-3">
                        <h3 class="sm-card-title text-slate-700">ចំណូល និងចំណេញ 6 ខែចុងក្រោយ</h3>
                        <p class="sm-card-sub text-slate-500">គណនាពីទិនានុប្បវត្តិដែលបានចុះបញ្ជី</p>
                    </div>
                    <div id="profitTrendChart" class="w-full h-72"></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                        <h3 class="sm-card-title text-slate-700 mb-3">រចនាសម្ព័ន្ធទ្រព្យសកម្ម</h3>
                        <div id="assetChart" class="w-full h-72"></div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 pt-5 pb-3">
                            <p class="sm-eyebrow text-slate-400">វិក្កយបត្រហួសកាលកំណត់</p>
                            <p id="overdueSub" class="sm-card-sub text-slate-500 mt-1"></p>
                        </div>
                        <div class="overflow-x-auto border-t border-slate-100">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                    <tr>
                                        <th class="sm-th py-3 px-4">វិក្កយបត្រ</th>
                                        <th class="sm-th py-3 px-4">អតិថិជន</th>
                                        <th class="sm-th py-3 px-4">យឺត</th>
                                        <th class="sm-th py-3 px-4 text-right">នៅសល់</th>
                                    </tr>
                                </thead>
                                <tbody id="overdueBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let profitChart = null;
        let assetChart = null;

        function statCard(label, value, tone, sub) {
            return `<div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                <p class="sm-eyebrow text-slate-400">${label}</p>
                <p class="sm-kpi-value ${tone} sm-figure mt-1.5">${value}</p>
                ${sub ? `<p class="sm-kpi-sub text-slate-500 mt-1">${sub}</p>` : ''}
            </div>`;
        }

        function renderReports() {
            const range = safeRange(getSelectedRange());
            const p = incomeStatement(range);
            const bs = balanceSheet();
            const m = dashboardMetrics();

            document.getElementById('reportSummary').innerHTML =
                statCard('ចំណូល', fmtUSD(p.revenue), 'text-slate-700', `គ្រា ${periodName(range)}`) +
                statCard('ចំណេញដុល', fmtUSD(p.grossProfit), 'text-emerald-600', `រឹម ${fmtPercent(p.grossMarginPercent)}`) +
                statCard('ចំណេញសុទ្ធ', fmtUSD(p.netProfit),
                    p.netProfit >= 0 ? 'text-emerald-600' : 'text-rose-600', `រឹម ${fmtPercent(p.netMarginPercent)}`) +
                statCard('ទ្រព្យសកម្មសរុប', fmtUSD(bs.totalAssets), 'text-slate-700',
                    `បំណុល ${fmtUSD(bs.totalLiabilities)}`);

            const overdue = m.overdueList;
            document.getElementById('overdueSub').textContent = overdue.length
                ? `${overdue.length} ច្បាប់ · សរុប ${fmtUSD(m.overdueAmount)}`
                : 'គ្មានវិក្កយបត្រហួសកាលកំណត់';

            document.getElementById('overdueBody').innerHTML = overdue.length
                ? overdue.map(inv => {
                    const c = BMS_STORE.get('customers', inv.customerId);
                    return `<tr class="hover:bg-slate-50 transition">
                        <td class="sm-td py-3 px-4 sm-figure">${inv.id}</td>
                        <td class="sm-td py-3 px-4 truncate">${c ? c.name : inv.customerId}</td>
                        <td class="sm-td py-3 px-4 text-rose-600 sm-figure">${daysBetween(inv.dueDate)} ថ្ងៃ</td>
                        <td class="sm-td-strong py-3 px-4 text-right sm-figure">${fmtUSD(invoiceState(inv).due)}</td>
                    </tr>`;
                }).join('')
                : '<tr><td colspan="4" class="sm-card-sub text-slate-500 py-10 text-center">គ្មានវិក្កយបត្រហួសកាលកំណត់ទេ</td></tr>';

            renderCharts(bs);
        }

        function renderCharts(bs) {
            const series = monthlyProfitSeries(6);
            const trendEl = document.getElementById('profitTrendChart');
            if (trendEl) {
                if (!profitChart) profitChart = echarts.init(trendEl);
                profitChart.setOption({
                    tooltip: { trigger: 'axis', textStyle: { fontFamily: 'Kantumruy Pro' } },
                    legend: { data: ['ចំណូល', 'ចំណេញដុល', 'ចំណេញសុទ្ធ'], bottom: 0, textStyle: { fontFamily: 'Kantumruy Pro' } },
                    grid: { top: '10%', left: '3%', right: '4%', bottom: '15%', containLabel: true },
                    xAxis: { type: 'category', data: series.map(s => s.month), axisLabel: { fontFamily: 'Kantumruy Pro' } },
                    yAxis: { type: 'value', axisLabel: { fontFamily: 'Kantumruy Pro' } },
                    series: [
                        { name: 'ចំណូល', type: 'bar', data: series.map(s => s.revenue), itemStyle: { color: '#1e3a5f', borderRadius: [6, 6, 0, 0] } },
                        { name: 'ចំណេញដុល', type: 'line', smooth: true, data: series.map(s => s.grossProfit), itemStyle: { color: '#10b981' }, lineStyle: { width: 3 } },
                        { name: 'ចំណេញសុទ្ធ', type: 'line', smooth: true, data: series.map(s => s.netProfit), itemStyle: { color: '#f59e0b' }, lineStyle: { width: 3, type: 'dashed' } }
                    ]
                }, true);
            }

            const assetEl = document.getElementById('assetChart');
            if (assetEl) {
                if (!assetChart) assetChart = echarts.init(assetEl);
                const palette = ['#1e3a5f', '#0ea5e9', '#10b981', '#f59e0b', '#a855f7', '#64748b'];
                assetChart.setOption({
                    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)', textStyle: { fontFamily: 'Kantumruy Pro' } },
                    legend: { bottom: 0, textStyle: { fontFamily: 'Kantumruy Pro' } },
                    series: [{
                        type: 'pie', radius: ['45%', '70%'], avoidLabelOverlap: true,
                        itemStyle: { borderColor: '#fff', borderWidth: 2 }, label: { show: false },
                        data: bs.assets.filter(a => a.amount > 0).map((a, i) => ({
                            value: Math.round(a.amount), name: a.name,
                            itemStyle: { color: palette[i % palette.length] }
                        }))
                    }]
                }, true);
            }
        }

        window.onDateRangeApplied = renderReports;
        window.onStoreChanged = renderReports;

        document.addEventListener('DOMContentLoaded', () => {
            renderDateRangePicker('dateFilterHost');
            renderReports();
            updatePortalBadges();
            window.addEventListener('resize', () => {
                [profitChart, assetChart].forEach(c => { if (c) c.resize(); });
            });
        });
    </script>
</body>

</html>
