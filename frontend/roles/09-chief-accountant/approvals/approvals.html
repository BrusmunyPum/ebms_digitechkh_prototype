<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - មជ្ឈមណ្ឌលអនុម័តហិរញ្ញវត្ថុ</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root=".." data-active="approvals" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Content Top Header -->
        <div id="headerHost" data-title="មជ្ឈមណ្ឌលអនុម័តហិរញ្ញវត្ថុ"
             data-subtitle="ត្រួតពិនិត្យប័ណ្ណចំណាយទូទាត់ > $500, ការកែតម្រូវទ្វេបញ្ជី, និងលុបបំណុលខូច"></div>

        <!-- Main Content -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- Filter Bar -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-3">
                        <select id="typeFilter" onchange="renderApprovalsTable()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 outline-none focus:border-primary font-medium cursor-pointer">
                            <option value="">ប្រភេទសំណើទាំងអស់</option>
                            <option value="disbursement">ប័ណ្ណចំណាយទូទាត់ (Disbursement)</option>
                            <option value="adjustment">ការចុះបញ្ជីកែតម្រូវ (Journal Entry)</option>
                            <option value="writeoff">លុបបំណុលខូច (Write-Off)</option>
                        </select>

                        <select id="statusFilter" onchange="renderApprovalsTable()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 outline-none focus:border-primary font-medium cursor-pointer">
                            <option value="">ស្ថានភាពទាំងអស់</option>
                            <option value="pending">រង់ចាំការអនុម័ត (Pending)</option>
                            <option value="approved">បានអនុម័ត (Approved)</option>
                            <option value="rejected">បានបដិសេធ (Rejected)</option>
                        </select>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs text-slate-500">សរុប: <strong id="totalCount" class="text-slate-800">0</strong> សំណើ</span>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <span class="px-3.5 py-1.5 rounded-xl bg-purple-50 text-purple-700 font-semibold text-xs border border-purple-200">
                                <i class="fas fa-signature mr-1"></i> សិទ្ធិត្រួតពិនិត្យហិរញ្ញវត្ថុ
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50/70 border-b border-slate-200/70 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                                <tr>
                                    <th class="py-3 px-4">លេខកូដសំណើ</th>
                                    <th class="py-3 px-4">បរិយាយសំណើ</th>
                                    <th class="py-3 px-4">ប្រភេទ</th>
                                    <th class="py-3 px-4">អ្នកស្នើសុំ</th>
                                    <th class="py-3 px-4">កាលបរិច្ឆេទ</th>
                                    <th class="py-3 px-4 text-right">ទឹកប្រាក់សរុប</th>
                                    <th class="py-3 px-4 text-center">កម្រិតអនុម័ត</th>
                                    <th class="py-3 px-4 text-center">ស្ថានភាព</th>
                                    <th class="py-3 px-4 text-center">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="approvalsTableBody" class="divide-y divide-slate-100 text-slate-700 font-medium"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPortalSidebar();
            renderApprovalsTable();
        });

        function renderApprovalsTable() {
            const store = getCAStore();
            const typeVal = document.getElementById('typeFilter').value;
            const statusVal = document.getElementById('statusFilter').value;

            let filtered = store.approvals.filter(a => {
                const matchType = !typeVal || a.type === typeVal;
                const matchStatus = !statusVal || a.status === statusVal;
                return matchType && matchStatus;
            });

            document.getElementById('totalCount').innerText = filtered.length;
            const tbody = document.getElementById('approvalsTableBody');

            const typeBadges = {
                disbursement: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">ប័ណ្ណចំណាយ</span>',
                adjustment: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-purple-50 text-purple-700 border border-purple-200">កែតម្រូវទ្វេបញ្ជី</span>',
                writeoff: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-50 text-rose-700 border border-rose-200">លុបបំណុលខូច</span>'
            };

            const statusBadges = {
                pending: '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">រង់ចាំអនុម័ត</span>',
                approved: '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">បានអនុម័ត</span>',
                rejected: '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-700 border border-rose-200">បានបដិសេធ</span>'
            };

            const levelNames = {
                chief_accountant: '<span class="text-indigo-600 font-semibold text-[11px]">Chief Acct</span>',
                general_manager: '<span class="text-purple-600 font-semibold text-[11px]">GM អនុម័ត</span>'
            };

            tbody.innerHTML = filtered.map(a => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-3 px-4 font-bold text-primary">
                        <a href="view-approval.html?id=${a.id}" class="hover:underline">${a.refNo}</a>
                    </td>
                    <td class="py-3 px-4">
                        <div class="font-medium text-slate-800">${a.title}</div>
                        <div class="text-[11px] text-slate-400 truncate max-w-xs">${a.description}</div>
                    </td>
                    <td class="py-3 px-4">${typeBadges[a.type] || a.type}</td>
                    <td class="py-3 px-4 text-slate-600 text-[11px]">${a.requestor}</td>
                    <td class="py-3 px-4 text-slate-600">${a.date}</td>
                    <td class="py-3 px-4 text-right font-bold text-slate-900">$${a.amount.toFixed(2)}</td>
                    <td class="py-3 px-4 text-center">${levelNames[a.level] || a.level}</td>
                    <td class="py-3 px-4 text-center">${statusBadges[a.status] || a.status}</td>
                    <td class="py-3 px-4 text-center">
                        <a href="view-approval.html?id=${a.id}" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-primary hover:text-white text-slate-700 text-[11px] font-medium transition inline-block">
                            ពិនិត្យ
                        </a>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>

</html>
