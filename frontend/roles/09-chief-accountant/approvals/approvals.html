<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ការងាររង់ចាំសម្រេច</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="caPortal" data-role-root=".." data-active="approvals" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ការងាររង់ចាំសម្រេច"
             data-subtitle="ទិនានុប្បវត្តិព្រាង និងការទូទាត់ដែលរង់ចាំការផ្ទៀងផ្ទាត់"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- របារគោលការណ៍ — បង្ហាញជានិច្ច មិនអាចបិទបាន -->
                <div class="rounded-2xl border border-amber-200 border-l-4 border-l-amber-500 bg-amber-50/70 p-4">
                    <div class="flex items-start gap-3">
                        <span class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-circle-info text-sm"></i>
                        </span>
                        <div class="min-w-0 flex-1">
                            <h3 class="sm-card-title text-amber-900">គោលការណ៍ចុះបញ្ជី</h3>
                            <p class="sm-td-sub text-amber-800 mt-1.5">
                                ទិនានុប្បវត្តិដែលបានចុះបញ្ជីមិនអាចលុបចោលបានទេ។ ការកែតម្រូវត្រូវធ្វើតាមទិនានុប្បវត្តិបញ្ច្រាស
                                ហើយរាល់សកម្មភាពត្រូវកត់ត្រាក្នុងកំណត់ហេតុសវនកម្ម។
                            </p>
                        </div>
                    </div>
                </div>

                <!-- ថេប -->
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center gap-2">
                    <button id="tabBtn-drafts" onclick="switchWorkTab('drafts')"
                        class="sm-badge px-5 py-2.5 rounded-xl bg-[#1e3a5f] text-white font-semibold shadow-sm transition">
                        ទិនានុប្បវត្តិព្រាង (<span id="tabCount-drafts">0</span>)
                    </button>
                    <button id="tabBtn-claims" onclick="switchWorkTab('claims')"
                        class="sm-badge px-5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition">
                        ការទូទាត់រង់ចាំផ្ទៀងផ្ទាត់ (<span id="tabCount-claims">0</span>)
                    </button>
                    <span class="ml-auto w-px h-6 bg-slate-200 hidden sm:block"></span>
                    <div class="flex flex-wrap items-center gap-2 no-print">
                        <span id="headerQueuePill" class="sm-badge hidden sm:inline-flex font-semibold px-3 py-1.5 rounded-xl bg-amber-50 text-amber-700 border border-amber-200"></span>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div id="queueList" class="divide-y divide-slate-100"></div>
                    <div id="queueEmpty" class="hidden py-14 px-6 text-center">
                        <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-circle-check text-2xl"></i>
                        </div>
                        <p class="sm-card-title text-slate-700">គ្មានការងាររង់ចាំទេ</p>
                        <p id="queueEmptyNote" class="sm-card-sub text-slate-500 mt-1"></p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        let activeTab = 'drafts';

        function draftRow(j) {
            const t = journalTotals(j);
            const balanced = Math.abs(t.dr - t.cr) < 0.01;
            return `
                <div class="sm-worklist-row px-5 py-4 flex flex-wrap items-center gap-x-5 gap-y-3"
                     style="border-left-color:${balanced ? '#f59e0b' : '#f43f5e'}">
                    <div class="min-w-[240px] flex-1">
                        <a href="../ledger/view-journal.html?id=${j.id}" class="sm-td-strong text-[#1e3a5f] hover:underline sm-figure">${j.id}</a>
                        <span class="sm-td text-slate-700 block truncate">${j.description}</span>
                        <span class="sm-td-sub text-slate-500 block sm-figure">${fmtKhDate(j.date)} · ${sourceLabel(j.source)} · ជួរ ${j.lines.length}</span>
                    </div>

                    <div class="flex items-center gap-4 flex-shrink-0">
                        <span class="text-right">
                            <span class="sm-td-sub text-slate-400 block">ឥណពន្ធ</span>
                            <span class="sm-td-strong text-slate-800 sm-figure">${fmtUSD(t.dr)}</span>
                        </span>
                        <span class="text-right">
                            <span class="sm-td-sub text-slate-400 block">ឥណទាន</span>
                            <span class="sm-td-strong text-slate-800 sm-figure">${fmtUSD(t.cr)}</span>
                        </span>
                    </div>

                    ${balanced
                        ? '<span class="sm-badge px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 flex-shrink-0">តុល្យភាពត្រូវ</span>'
                        : `<span class="sm-badge px-2 py-0.5 rounded-md bg-rose-50 text-rose-700 flex-shrink-0">គម្លាត ${fmtUSD(Math.abs(t.dr - t.cr))}</span>`}

                    <div class="flex items-center gap-2 ml-auto flex-shrink-0 no-print">
                        <button onclick="postDraft('${j.id}')" ${balanced ? '' : 'disabled'}
                            class="sm-badge px-3.5 py-1.5 rounded-lg font-semibold transition ${balanced
                                ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                                : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
                            ចុះបញ្ជី
                        </button>
                        <a href="../ledger/view-journal.html?id=${j.id}" aria-label="មើលលម្អិត"
                            class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition">
                            <i class="fas fa-chevron-right text-xs"></i>
                        </a>
                    </div>
                </div>`;
        }

        function claimRow(c) {
            const inv = BMS_STORE.get('invoices', c.invoiceId);
            const cust = inv ? BMS_STORE.get('customers', inv.customerId) : null;
            return `
                <div class="sm-worklist-row px-5 py-4 flex flex-wrap items-center gap-x-5 gap-y-3" style="border-left-color:#0ea5e9">
                    <div class="min-w-[240px] flex-1">
                        <span class="sm-td-strong text-slate-800 sm-figure block">${c.id}</span>
                        <span class="sm-td text-slate-700 block truncate">${cust ? cust.name : c.customerId}</span>
                        <span class="sm-td-sub text-slate-500 block sm-figure">${c.invoiceId} · ${PAYMENT_METHOD_LABEL[c.method] || c.method} · យោង ${c.bankRef}</span>
                    </div>
                    <span class="sm-td-strong text-slate-800 sm-figure flex-shrink-0">${fmtUSD(c.amount)}</span>
                    <span class="sm-badge px-2 py-0.5 rounded-md bg-amber-50 text-amber-700 flex-shrink-0">${statusLabel('PENDING_VERIFICATION')}</span>
                    <p class="sm-td-sub text-slate-400 ml-auto flex-shrink-0">ផ្នែកគណនេយ្យបំណុល និងទារប្រាក់ត្រូវចេញបង្កាន់ដៃ</p>
                </div>`;
        }

        function renderQueue() {
            const drafts = listJournals({ status: 'DRAFT' });
            const claims = BMS_STORE.list('paymentClaims').filter(c => c.status === 'PENDING_VERIFICATION');

            document.getElementById('tabCount-drafts').textContent = drafts.length;
            document.getElementById('tabCount-claims').textContent = claims.length;
            document.getElementById('headerQueuePill').textContent = `${drafts.length + claims.length} ការងាររង់ចាំ`;

            const rows = activeTab === 'drafts' ? drafts : claims;
            const host = document.getElementById('queueList');
            const empty = document.getElementById('queueEmpty');

            empty.classList.toggle('hidden', rows.length > 0);
            document.getElementById('queueEmptyNote').textContent = activeTab === 'drafts'
                ? 'ទិនានុប្បវត្តិទាំងអស់បានចុះបញ្ជីចូលសៀវភៅធំរួចហើយ'
                : 'គ្មានការទូទាត់ណារង់ចាំការផ្ទៀងផ្ទាត់ធនាគារទេ';

            host.innerHTML = activeTab === 'drafts'
                ? drafts.map(draftRow).join('')
                : claims.map(claimRow).join('');

            updatePortalBadges();
        }

        async function postDraft(id) {
            const j = getJournal(id);
            if (!j) return;
            const t = journalTotals(j);
            const ok = await showCustomConfirm({
                title: 'ចុះបញ្ជីចូលសៀវភៅធំ',
                message: `ទិនានុប្បវត្តិ ${id} ទឹកប្រាក់ ${fmtUSD(t.dr)} នឹងចូលសៀវភៅធំជាស្ថាពរ។ ការកែតម្រូវក្រោយមកត្រូវធ្វើតាមទិនានុប្បវត្តិបញ្ច្រាស។ តើបន្តមែនទេ?`,
                confirmText: 'ចុះបញ្ជី',
                cancelText: 'បោះបង់'
            });
            if (!ok) return;

            const res = caActions.postDraft(id);
            if (!res.ok) return showToast(res.error, 'error');
            showToast(`បានចុះបញ្ជីទិនានុប្បវត្តិ ${id} ចូលសៀវភៅធំ`, 'success');
        }

        function switchWorkTab(name) {
            activeTab = name;
            closeAllFloatingDropdowns();
            ['drafts', 'claims'].forEach(t => {
                document.getElementById('tabBtn-' + t).className = t === name
                    ? 'sm-badge px-5 py-2.5 rounded-xl bg-[#1e3a5f] text-white font-semibold shadow-sm transition'
                    : 'sm-badge px-5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition';
            });
            renderQueue();
        }

        window.onStoreChanged = renderQueue;

        document.addEventListener('DOMContentLoaded', renderQueue);
    </script>
</body>

</html>
