<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - បញ្ជីសំណើរង់ចាំការអនុម័ត</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>
<body id="smPortal" data-role-root=".." data-active="approvals" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បញ្ជីសំណើរង់ចាំការអនុម័ត"
             data-subtitle="ពិនិត្យ យល់ព្រម ឬបដិសេធសម្រង់តម្លៃ ការលុបចោលវិក្កយបត្រ និងការបង្កើនឥណទាន"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- របារគោលការណ៍ដែនសិទ្ធិ — បង្ហាញជានិច្ច មិនអាចបិទបាន (ឯកសារ 03 ផ្នែក 3.2 ក) -->
                <div class="rounded-2xl border border-amber-200 border-l-4 border-l-amber-500 bg-amber-50/70 p-4">
                    <div class="flex items-start gap-3">
                        <span class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-circle-info text-sm"></i>
                        </span>
                        <div class="min-w-0 flex-1">
                            <h3 class="sm-card-title text-amber-900">ដែនសិទ្ធិអនុម័តរបស់លោកអ្នក</h3>
                            <div id="policyTiers" class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-3"></div>
                            <p id="policyDiscountNote" class="sm-td-sub text-amber-800 mt-3"></p>
                        </div>
                    </div>
                </div>

                <!-- Tab Controls -->
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center gap-2">
                    <button id="tabBtn-quote" onclick="switchApprovalTab('quote')" class="sm-badge px-5 py-2.5 rounded-xl bg-[#1e3a5f] text-white font-semibold shadow-sm transition">
                        សម្រង់តម្លៃ (<span id="tabCount-quote">0</span>)
                    </button>
                    <button id="tabBtn-void" onclick="switchApprovalTab('void')" class="sm-badge px-5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition">
                        សំណើលុបចោលវិក្កយបត្រ (<span id="tabCount-void">0</span>)
                    </button>
                    <button id="tabBtn-credit" onclick="switchApprovalTab('credit')" class="sm-badge px-5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition">
                        សំណើបង្កើនឥណទាន (<span id="tabCount-credit">0</span>)
                    </button>
                    <span class="ml-auto w-px h-6 bg-slate-200 hidden sm:block"></span>
                    <div class="flex flex-wrap items-center gap-2 no-print">
                        <span id="headerQueuePill" class="sm-badge hidden sm:inline-flex font-semibold px-3 py-1.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200"></span>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead id="queueHead" class="bg-slate-50 text-slate-500 border-b border-slate-100"></thead>
                            <tbody id="queueBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                        </table>
                    </div>
                    <div id="queueEmpty" class="hidden py-14 px-6 text-center">
                        <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-circle-check text-2xl"></i>
                        </div>
                        <h3 class="sm-card-title text-slate-700">គ្មានសំណើរង់ចាំទេ</h3>
                        <p class="sm-card-sub text-slate-500 mt-1">សំណើទាំងអស់ក្នុងប្រភេទនេះត្រូវបានសម្រេចរួចរាល់ហើយ។</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        function buildQueue() {
            return {
                quote: pendingQuotes().map(q => {
                    const cust = getCustomer(q.customerId);
                    const totals = quoteTotals(q);
                    return {
                        id: q.id,
                        customer: cust.name,
                        tier: tierLabel(cust.tier),
                        requester: getRep(q.repId).name,
                        amount: fmtUSD(totals.grandTotal),
                        date: fmtKhDateTime(q.date),
                        discount: q.discountPercent,
                        needsGm: q.requiredLevels.includes('GM')
                    };
                }),
                void: pendingVoids().map(v => {
                    const cust = getCustomer(v.customerId);
                    const inv = listInvoices().find(i => i.id === v.invoiceId);
                    return {
                        id: v.id,
                        ref: v.invoiceId,
                        customer: cust.name,
                        tier: tierLabel(cust.tier),
                        requester: getRep(v.repId).name,
                        amount: inv ? fmtUSD(docTotals(inv).grandTotal) : '—',
                        date: fmtKhDateTime(v.date),
                        stock: v.stockReleased ? 'បានបញ្ចេញពីឃ្លាំងរួច' : 'មិនទាន់បញ្ចេញពីឃ្លាំង',
                        stockTone: v.stockReleased ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200',
                        reason: v.reason
                    };
                }),
                credit: pendingCredits().map(c => {
                    const cust = getCustomer(c.customerId);
                    const debtInv = listInvoices().filter(i => i.customerId === c.customerId && invoiceState(i).key === 'OVERDUE');
                    const debt = debtInv.reduce((s, i) => s + invoiceState(i).due, 0);
                    const oldestDays = debtInv.length ? Math.max(...debtInv.map(i => daysBetween(i.dueDate))) : 0;
                    return {
                        id: c.id,
                        customer: cust.name,
                        tier: tierLabel(cust.tier),
                        requester: getRep(c.repId).name,
                        date: fmtKhDateTime(c.date),
                        currentLimit: fmtUSD(c.currentLimit),
                        requestedLimit: fmtUSD(c.requestedLimit),
                        debt: debt ? `${fmtUSD(debt)} · ជំពាក់ ${oldestDays} ថ្ងៃ` : fmtUSD(0),
                        reason: c.reason
                    };
                })
            };
        }

        let QUEUE = { quote: [], void: [], credit: [] };
        let activeTab = 'quote';

        const HEADS = {
            quote: ['លេខសម្រង់តម្លៃ', 'អតិថិជន', 'ស្នើដោយ', 'ទឹកប្រាក់សរុប', 'កាលបរិច្ឆេទ', 'ការបញ្ចុះតម្លៃ'],
            void: ['លេខសំណើ', 'អតិថិជន', 'ស្នើដោយ', 'ទឹកប្រាក់', 'ស្ថានភាពស្តុក', 'មូលហេតុ'],
            credit: ['អតិថិជន', 'ស្នើដោយ', 'ពិដានបច្ចុប្បន្ន', 'ពិដានស្នើសុំថ្មី', 'បំណុលបច្ចុប្បន្ន', 'មូលហេតុ']
        };

        function rowActionMenu(item, tab) {
            const menuId = 'rowMenu-' + item.id;

            const viewItem = tab === 'quote' ? `
                <a href="view-approval.html?type=quote&id=${item.id}" class="sm-row-menu-item flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition">
                    <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0"><i class="fas fa-eye text-[11px]"></i></span>
                    មើលលម្អិត
                </a>` : '';

            const approveLabel = tab === 'quote' && item.needsGm ? 'អនុម័ត ហើយបញ្ជូនទៅអភិបាលទូទៅ' : 'យល់ព្រមអនុម័ត';

            return `
                <button onclick="toggleRowActionMenu(event, '${menuId}')"
                    class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-slate-700 border border-slate-200/70 inline-flex items-center justify-center transition">
                    <i class="fas fa-ellipsis-vertical text-sm"></i>
                </button>
                <div id="${menuId}" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left">
                    <div class="px-3 py-2 mb-1 rounded-xl bg-slate-50 border border-slate-100">
                        <p class="sm-td-sub text-slate-400">សកម្មភាពលើឯកសារ</p>
                        <p class="sm-value text-slate-700">${item.id}</p>
                    </div>
                    ${viewItem}
                    <button onclick="decide('${tab}','${item.id}','approve')" class="sm-row-menu-item w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-emerald-700 hover:bg-emerald-50 transition text-left">
                        <span class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-check text-[11px]"></i></span>
                        ${approveLabel}
                    </button>
                    <button onclick="decide('${tab}','${item.id}','reject')" class="sm-row-menu-item w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-rose-700 hover:bg-rose-50 transition text-left">
                        <span class="w-7 h-7 rounded-lg bg-rose-100 text-rose-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-xmark text-[11px]"></i></span>
                        បដិសេធ
                    </button>
                </div>`;
        }

        function discountBadge(item) {
            const over = item.discount > BMS_STORE.settings().discountSelfLimit;
            const cls = over ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-blue-50 text-blue-800 border-blue-200';
            return `<span class="sm-badge px-2 py-0.5 rounded-full border ${cls}">បញ្ចុះតម្លៃ ${fmtPercent(item.discount)}</span>
                ${item.needsGm ? '<p class="sm-td-sub text-purple-700 mt-1">ត្រូវការអភិបាលទូទៅបន្ត</p>' : ''}`;
        }

        function renderQueue() {
            const head = document.getElementById('queueHead');
            const body = document.getElementById('queueBody');
            const empty = document.getElementById('queueEmpty');
            const items = QUEUE[activeTab];

            head.innerHTML = '<tr>' +
                HEADS[activeTab].map(h => `<th class="sm-th py-3.5 px-4">${h}</th>`).join('') +
                '<th class="sm-th py-3.5 px-4 text-right">សកម្មភាព</th></tr>';

            if (!items.length) {
                body.innerHTML = '';
                head.parentElement.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            head.parentElement.classList.remove('hidden');
            empty.classList.add('hidden');

            body.innerHTML = items.map(item => {
                let cells = '';
                if (activeTab === 'quote') {
                    cells = `
                        <td class="sm-td-strong py-3.5 px-4">${item.id}</td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${item.customer}</p>
                            <p class="sm-td-sub text-slate-400">${item.tier}</p>
                        </td>
                        <td class="sm-td py-3.5 px-4">${item.requester}</td>
                        <td class="sm-td-strong py-3.5 px-4">${item.amount}</td>
                        <td class="sm-td py-3.5 px-4 text-slate-500">${item.date}</td>
                        <td class="py-3.5 px-4">${discountBadge(item)}</td>`;
                } else if (activeTab === 'void') {
                    cells = `
                        <td class="sm-td-strong py-3.5 px-4">${item.id}<p class="sm-td-sub text-slate-400">${item.ref}</p></td>
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${item.customer}</p>
                            <p class="sm-td-sub text-slate-400">${item.tier}</p>
                        </td>
                        <td class="sm-td py-3.5 px-4">${item.requester}</td>
                        <td class="sm-td-strong py-3.5 px-4">${item.amount}</td>
                        <td class="py-3.5 px-4"><span class="sm-badge px-2 py-0.5 rounded-full border ${item.stockTone}">${item.stock}</span></td>
                        <td class="sm-td py-3.5 px-4 text-slate-600">${item.reason}</td>`;
                } else {
                    cells = `
                        <td class="py-3.5 px-4">
                            <p class="sm-td text-slate-700">${item.customer}</p>
                            <p class="sm-td-sub text-slate-400">${item.tier}</p>
                        </td>
                        <td class="sm-td py-3.5 px-4">${item.requester}</td>
                        <td class="sm-td py-3.5 px-4">${item.currentLimit}</td>
                        <td class="sm-td-strong py-3.5 px-4 text-blue-700">${item.requestedLimit}</td>
                        <td class="sm-td py-3.5 px-4 text-rose-600">${item.debt}</td>
                        <td class="sm-td py-3.5 px-4 text-slate-600">${item.reason}</td>`;
                }

                return `<tr class="hover:bg-slate-50 transition">${cells}
                    <td class="py-3.5 px-4 text-right">${rowActionMenu(item, activeTab)}</td>
                </tr>`;
            }).join('');
        }

        function updateCounts() {
            Object.keys(QUEUE).forEach(tab => {
                document.getElementById('tabCount-' + tab).textContent = QUEUE[tab].length;
            });
            const total = totalPending();
            document.getElementById('headerQueuePill').textContent = total + ' ករណីរង់ចាំការសម្រេច';
        }

        function switchApprovalTab(name) {
            activeTab = name;
            closeAllFloatingDropdowns();
            ['quote', 'void', 'credit'].forEach(t => {
                document.getElementById('tabBtn-' + t).className = t === name
                    ? 'sm-badge px-5 py-2.5 rounded-xl bg-[#1e3a5f] text-white font-semibold shadow-sm transition'
                    : 'sm-badge px-5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition';
            });
            renderQueue();
        }

        async function decide(tab, id, action) {
            closeAllFloatingDropdowns();
            const item = QUEUE[tab].find(x => x.id === id);

            let reason = '';
            if (action === 'reject') {
                reason = await showReasonPrompt({
                    title: 'បញ្ជាក់ការបដិសេធ',
                    message: `សូមបញ្ចូលមូលហេតុនៃការបដិសេធសំណើ ${id}។ បុគ្គលិកលក់នឹងទទួលបានដំណឹងនេះ។`,
                    placeholder: 'មូលហេតុនៃការបដិសេធ...',
                    confirmText: 'បដិសេធ',
                    danger: true
                });
                if (!reason) return;
            } else {
                const forward = tab === 'quote' && item && item.needsGm;
                const ok = await showCustomConfirm({
                    title: 'បញ្ជាក់ការអនុម័ត',
                    message: forward
                        ? `សម្រង់តម្លៃ ${id} មានទឹកប្រាក់លើសពីដែនសិទ្ធិរបស់លោកអ្នក។ បន្ទាប់ពីអនុម័ត វានឹងត្រូវបញ្ជូនទៅអភិបាលទូទៅដើម្បីអនុម័តបន្ត។ សកម្មភាពនេះនឹងត្រូវកត់ត្រាក្នុងកំណត់ហេតុសវនកម្ម។ តើបន្តមែនទេ?`
                        : `តើលោកអ្នកពិតជាយល់ព្រមអនុម័តសំណើ ${id} មែនទេ? សកម្មភាពនេះនឹងត្រូវកត់ត្រាក្នុងកំណត់ហេតុសវនកម្មដែលមិនអាចកែប្រែបាន។`,
                    confirmText: forward ? 'អនុម័ត និងបញ្ជូនបន្ត' : 'យល់ព្រមអនុម័ត',
                    cancelText: 'បោះបង់'
                });
                if (!ok) return;
            }

            let res;
            if (tab === 'quote') res = action === 'approve' ? smActions.approveQuote(id) : smActions.rejectQuote(id, reason);
            else if (tab === 'void') res = smActions.decideVoid(id, action, reason);
            else res = smActions.decideCredit(id, action, reason);

            if (!res.ok) return showToast(res.error, 'error');
            if (action === 'reject') return showToast(`បានបដិសេធសំណើ ${id} រួចរាល់`, 'warning');
            showToast(tab === 'quote' && res.finalApproved === false
                ? `បានអនុម័តសំណើ ${id} ហើយបានបញ្ជូនទៅអភិបាលទូទៅ`
                : `បានអនុម័តសំណើ ${id} ដោយជោគជ័យ`, 'success');
        }

        /* របារគោលការណ៍អានពីការកំណត់ប្រព័ន្ធ ដូច្នេះលេខនៅទីនេះ និងលេខដែលកូដពិនិត្យ តែងតែដូចគ្នា */
        function renderPolicyBanner() {
            const st = BMS_STORE.settings();
            const tiers = [
                { range: `រហូតដល់ ${fmtUSD(st.quotationLimits.SM)}`, who: 'អ្នកគ្រប់គ្រងផ្នែកលក់អនុម័តបញ្ចប់', mine: true },
                { range: `${fmtUSD(st.quotationLimits.SM)} ដល់ ${fmtUSD(st.quotationLimits.GM)}`, who: 'ត្រូវការអភិបាលទូទៅបន្ត', mine: false },
                { range: `លើសពី ${fmtUSD(st.quotationLimits.GM)}`, who: 'ត្រូវការការចុះហត្ថលេខាថ្នាក់ដឹកនាំបន្ថែម', mine: false }
            ];
            document.getElementById('policyTiers').innerHTML = tiers.map(t => `
                <div class="rounded-xl border ${t.mine ? 'border-amber-400 bg-white' : 'border-amber-200 bg-white/60'} p-3">
                    <p class="sm-td text-slate-700">${t.range}</p>
                    <p class="sm-td-sub ${t.mine ? 'text-amber-800 font-semibold' : 'text-slate-500'} mt-0.5">${t.who}</p>
                    ${t.mine ? '<p class="sm-td-sub text-amber-700 font-semibold mt-1 border-t border-amber-200 pt-1">ដែនសិទ្ធិរបស់លោកអ្នក</p>' : ''}
                </div>`).join('');
            document.getElementById('policyDiscountNote').textContent =
                `ការបញ្ចុះតម្លៃរហូតដល់ ${fmtPercent(st.discountSelfLimit)} បុគ្គលិកលក់អនុវត្តបានដោយផ្ទាល់។ លើសពីនេះត្រូវឆ្លងកាត់ការអនុម័តរបស់លោកអ្នក ហើយរាល់ការសម្រេចត្រូវកត់ត្រាក្នុងកំណត់ហេតុសវនកម្ម។`;
        }

        function refresh() {
            QUEUE = buildQueue();
            renderQueue();
            updateCounts();
        }

        window.onStoreChanged = refresh;

        document.addEventListener('DOMContentLoaded', () => {
            renderPolicyBanner();
            refresh();
        });
    </script>
</body>
</html>
