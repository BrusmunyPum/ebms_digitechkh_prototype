<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ពិនិត្យសម្រង់តម្លៃលម្អិតមុនអនុម័ត</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>
<body id="smPortal" data-role-root=".." data-active="approvals" class="bg-slate-50 font-sans text-slate-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="សម្រង់តម្លៃ"
             data-back="approvals.html"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-6">
            <!-- របារសកម្មភាពទំព័រ — ដកចេញពីក្បាលទំព័រ ដើម្បីរក្សាក្បាលទំព័រឲ្យស្អាត -->
            <div class="w-full flex flex-wrap items-center justify-between gap-2 mb-4 no-print">
                <div class="flex flex-wrap items-center gap-2">
                    <span id="docStatus" class="sm-badge px-2.5 py-0.5 rounded-full border font-semibold flex-shrink-0"></span>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <div id="headerActions" class="flex items-center space-x-2 no-print flex-shrink-0"></div>
                </div>
            </div>

            <div id="pageBody" class="w-full space-y-6"></div>
        </main>
    </div>

    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../../../shared/data/seed.js"></script>
    <script src="../../../shared/scripts/status-meta.js"></script>
    <script src="../../../shared/scripts/store.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        const quoteId = new URLSearchParams(location.search).get('id') || (pendingQuotes()[0] || listQuotes()[0] || {}).id;
        let quote = getQuote(quoteId);

        function renderNotFound() {
            setPortalTitle('រកមិនឃើញឯកសារ');
            document.getElementById('docStatus').classList.add('hidden');
            setPortalSubtitle('លេខឯកសារ ' + quoteId + ' មិនមានក្នុងប្រព័ន្ធទេ');
            document.getElementById('pageBody').innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm py-16 text-center">
                    <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-file-circle-question text-2xl"></i>
                    </div>
                    <h3 class="sm-card-title text-slate-700">រកមិនឃើញសម្រង់តម្លៃនេះទេ</h3>
                    <p class="sm-card-sub text-slate-500 mt-1">សូមត្រឡប់ទៅបញ្ជីសំណើ ដើម្បីជ្រើសរើសឯកសារផ្សេង។</p>
                    <a href="approvals.html" class="sm-badge inline-flex items-center gap-2 mt-4 px-4 py-2.5 rounded-xl bg-[#0f2b5c] text-white font-semibold">
                        <i class="fas fa-arrow-left"></i> ត្រឡប់ទៅបញ្ជីអនុម័ត
                    </a>
                </div>`;
        }

        function renderHeader(totals) {
            const st = statusMeta(quote.status);
            const mine = quote.status === 'PENDING_APPROVAL' && quote.pendingLevel === 'SM';
            const waiting = quote.status === 'PENDING_APPROVAL' && !mine;

            setPortalTitle('សម្រង់តម្លៃ ' + quote.id);
            const statusEl = document.getElementById('docStatus');
            statusEl.textContent = waiting ? `រង់ចាំ ${APPROVAL_LEVEL_LABEL[quote.pendingLevel]}` : st.label;
            statusEl.className = 'sm-badge px-2.5 py-0.5 rounded-full border font-semibold flex-shrink-0 ' + (waiting ? STATUS_TONES.purple : st.tone);

            setPortalSubtitle(`សុពលភាពដល់ ${fmtKhDate(quote.validUntil)} · ស្នើសុំដោយ ${getRep(quote.repId).name}`);

            const actions = document.getElementById('headerActions');
            const printBtn = `
                <button onclick="window.print()" aria-label="បោះពុម្ព" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center transition border border-slate-200/70">
                    <i class="fas fa-print text-sm"></i>
                </button>`;

            if (!mine) {
                const note = waiting ? 'លោកអ្នកបានអនុម័តរួចហើយ · រង់ចាំអភិបាលទូទៅ' : 'សំណើនេះត្រូវបានសម្រេចរួចហើយ';
                actions.innerHTML = printBtn + `<span class="sm-badge px-4 py-2.5 rounded-xl bg-slate-100 text-slate-500 font-medium">${note}</span>`;
                return;
            }

            const needGm = quote.requiredLevels.includes('GM');
            const mainBtn = `<button onclick="processApproval('approve')" class="sm-badge px-5 py-2.5 rounded-xl ${needGm ? 'bg-purple-600 hover:bg-purple-700' : 'bg-[#0f2b5c] hover:bg-[#0a1d3f]'} text-white font-semibold shadow-sm transition inline-flex items-center gap-1.5">
                    <i class="fas ${needGm ? 'fa-paper-plane' : 'fa-check'}"></i><span>${needGm ? 'អនុម័ត ហើយបញ្ជូនទៅអភិបាលទូទៅ' : `យល់ព្រមអនុម័ត ${fmtUSD(totals.grandTotal)}`}</span>
                </button>`;

            actions.innerHTML = printBtn + `
                <button onclick="processApproval('reject')" class="sm-badge px-4 py-2.5 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 font-medium transition inline-flex items-center gap-1.5">
                    <i class="fas fa-xmark"></i><span class="hidden sm:!inline">បដិសេធ</span>
                </button>` + mainBtn;
        }

        function renderBody(totals) {
            const cust = getCustomer(quote.customerId);
            const rep = getRep(quote.repId);
            const oldDebt = customerDebt(cust.id);
            const newDebt = oldDebt + totals.grandTotal;
            const usage = Math.min((newDebt / cust.creditLimit) * 100, 100);
            const overLimit = newDebt > cust.creditLimit;

            const lim = BMS_STORE.settings().quotationLimits;
            const levelCard = (range, who, note, active) => `
                <div class="p-3 rounded-xl border ${active ? 'bg-[#0f2b5c] border-[#0f2b5c] shadow-sm' : 'bg-slate-50 border-slate-200'}">
                    <p class="sm-kpi-sub ${active ? 'text-sky-200' : 'text-slate-500'}">${range}</p>
                    <p class="sm-value ${active ? 'text-white' : 'text-slate-700'} mt-0.5">${who}</p>
                    <p class="sm-kpi-sub ${active ? 'text-sky-200' : 'text-slate-400'} mt-1">${note}</p>
                </div>`;

            document.getElementById('pageBody').innerHTML = `
                ${quote.discountPercent > BMS_STORE.settings().discountSelfLimit ? `
                <div class="bg-amber-50/80 border border-amber-200 rounded-2xl p-4 flex items-start gap-3 sm-print-block">
                    <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center text-lg flex-shrink-0">
                        <i class="fas fa-triangle-exclamation"></i>
                    </div>
                    <div>
                        <h4 class="sm-card-title text-amber-900">មានបញ្ចុះតម្លៃពិសេស</h4>
                        <p class="sm-card-sub text-amber-800 mt-0.5">
                            ${rep.name} បានស្នើសុំបញ្ចុះតម្លៃពិសេស ${fmtPercent(quote.discountPercent)}
                            ដែលហួសពីដែនកម្រិតដែលបុគ្គលិកលក់អនុវត្តបានដោយខ្លួនឯង ${fmtPercent(BMS_STORE.settings().discountSelfLimit)}។
                            ការបញ្ចុះតម្លៃនេះកាត់បន្ថយប្រាក់ចំណេញដុលប្រមាណ ${fmtUSD(totals.discountAmount)}។
                        </p>
                    </div>
                </div>` : ''}

                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm sm-print-block">
                    <h3 class="sm-card-title text-slate-700 mb-3">កម្រិតអនុម័តតាមទឹកប្រាក់</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${levelCard(`ដល់ ${fmtUSD(lim.SM)}`, 'អ្នកគ្រប់គ្រងផ្នែកលក់', 'សិទ្ធិអនុម័តផ្ទាល់', quote.requiredLevels.length === 1)}
                        ${levelCard(`លើសពី ${fmtUSD(lim.SM)} ដល់ ${fmtUSD(lim.GM)}`, 'ប្រធានផ្នែកលក់ រួចអភិបាលទូទៅ', 'ត្រូវបញ្ជូនបន្តបន្ទាប់ពីអនុម័ត', quote.requiredLevels.length === 2)}
                        ${levelCard(`លើសពី ${fmtUSD(lim.GM)}`, 'បន្ថែមការចុះហត្ថលេខារបស់នាយក', 'ចុះហត្ថលេខាតាមច្រកអភិបាលទូទៅ', quote.requiredLevels.length === 3)}
                    </div>
                    <p class="sm-kpi-sub text-slate-500 mt-3">
                        ជំហានអនុម័តសម្រាប់សម្រង់តម្លៃនេះ៖
                        ${quote.requiredLevels.map(l => {
                            const done = quote.approvals.some(a => a.level === l);
                            return `<span class="${done ? 'text-emerald-700 font-semibold' : ''}">${done ? '✓ ' : ''}${APPROVAL_LEVEL_LABEL[l]}</span>`;
                        }).join(' → ')}
                    </p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="space-y-6">
                        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4 sm-print-block">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                <h3 class="sm-card-title text-slate-700">ព័ត៌មានអតិថិជន</h3>
                                <span class="sm-badge px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 font-semibold">${tierLabel(cust.tier)}</span>
                            </div>
                            <div class="space-y-2.5">
                                <div>
                                    <span class="sm-label text-slate-400 block">ឈ្មោះស្ថាប័ន</span>
                                    <span class="sm-value text-slate-700">${cust.name}</span>
                                </div>
                                <div>
                                    <span class="sm-label text-slate-400 block">អ្នកទាក់ទង</span>
                                    <span class="sm-td text-slate-700">${cust.contact} · ${cust.phone}</span>
                                </div>
                                <div class="pt-2 border-t border-slate-100 space-y-1">
                                    <div class="flex justify-between">
                                        <span class="sm-label text-slate-500">ពិដានឥណទាន</span>
                                        <span class="sm-value text-slate-700">${fmtUSD(cust.creditLimit)}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="sm-label text-slate-500">បំណុលចាស់</span>
                                        <span class="sm-value text-slate-700">${fmtUSD(oldDebt)}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="sm-label text-slate-500">សម្រង់តម្លៃនេះ</span>
                                        <span class="sm-value text-blue-700">${fmtUSD(totals.grandTotal)}</span>
                                    </div>
                                    <div class="flex justify-between pt-1 border-t border-slate-100">
                                        <span class="sm-label text-slate-700 font-semibold">សរុបបើអនុម័ត</span>
                                        <span class="sm-value ${overLimit ? 'text-rose-600' : 'text-emerald-700'}">${fmtUSD(newDebt)}</span>
                                    </div>
                                </div>
                                <div class="pt-1">
                                    <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                                        <div class="h-full ${overLimit ? 'bg-rose-500' : usage > 80 ? 'bg-amber-500' : 'bg-emerald-500'} rounded-full" style="width: ${usage}%"></div>
                                    </div>
                                    <p class="sm-kpi-sub ${overLimit ? 'text-rose-600 font-semibold' : 'text-slate-400'} mt-1">
                                        ${overLimit
                                            ? `លើសពិដានឥណទាន ${fmtUSD(newDebt - cust.creditLimit)} — ត្រូវការការលើកលែង`
                                            : `ប្រើប្រាស់ឥណទាន ${fmtPercent(usage, 0)} · នៅសល់ ${fmtUSD(cust.creditLimit - newDebt)}`}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-3 sm-print-block">
                            <h3 class="sm-card-title text-slate-700 border-b border-slate-100 pb-3">បុគ្គលិកដែលបានស្នើសុំ</h3>
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-semibold text-sm flex-shrink-0">${rep.initials}</div>
                                <div class="min-w-0">
                                    <h4 class="sm-value text-slate-700">${rep.name}</h4>
                                    <span class="sm-kpi-sub text-slate-500 block">បុគ្គលិកផ្នែកលក់</span>
                                    <p class="sm-kpi-sub text-slate-400">ស្នើសុំ ${fmtKhDateTime(quote.date)}</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-50 rounded-2xl p-4 border border-dashed border-slate-300 text-center no-print">
                            <button disabled class="sm-badge w-full px-4 py-2.5 rounded-xl bg-slate-200 text-slate-400 font-medium cursor-not-allowed inline-flex items-center justify-center gap-2">
                                <i class="fas fa-file-invoice"></i> បំប្លែងជាវិក្កយបត្រ
                            </button>
                            <p class="sm-kpi-sub text-slate-400 mt-2">អាចប្រើប្រាស់បាន បន្ទាប់ពីសម្រង់តម្លៃត្រូវបានអនុម័ត</p>
                        </div>
                    </div>

                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                                <h3 class="sm-card-title text-slate-700">មុខទំនិញក្នុងសម្រង់តម្លៃ</h3>
                                <span class="sm-card-sub text-slate-500">សរុប ${quote.items.length} មុខ</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                        <tr>
                                            <th class="sm-th py-3 px-4">មុខទំនិញ</th>
                                            <th class="sm-th py-3 px-4 text-center">ចំនួន</th>
                                            <th class="sm-th py-3 px-4 text-right">តម្លៃឯកតា</th>
                                            <th class="sm-th py-3 px-4 text-right">សរុប</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-slate-700">
                                        ${quote.items.map(it => {
                                            const p = getProduct(it.sku);
                                            return `<tr>
                                                <td class="py-3 px-4">
                                                    <p class="sm-td text-slate-700">${p.name}</p>
                                                    <span class="sm-td-sub text-slate-400">${it.sku} · ${CATEGORIES[p.category]}</span>
                                                </td>
                                                <td class="sm-td py-3 px-4 text-center">${it.qty} ${p.unit}</td>
                                                <td class="sm-td py-3 px-4 text-right">${fmtUSD(it.price)}</td>
                                                <td class="sm-td-strong py-3 px-4 text-right">${fmtUSD(it.qty * it.price)}</td>
                                            </tr>`;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm sm-summary">
                            <div class="max-w-sm ml-auto space-y-2">
                                <div class="flex justify-between">
                                    <span class="sm-label text-slate-600">សរុបរងមុខទំនិញ</span>
                                    <span class="sm-value text-slate-700">${fmtUSD(totals.subtotal)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="sm-label text-slate-600">ប្រាក់កក់</span>
                                    <span class="sm-value text-slate-700">${fmtUSD(totals.downPayment)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="sm-label text-amber-700 font-semibold">បញ្ចុះតម្លៃពិសេស ${fmtPercent(totals.discountPercent)}</span>
                                    <span class="sm-value text-amber-700">-${fmtUSD(totals.discountAmount)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="sm-label text-slate-600">អាករលើតម្លៃបន្ថែម 10%</span>
                                    <span class="sm-value text-slate-700">${fmtUSD(totals.vatAmount)}</span>
                                </div>
                                <div class="flex justify-between pt-2 border-t border-slate-200">
                                    <span class="sm-card-title text-slate-700">សរុបត្រូវបង់</span>
                                    <span class="sm-kpi-value text-blue-700">${fmtUSD(totals.grandTotal)}</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-3 no-print">
                            <label class="sm-label block text-slate-700 font-semibold">មតិយោបល់ ឬការណែនាំរបស់អ្នកគ្រប់គ្រង</label>
                            <textarea id="approvalComment" rows="2" placeholder="បញ្ចូលកំណត់ចំណាំនៃការអនុម័ត ឬមូលហេតុនៃការបដិសេធ..."
                                class="sm-td w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-700 focus:outline-none focus:border-[#1e3a5f] transition resize-none"></textarea>
                        </div>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm signature-block">
                            <div class="grid grid-cols-2 gap-6">
                                <div class="text-center">
                                    <p class="sm-label text-slate-600">អ្នកស្នើសុំ</p>
                                    <div class="h-12"></div>
                                    <div class="border-t border-slate-300 pt-1.5">
                                        <p class="sm-value text-slate-700">${rep.name}</p>
                                        <p class="sm-kpi-sub text-slate-400">${fmtKhDate(quote.date)}</p>
                                    </div>
                                </div>
                                <div class="text-center">
                                    <p class="sm-label text-slate-600">អ្នកអនុម័ត</p>
                                    <div class="h-12"></div>
                                    <div class="border-t border-slate-300 pt-1.5">
                                        <p class="sm-value text-slate-700">ហេង វិច្ឆិកា</p>
                                        <p class="sm-kpi-sub text-slate-400">អ្នកគ្រប់គ្រងផ្នែកលក់</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm no-print">
                    <h3 class="sm-card-title text-slate-700 border-b border-slate-100 pb-3 mb-4">ប្រវត្តិឯកសារ</h3>
                    ${trailTimelineHtml(quote.auditTrail)}
                </div>

                <div class="print-footer">
                    DIGITECHKH Co., Ltd. · សម្រង់តម្លៃលេខ ${quote.id} · បោះពុម្ពដោយ ហេង វិច្ឆិកា · ឯកសារនេះបង្កើតចេញពីប្រព័ន្ធដោយស្វ័យប្រវត្តិ
                </div>`;
        }

        async function processApproval(action) {
            const remarks = document.getElementById('approvalComment').value.trim();
            const totals = quoteTotals(quote);
            const needGm = quote.requiredLevels.includes('GM');

            let reason = '';
            if (action === 'reject') {
                reason = remarks || await showReasonPrompt({
                    title: 'បញ្ជាក់ការបដិសេធ',
                    message: `សូមបញ្ចូលមូលហេតុនៃការបដិសេធសម្រង់តម្លៃ ${quote.id}។ បុគ្គលិកលក់នឹងទទួលបានដំណឹងដើម្បីកែសម្រួលឡើងវិញ។`,
                    placeholder: 'មូលហេតុនៃការបដិសេធ...',
                    confirmText: 'បដិសេធ',
                    danger: true
                });
                if (!reason) return;
            } else {
                const ok = await showCustomConfirm({
                    title: 'បញ្ជាក់ការអនុម័ត',
                    message: `តើលោកអ្នកពិតជាយល់ព្រមអនុម័តសម្រង់តម្លៃ ${quote.id} ទឹកប្រាក់ ${fmtUSD(totals.grandTotal)} មែនទេ?`
                        + (needGm ? ' បន្ទាប់ពីអនុម័ត វានឹងត្រូវបញ្ជូនទៅអភិបាលទូទៅ។' : '')
                        + ' សកម្មភាពនេះនឹងត្រូវកត់ត្រាក្នុងកំណត់ហេតុសវនកម្មដែលមិនអាចកែប្រែបាន។',
                    confirmText: needGm ? 'អនុម័ត និងបញ្ជូនបន្ត' : 'យល់ព្រមអនុម័ត',
                    cancelText: 'បោះបង់'
                });
                if (!ok) return;
            }

            const res = action === 'approve' ? smActions.approveQuote(quote.id, remarks) : smActions.rejectQuote(quote.id, reason);
            if (!res.ok) return showToast(res.error, 'error');

            showToast(action === 'reject'
                ? `បានបដិសេធសម្រង់តម្លៃ ${quote.id}`
                : res.finalApproved ? `បានអនុម័តសម្រង់តម្លៃ ${quote.id} ដោយជោគជ័យ` : `បានអនុម័តសម្រង់តម្លៃ ${quote.id} ហើយបានបញ្ជូនទៅអភិបាលទូទៅ`,
                action === 'reject' ? 'warning' : 'success');

            setTimeout(() => { window.location.href = 'approvals.html'; }, 1400);
        }

        function refresh() {
            quote = getQuote(quoteId);
            if (!quote) return renderNotFound();
            const totals = quoteTotals(quote);
            renderHeader(totals);
            renderBody(totals);
        }

        window.onStoreChanged = refresh;

        document.addEventListener('DOMContentLoaded', () => {
            if (!quote) {
                renderNotFound();
                return;
            }
            refresh();
        });
    </script>
</body>
</html>
