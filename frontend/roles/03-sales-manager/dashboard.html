<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ផ្ទាំងគ្រប់គ្រងលក់</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ផ្ទាំងគ្រប់គ្រងមិនផ្ទុកបណ្ណាល័យគំនូសតាងទេ — គំនូសតាងទាំងអស់នៅទំព័ររបាយការណ៍ (ស្តង់ដារឯកសារ 00 ផ្នែក 3.2) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="smPortal" data-role-root="." data-active="dashboard" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ផ្ទាំងគ្រប់គ្រងលក់"
             data-subtitle="អ្វីដែលត្រូវសម្រេចថ្ងៃនេះ សមិទ្ធផលក្រុម និងហានិភ័យឥណទាន"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-6">

                <!-- តំបន់ទី 1 — ចំណុចផ្តោតតែមួយ៖ ចំណូលក្រុមធៀបគោលដៅ
                     បន្ទះងងឹតមួយដាច់ដោយឡែក មិនមែនកាតស្មើគ្នា 3 ព្រោះលេខនេះសំខាន់ជាងគេ -->
                <section class="rounded-2xl bg-[#1e3a5f] text-white overflow-hidden shadow-sm">
                    <div class="px-6 pt-6 pb-5">
                        <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-3">
                            <div class="min-w-0">
                                <p class="sm-eyebrow text-white/50">ចំណូលក្រុម · ខែនេះ</p>
                                <p id="heroRevenue" class="sm-hero-value text-white mt-1.5"></p>
                                <p id="heroTarget" class="sm-card-sub text-white/60 mt-1"></p>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <p id="heroPercent" class="sm-hero-value"></p>
                                <p class="sm-card-sub text-white/60 mt-1">នៃគោលដៅ</p>
                            </div>
                        </div>
                        <div class="sm-rail bg-white/15 mt-5"><span id="heroRail" style="width:0%"></span></div>
                    </div>

                    <!-- តួលេខរងបែងចែកដោយបន្ទាត់ — មិនមែនកាតដាច់ដោយឡែក -->
                    <div id="heroStats" class="grid grid-cols-1 sm:grid-cols-3 border-t border-white/10"></div>
                </section>

                <!-- តំបន់ទី 2 — បញ្ជីការងារបន្ទាន់ (ជួរតឹង មិនមែនកាត) -->
                <section id="urgentStrip" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden"></section>

                <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">

                    <!-- តំបន់ទី 3 — ចំណាត់ថ្នាក់ក្រុម (ទទឹងធំជាង) -->
                    <section class="xl:col-span-3 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                            <div>
                                <p class="sm-eyebrow text-slate-400">ចំណាត់ថ្នាក់ក្រុម · ខែនេះ</p>
                                <p id="leaderboardSub" class="sm-card-sub text-slate-500 mt-1"></p>
                            </div>
                            <a href="reports/reports.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline inline-flex items-center gap-1 flex-shrink-0">
                                របាយការណ៍ពេញលេញ <i class="fas fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                        <div id="leaderboardRow" class="divide-y divide-slate-100 border-t border-slate-100"></div>
                    </section>

                    <!-- តំបន់ទី 4 — ដែនឥណទាន (ជួរតូច) -->
                    <section class="xl:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                            <div>
                                <p class="sm-eyebrow text-slate-400">ហានិភ័យឥណទាន</p>
                                <p class="sm-card-sub text-slate-500 mt-1">ប្រើឥណទានពី 80% ឡើងទៅ</p>
                            </div>
                            <span id="creditCountPill" class="sm-badge font-semibold flex-shrink-0"></span>
                        </div>
                        <div id="creditRow" class="divide-y divide-slate-100 border-t border-slate-100"></div>
                    </section>

                </div>

            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/data/seed.js"></script>
    <script src="../../shared/scripts/status-meta.js"></script>
    <script src="../../shared/scripts/store.js"></script>
    <script src="data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* ផ្ទាំងគ្រប់គ្រងបែប "សកម្មភាពមុនគេ" — គ្មានគំនូសតាង គ្មានតម្រងកាលបរិច្ឆេទ
           លេខទាំងអស់គិតលើខែបច្ចុប្បន្ន (ថ្ងៃទី 1 ដល់ថ្ងៃនេះ)។ */

        function railColor(percent) {
            if (percent >= 100) return '#10b981';
            if (percent >= 80) return '#f59e0b';
            return '#f43f5e';
        }

        function textTone(percent) {
            if (percent >= 100) return 'text-emerald-600';
            if (percent >= 80) return 'text-amber-600';
            return 'text-rose-600';
        }

        /* ===== តំបន់ទី 1 — បន្ទះចំណុចផ្តោត ===== */

        function heroStat(opts) {
            const tag = opts.href ? 'a' : 'div';
            const attrs = opts.href
                ? `href="${opts.href}" class="block px-6 py-4 hover:bg-white/5 transition group"`
                : 'class="px-6 py-4"';
            return `<${tag} ${attrs}>
                <p class="sm-eyebrow text-white/45">${opts.label}</p>
                <p class="sm-value text-white sm-figure mt-1.5 flex items-baseline gap-1.5">
                    <span class="sm-kpi-value ${opts.tone || 'text-white'}">${opts.value}</span>
                    <span class="sm-kpi-unit text-white/50">${opts.unit || ''}</span>
                </p>
                <p class="sm-card-sub ${opts.subTone || 'text-white/55'} mt-0.5">
                    ${opts.sub}${opts.href ? ' <i class="fas fa-arrow-right text-[10px] ml-0.5 opacity-0 group-hover:opacity-100 transition"></i>' : ''}
                </p>
            </${tag}>`;
        }

        function renderHero(m) {
            const pending = totalPending();
            document.getElementById('heroRevenue').textContent = fmtUSD(m.revenue);
            document.getElementById('heroTarget').textContent = `គោលដៅ ${fmtUSD(m.totalTarget)} · នៅខ្វះ ${fmtUSD(Math.max(m.totalTarget - m.revenue, 0))}`;

            const pctEl = document.getElementById('heroPercent');
            pctEl.textContent = fmtPercent(m.quotaPercent, 0);
            pctEl.style.color = railColor(m.quotaPercent);

            const rail = document.getElementById('heroRail');
            rail.style.width = Math.min(m.quotaPercent, 100) + '%';
            rail.style.backgroundColor = railColor(m.quotaPercent);

            document.getElementById('heroStats').innerHTML =
                heroStat({
                    label: 'រង់ចាំការសម្រេចរបស់អ្នក',
                    value: pending, unit: 'សំណើ',
                    tone: pending ? 'text-amber-300' : 'text-white',
                    sub: pending ? 'ពិនិត្យជួរអនុម័ត' : 'ជួរអនុម័តទទេ',
                    subTone: pending ? 'text-amber-200/80' : 'text-emerald-300/80',
                    href: 'approvals/approvals.html'
                }) +
                `<div class="sm:border-l border-white/10">` + heroStat({
                    label: 'បំណុលហួសកាលកំណត់',
                    value: m.overdueList.length, unit: 'វិក្កយបត្រ',
                    tone: m.overdueList.length ? 'text-rose-300' : 'text-white',
                    sub: m.overdueList.length ? `${fmtUSD(m.overdueAmount)} ត្រូវទារ` : 'គ្មានបំណុលហួសកាលកំណត់',
                    subTone: m.overdueList.length ? 'text-rose-200/80' : 'text-emerald-300/80'
                }) + `</div>` +
                `<div class="sm:border-l border-white/10">` + heroStat({
                    label: 'អត្រាបិទការលក់',
                    value: fmtPercent(m.winRate, 0), unit: '',
                    sub: `${m.convertedCount} ក្នុងចំណោម ${m.quoteCount} សម្រង់តម្លៃ`
                }) + `</div>`;
        }

        /* ===== តំបន់ទី 2 — បញ្ជីការងារបន្ទាន់ ===== */

        function discountPill(percent) {
            const tone = percent > 15 ? 'bg-rose-100 text-rose-700'
                : percent > 10 ? 'bg-orange-100 text-orange-700'
                : 'bg-amber-100 text-amber-800';
            return `<span class="sm-badge sm-figure px-2 py-0.5 rounded-md font-semibold flex-shrink-0 ${tone}">−${fmtPercent(percent, 0)}</span>`;
        }

        function urgentRow(a) {
            const rep = a.rep || { name: 'មិនស្គាល់', initials: '—' };
            const cust = a.customer || { name: 'មិនស្គាល់' };
            const stale = a.ageHours >= 24;
            return `
                <div class="sm-worklist-row px-5 py-4 flex flex-wrap items-center gap-x-5 gap-y-3"
                     style="border-left-color:${stale ? '#f43f5e' : '#f59e0b'}">

                    <div class="flex items-center gap-3 min-w-[220px] flex-1">
                        <span class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center font-semibold text-xs flex-shrink-0">${rep.initials || '—'}</span>
                        <span class="min-w-0">
                            <span class="sm-td text-slate-800 block truncate">${cust.name}</span>
                            <span class="sm-td-sub text-slate-500 block truncate">${a.id} · ${rep.name} · ${a.ageHours} ម៉ោងមុន</span>
                        </span>
                    </div>

                    <div class="flex items-center gap-2.5 flex-shrink-0">
                        ${discountPill(a.discountPercent)}
                        <span class="sm-td-sub text-slate-400 line-through sm-figure">${fmtUSD(a.subtotal)}</span>
                        <i class="fas fa-arrow-right text-[9px] text-slate-300"></i>
                        <span class="sm-td-strong text-slate-800 sm-figure">${fmtUSD(a.afterDiscount)}</span>
                        <span class="sm-td-sub text-rose-600 font-semibold sm-figure">−${fmtUSD(a.discountAmount)}</span>
                    </div>

                    ${a.needsGm ? '<span class="sm-badge px-2 py-0.5 rounded-md bg-purple-50 text-purple-700 flex-shrink-0">បន្តទៅអភិបាលទូទៅ</span>' : ''}

                    <div class="flex items-center gap-2 ml-auto flex-shrink-0 no-print">
                        <button onclick="decideFromDashboard('${a.id}', 'approve')"
                            class="sm-badge px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition">
                            អនុម័ត
                        </button>
                        <button onclick="decideFromDashboard('${a.id}', 'reject')"
                            class="sm-badge px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-rose-700 hover:bg-rose-50 font-medium transition">
                            បដិសេធ
                        </button>
                        <a href="approvals/view-approval.html?type=quote&id=${a.id}" aria-label="មើលលម្អិត"
                            class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition">
                            <i class="fas fa-chevron-right text-xs"></i>
                        </a>
                    </div>
                </div>`;
        }

        function renderUrgentStrip() {
            const list = urgentApprovals(4);
            const otherPending = pendingVoids().length + pendingCredits().length;
            const host = document.getElementById('urgentStrip');

            const head = `
                <div class="px-5 pt-5 pb-3 flex flex-wrap items-baseline justify-between gap-2">
                    <div>
                        <p class="sm-eyebrow text-amber-600">ត្រូវសម្រេចថ្ងៃនេះ</p>
                        <p class="sm-card-sub text-slate-500 mt-1">
                            ${list.length ? `សម្រង់តម្លៃ ${list.length} តម្រៀបតាមការបញ្ចុះតម្លៃធំមុន` : 'គ្មានសម្រង់តម្លៃរង់ចាំការអនុម័ត'}${otherPending ? ` · សំណើផ្សេងទៀត ${otherPending}` : ''}
                        </p>
                    </div>
                    <a href="approvals/approvals.html" class="sm-badge font-semibold text-[#1e3a5f] hover:underline inline-flex items-center gap-1 flex-shrink-0">
                        ជួរអនុម័តពេញលេញ <i class="fas fa-arrow-right text-[10px]"></i>
                    </a>
                </div>`;

            if (!list.length) {
                host.innerHTML = head + `
                    <div class="border-t border-slate-100 px-5 py-10 flex flex-col items-center gap-2 text-center">
                        <i class="fas fa-circle-check text-2xl text-emerald-400"></i>
                        <p class="sm-td text-slate-600">ជួរអនុម័តស្អាតហើយ</p>
                        <p class="sm-td-sub text-slate-400">សំណើថ្មីនឹងបង្ហាញនៅទីនេះភ្លាមៗ</p>
                    </div>`;
                return;
            }

            host.innerHTML = head + `<div class="border-t border-slate-100 divide-y divide-slate-100">${list.map(urgentRow).join('')}</div>`;
        }

        async function decideFromDashboard(id, action) {
            const item = urgentApprovals(99).find(a => a.id === id);
            if (!item) return;

            if (action === 'reject') {
                const reason = await showReasonPrompt({
                    title: 'បញ្ជាក់ការបដិសេធ',
                    message: `សូមបញ្ចូលមូលហេតុនៃការបដិសេធសម្រង់តម្លៃ ${id}។ បុគ្គលិកលក់នឹងទទួលបានដំណឹងនេះ។`,
                    placeholder: 'មូលហេតុនៃការបដិសេធ...',
                    confirmText: 'បដិសេធ',
                    danger: true
                });
                if (!reason) return;
                const res = smActions.rejectQuote(id, reason);
                if (!res.ok) return showToast(res.error, 'error');
                return showToast(`បានបដិសេធសម្រង់តម្លៃ ${id} រួចរាល់`, 'warning');
            }

            const ok = await showCustomConfirm({
                title: `អនុម័តការបញ្ចុះតម្លៃ ${fmtPercent(item.discountPercent)}`,
                message: item.needsGm
                    ? `សម្រង់តម្លៃ ${id} សម្រាប់ ${item.customer ? item.customer.name : ''} មានទឹកប្រាក់លើសពីដែនសិទ្ធិរបស់លោកអ្នក។ បន្ទាប់ពីអនុម័ត វានឹងត្រូវបញ្ជូនទៅអភិបាលទូទៅដើម្បីអនុម័តបន្ត។ តើបន្តមែនទេ?`
                    : `តើលោកអ្នកពិតជាអនុម័តការបញ្ចុះតម្លៃ ${fmtPercent(item.discountPercent)} ជូន ${item.customer ? item.customer.name : ''} មែនទេ? ដែនសិទ្ធិរបស់អ្នកគ្រប់គ្រងផ្នែកលក់គឺរហូតដល់ ${fmtUSD(BMS_STORE.settings().quotationLimits.SM)} ក្នុងមួយសម្រង់តម្លៃ។`,
                confirmText: item.needsGm ? 'អនុម័ត និងបញ្ជូនបន្ត' : 'យល់ព្រមអនុម័ត',
                cancelText: 'បោះបង់'
            });
            if (!ok) return;

            const res = smActions.approveQuote(id);
            if (!res.ok) return showToast(res.error, 'error');
            showToast(res.finalApproved === false
                ? `បានអនុម័តសម្រង់តម្លៃ ${id} ហើយបានបញ្ជូនទៅអភិបាលទូទៅ`
                : `បានអនុម័តសម្រង់តម្លៃ ${id} ដោយជោគជ័យ`, 'success');
        }

        /* ===== តំបន់ទី 3 — ចំណាត់ថ្នាក់ក្រុម ===== */

        function trendMark(rep) {
            if (!rep.prevRevenue) return '<span class="sm-td-sub text-slate-400">ខែដំបូង</span>';
            if (rep.trend === 'FLAT') return '<span class="sm-td-sub text-slate-400">ស្មើខែមុន</span>';
            const up = rep.trend === 'UP';
            return `<span class="sm-td-sub ${up ? 'text-emerald-600' : 'text-rose-600'} font-semibold sm-figure">
                        <i class="fas fa-caret-${up ? 'up' : 'down'}"></i> ${fmtPercent(Math.abs(rep.trendPercent), 0)}
                    </span>`;
        }

        function renderLeaderboard() {
            const rows = repLeaderboard();
            const host = document.getElementById('leaderboardRow');
            const totalRevenue = rows.reduce((s, r) => s + r.revenue, 0);
            document.getElementById('leaderboardSub').textContent =
                `បុគ្គលិកលក់ ${rows.length} នាក់ · ចំណូលរួម ${fmtUSD(totalRevenue)}`;

            if (!rows.length) {
                host.innerHTML = '<div class="px-5 py-10 text-center"><p class="sm-td-sub text-slate-400">គ្មានបុគ្គលិកលក់ក្នុងក្រុមទេ</p></div>';
                return;
            }

            host.innerHTML = rows.map(rep => `
                <div class="px-5 py-4 hover:bg-slate-50/70 transition">
                    <div class="flex items-center gap-3">
                        <span class="sm-card-title ${rep.rank === 1 ? 'text-amber-500' : 'text-slate-300'} w-6 flex-shrink-0 sm-figure">${rep.rank}</span>
                        <span class="min-w-0 flex-1">
                            <span class="sm-td text-slate-800 block truncate">${rep.name}</span>
                            <span class="sm-td-sub text-slate-500 block">${rep.invoiceCount} វិក្កយបត្រ · បម្លែង ${fmtPercent(rep.conversion, 0)}</span>
                        </span>
                        <span class="text-right flex-shrink-0">
                            <span class="sm-td-strong text-slate-800 block sm-figure">${fmtUSD(rep.revenue)}</span>
                            ${trendMark(rep)}
                        </span>
                    </div>
                    <div class="flex items-center gap-3 mt-2.5 pl-9">
                        <span class="sm-rail flex-1"><span style="width:${Math.min(rep.quotaPercent, 100)}%;background-color:${railColor(rep.quotaPercent)}"></span></span>
                        <span class="sm-td-sub ${textTone(rep.quotaPercent)} font-semibold w-14 text-right flex-shrink-0 sm-figure">${fmtPercent(rep.quotaPercent, 0)}</span>
                    </div>
                </div>`).join('');
        }

        /* ===== តំបន់ទី 4 — ហានិភ័យឥណទាន ===== */

        function renderCreditWatch() {
            const rows = creditWatchList();
            const host = document.getElementById('creditRow');
            const pill = document.getElementById('creditCountPill');

            if (!rows.length) {
                pill.className = 'sm-badge font-semibold flex-shrink-0 text-emerald-600';
                pill.textContent = 'ធម្មតាទាំងអស់';
                host.innerHTML = `<div class="px-5 py-10 flex flex-col items-center gap-2 text-center">
                    <i class="fas fa-shield-halved text-2xl text-emerald-300"></i>
                    <p class="sm-td-sub text-slate-500">អតិថិជនទាំងអស់នៅក្នុងដែនឥណទានធម្មតា</p>
                </div>`;
                return;
            }

            const exceeded = rows.filter(c => c.percent >= 100).length;
            pill.className = 'sm-badge font-semibold flex-shrink-0 text-rose-600 sm-figure';
            pill.textContent = exceeded ? `លើសដែន ${exceeded} / ${rows.length}` : `${rows.length} អតិថិជន`;

            host.innerHTML = rows.slice(0, 6).map(c => {
                const over = c.percent >= 100;
                return `
                <div class="px-5 py-3.5 hover:bg-slate-50/70 transition">
                    <div class="flex items-baseline justify-between gap-3">
                        <span class="min-w-0">
                            <span class="sm-td text-slate-800 block truncate">${c.name}</span>
                            <span class="sm-td-sub text-slate-500 block truncate">${c.rep ? c.rep.name : 'គ្មានបុគ្គលិកទទួលបន្ទុក'}</span>
                        </span>
                        <span class="sm-td-strong ${over ? 'text-rose-600' : 'text-amber-600'} flex-shrink-0 sm-figure">${fmtPercent(c.percent, 0)}</span>
                    </div>
                    <div class="sm-rail mt-2"><span style="width:${Math.min(c.percent, 100)}%;background-color:${over ? '#f43f5e' : '#f59e0b'}"></span></div>
                    <p class="sm-td-sub text-slate-400 mt-1.5 sm-figure">${fmtUSD(c.used)} លើដែន ${fmtUSD(c.creditLimit)}</p>
                </div>`;
            }).join('') + (rows.length > 6
                ? `<div class="px-5 py-3 text-center"><span class="sm-td-sub text-slate-400">និងអតិថិជនផ្សេងទៀត ${rows.length - 6} នាក់</span></div>`
                : '');
        }

        /* ===== ដំណើរការ ===== */

        function renderDashboard() {
            const metrics = dashboardMetrics(monthRange(0));
            renderHero(metrics);
            renderUrgentStrip();
            renderLeaderboard();
            renderCreditWatch();
            updatePortalBadges();
        }

        window.onStoreChanged = renderDashboard;

        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>
</html>
