<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ផ្ទាំងសេវាកម្មអតិថិជន</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <link rel="shortcut icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* ប្រអប់ស្វែងរកធំ — ធាតុសំខាន់បំផុតនៃតួនាទីនេះ */
        #heroSearchInput {
            height: 56px;
            border: 2px solid #0ea5e9;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.18);
        }
        #heroSearchInput:focus {
            box-shadow: 0 4px 24px rgba(14, 165, 233, 0.32);
        }

        /* នាឡិកាកាលកំណត់ឆ្លើយតប — លោតដើម្បីបង្ហាញភាពបន្ទាន់ */
        @keyframes csPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        .cs-sla-risk, .cs-sla-breach { animation: csPulse 1.8s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) {
            .cs-sla-risk, .cs-sla-breach { animation: none; }
        }

        /* តួលេខនាឡិកា — ទទឹងថេរ ដើម្បីកុំឲ្យរំកិលពេលរាប់ថយក្រោយ */
        .cs-figure { font-variant-numeric: tabular-nums; }
    </style>
</head>

<body id="csPortal" data-active="dashboard" class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- របារចំហៀង -->
    <div id="sidebarHost"></div>

    <!-- ផ្ទៃមាតិកាចម្បង -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">

        <!-- ក្បាលទំព័រ -->
        <div id="headerHost" data-title="ផ្ទាំងសេវាកម្មអតិថិជន"
             data-subtitle="ស្វែងរកវិក្កយបត្រ ឆ្លើយតបសំណើ និងតាមដានកាលកំណត់ឆ្លើយតប"></div>

        <!-- មាតិកាខាងក្នុង -->
        <main class="p-4 sm:p-6 space-y-6 flex-1 w-full">

            <!-- ប្រអប់ស្វែងរកធំ -->
            <section class="w-full">
                <div class="relative">
                    <i class="fas fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-sky-500 text-base pointer-events-none"></i>
                    <input type="text" id="heroSearchInput" autocomplete="off"
                        oninput="onHeroInput()" onkeydown="onHeroKey(event)" onfocus="onHeroInput()"
                        placeholder="ស្វែងរកលេខវិក្កយបត្រ លេខទូរស័ព្ទ ឬឈ្មោះអតិថិជន..."
                        class="w-full bg-white text-slate-800 placeholder-slate-400 rounded-xl pl-14 pr-32 text-base font-medium outline-none transition">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2 pointer-events-none">
                        <kbd class="hidden sm:!inline-flex items-center px-2 py-1 rounded-lg bg-slate-100 border border-slate-200 text-[11px] font-semibold text-slate-500 cs-figure">/</kbd>
                        <span class="hidden md:!inline text-[11px] text-slate-400">ដើម្បីស្វែងរក</span>
                    </div>

                    <!-- បញ្ជីលទ្ធផលរហ័ស -->
                    <div id="heroResults" class="hidden absolute left-0 right-0 top-[62px] z-40 bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 max-h-[420px] overflow-y-auto"></div>
                </div>
            </section>

            <!-- កាតសង្ខេបស្ថានភាពការងារ -->
            <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-xs text-slate-500 font-medium">សំណើមិនទាន់បិទ</p>
                        <h3 class="text-2xl font-semibold text-slate-800 mt-1 cs-figure" id="kpiOpen">0</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5" id="kpiOpenSub">រង់ចាំឆ្លើយ 0</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl flex-shrink-0">
                        <i class="fas fa-inbox"></i>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-xs text-slate-500 font-medium">ហួសកាលកំណត់ឆ្លើយតប</p>
                        <h3 class="text-2xl font-semibold mt-1 cs-figure" id="kpiBreach">0</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5" id="kpiBreachSub">ជិតដល់កាលកំណត់ 0</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl flex-shrink-0">
                        <i class="fas fa-stopwatch"></i>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-xs text-slate-500 font-medium">កញ្ចប់កំពុងដឹកជញ្ជូន</p>
                        <h3 class="text-2xl font-semibold text-slate-800 mt-1 cs-figure" id="kpiTransit">0</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5" id="kpiTransitSub">កំពុងរៀបចំ 0</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl flex-shrink-0">
                        <i class="fas fa-truck-fast"></i>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-xs text-slate-500 font-medium">បានដោះស្រាយថ្ងៃនេះ</p>
                        <h3 class="text-2xl font-semibold text-emerald-600 mt-1 cs-figure" id="kpiResolved">0</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5" id="kpiResolvedSub">ឆ្លើយតបជាមធ្យម 0 នាទី</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl flex-shrink-0">
                        <i class="fas fa-circle-check"></i>
                    </div>
                </div>
            </section>

            <!-- ផ្នែក ក — បញ្ជីសំណើរង់ចាំដោះស្រាយ -->
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-5 border-b border-slate-200 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div id="ticketTabs" class="flex items-center gap-2 overflow-x-auto scrollbar-hide"></div>
                    <div class="flex items-center gap-3">
                        <div class="relative flex-1 lg:w-64">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="searchTicket" oninput="renderTickets()" placeholder="ត្រងក្នុងបញ្ជីសំណើ..."
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-3 py-2 text-xs placeholder-slate-400 focus:outline-none focus:border-sky-500">
                        </div>
                        <a href="create-note.html" class="px-4 py-2 rounded-xl bg-primary hover:bg-primary-dark text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-sm whitespace-nowrap">
                            <i class="fas fa-plus"></i> <span class="hidden sm:!inline">បង្កើតសំណើថ្មី</span>
                        </a>
                    </div>
                </div>

                <div id="ticketsContainer" class="p-5 space-y-3"></div>
            </section>

            <!-- ផ្នែក ខ — ការដឹកជញ្ជូនមានបញ្ហា -->
            <section id="deliveryAlertSection"></section>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        let currentTicketFilter = 'all';

        /* ===== ប្រអប់ស្វែងរកធំ ===== */

        function onHeroInput() {
            const q = (document.getElementById('heroSearchInput').value || '').trim();
            const box = document.getElementById('heroResults');
            if (q.length < 2) {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            const res = csSearch(q, 5);
            if (res.total === 0) {
                box.innerHTML = `
                    <div class="px-4 py-8 text-center text-slate-400">
                        <i class="fas fa-file-circle-question text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs">គ្មានលទ្ធផល — សូមពិនិត្យម្តងទៀត</p>
                    </div>`;
                box.classList.remove('hidden');
                return;
            }

            let html = '';

            if (res.orders.length) {
                html += `<p class="px-3 pt-2 pb-1.5 text-[11px] font-semibold text-slate-400">វិក្កយបត្រ</p>`;
                html += res.orders.map(o => {
                    const st = CS_DELIVERY_STATUS[o.deliveryStatus] || CS_DELIVERY_STATUS.preparing;
                    return `
                    <a href="orders-lookup.html?query=${encodeURIComponent(o.invoiceId)}"
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 transition">
                        <span class="w-9 h-9 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-file-invoice text-xs"></i>
                        </span>
                        <span class="min-w-0 flex-1">
                            <span class="flex items-center gap-2">
                                <span class="text-xs font-semibold text-slate-700 cs-figure">${o.invoiceId}</span>
                                <span class="px-2 py-0.5 rounded-full bg-${st.tone}-50 text-${st.tone}-700 border border-${st.tone}-200 text-[10px] font-semibold">${st.label}</span>
                            </span>
                            <span class="block text-[11px] text-slate-500 truncate">${o.customerName} · ${o.date}</span>
                        </span>
                        <span class="text-xs font-semibold text-slate-600 cs-figure flex-shrink-0">${csMoney(o.grandTotal)}</span>
                    </a>`;
                }).join('');
            }

            if (res.customers.length) {
                if (res.orders.length) html += `<div class="my-1.5 border-t border-slate-100"></div>`;
                html += `<p class="px-3 pt-1 pb-1.5 text-[11px] font-semibold text-slate-400">អតិថិជន</p>`;
                html += res.customers.map(c => `
                    <a href="orders-lookup.html?query=${encodeURIComponent(c.phone)}"
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 transition">
                        <span class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-user text-xs"></i>
                        </span>
                        <span class="min-w-0 flex-1">
                            <span class="block text-xs font-semibold text-slate-700 truncate">${c.name}</span>
                            <span class="block text-[11px] text-slate-500 cs-figure">${c.phone} · បញ្ជាទិញចុងក្រោយ ${c.lastOrder}</span>
                        </span>
                        <span class="text-[11px] text-slate-400 flex-shrink-0 cs-figure">${c.totalOrders} ដង</span>
                    </a>`).join('');
            }

            html += `
                <div class="mt-1.5 pt-1.5 border-t border-slate-100">
                    <a href="orders-lookup.html?query=${encodeURIComponent(q)}"
                       class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-xs font-semibold text-sky-700 hover:bg-sky-50 transition">
                        មើលលទ្ធផលទាំងអស់ (${res.total}) <i class="fas fa-arrow-right text-[10px]"></i>
                    </a>
                </div>`;

            box.innerHTML = html;
            box.classList.remove('hidden');
        }

        function onHeroKey(e) {
            if (e.key === 'Enter') {
                const q = (document.getElementById('heroSearchInput').value || '').trim();
                if (q) window.location.href = `orders-lookup.html?query=${encodeURIComponent(q)}`;
            } else if (e.key === 'Escape') {
                document.getElementById('heroResults').classList.add('hidden');
                e.target.blur();
            }
        }

        /* ===== កាតសង្ខេប ===== */

        function renderKpis() {
            const t = csTicketCounts();
            const d = csDeliveryCounts();

            document.getElementById('kpiOpen').textContent = t.pending + t.in_progress;
            document.getElementById('kpiOpenSub').textContent = `រង់ចាំឆ្លើយ ${t.pending} · កំពុងដោះស្រាយ ${t.in_progress}`;

            const breach = document.getElementById('kpiBreach');
            breach.textContent = t.breached;
            breach.className = `text-2xl font-semibold mt-1 cs-figure ${t.breached > 0 ? 'text-rose-600' : 'text-slate-800'}`;
            document.getElementById('kpiBreachSub').textContent = `ជិតដល់កាលកំណត់ ${t.atRisk}`;

            document.getElementById('kpiTransit').textContent = d.out;
            document.getElementById('kpiTransitSub').textContent = `កំពុងរៀបចំ ${d.preparing} · មានបញ្ហា ${d.failed}`;

            // គណនាពីកំណត់ត្រាពិត មិនមែនលេខសន្មត
            const today = csFmtDate(new Date().toISOString());
            const closed = (getCustomerSupportData().tickets || [])
                .filter(x => x.status === 'resolved' && x.resolvedAt && csFmtDate(x.resolvedAt) === today);
            document.getElementById('kpiResolved').textContent = closed.length;

            const avg = closed.length
                ? Math.round(closed.reduce((s, x) =>
                    s + (new Date(x.resolvedAt).getTime() - new Date(x.openedAt).getTime()) / 60000, 0) / closed.length)
                : 0;
            document.getElementById('kpiResolvedSub').textContent = closed.length
                ? `ដោះស្រាយជាមធ្យម ${avg} នាទី`
                : 'មិនទាន់មានសំណើបិទថ្ងៃនេះ';
        }

        /* ===== បញ្ជីសំណើ ===== */

        function renderTabs() {
            const c = csTicketCounts();
            const tabs = [
                { id: 'all', label: 'ទាំងអស់', count: c.all },
                { id: 'pending', label: 'រង់ចាំឆ្លើយ', count: c.pending },
                { id: 'in_progress', label: 'កំពុងដោះស្រាយ', count: c.in_progress },
                { id: 'resolved', label: 'បានដោះស្រាយ', count: c.resolved }
            ];
            document.getElementById('ticketTabs').innerHTML = tabs.map(t => {
                const on = t.id === currentTicketFilter;
                return `<button onclick="filterTicketStatus('${t.id}')" type="button"
                    class="px-3.5 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap flex-shrink-0 ${
                        on ? 'bg-primary text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    ${t.label} <span class="cs-figure ${on ? 'text-sky-200' : 'text-slate-400'}">(${t.count})</span>
                </button>`;
            }).join('');
        }

        function filterTicketStatus(status) {
            currentTicketFilter = status;
            renderTabs();
            renderTickets();
        }

        function slaBadge(sla) {
            if (sla.level === 'done') {
                return `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500 text-[11px] font-semibold">${sla.label}</span>`;
            }
            const icon = sla.level === 'breach' ? 'fa-triangle-exclamation' : 'fa-stopwatch';
            const text = sla.level === 'breach' ? csClock(-sla.remaining) : csClock(sla.remaining);
            const anim = sla.level === 'ok' ? '' : ` cs-sla-${sla.level}`;
            return `<span aria-label="${sla.label}"
                class="px-2.5 py-1 rounded-lg bg-${sla.tone}-50 text-${sla.tone}-700 border border-${sla.tone}-200 text-[11px] font-semibold inline-flex items-center gap-1.5${anim}">
                <i class="fas ${icon} text-[10px]"></i><span class="cs-figure">${text}</span>
            </span>`;
        }

        function renderTickets() {
            const search = (document.getElementById('searchTicket')?.value || '').trim().toLowerCase();
            const container = document.getElementById('ticketsContainer');
            if (!container) return;

            let list = csTickets(currentTicketFilter);
            if (search) {
                list = list.filter(t =>
                    t.id.toLowerCase().includes(search) ||
                    t.customerName.toLowerCase().includes(search) ||
                    t.phone.replace(/\s/g, '').includes(search.replace(/\s/g, '')) ||
                    t.subject.toLowerCase().includes(search));
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fas fa-inbox text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm">គ្មានសំណើតាមលក្ខខណ្ឌនេះឡើយ</p>
                    </div>`;
                return;
            }

            container.innerHTML = list.map(t => {
                const sla = csSla(t);
                const cat = CS_CATEGORY[t.category] || CS_CATEGORY.general;
                const st = CS_TICKET_STATUS[t.status] || CS_TICKET_STATUS.pending;
                const pr = CS_PRIORITY[t.priority] || CS_PRIORITY.normal;
                const edge = sla.level === 'breach' ? 'border-l-4 border-l-rose-400'
                    : (sla.level === 'risk' ? 'border-l-4 border-l-amber-400' : 'border-l-4 border-l-transparent');

                return `
                    <div class="p-4 bg-white rounded-2xl border border-slate-200 ${edge} hover:border-slate-300 hover:shadow-sm transition">
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                            <div class="min-w-0 flex-1">
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="text-xs font-semibold text-slate-700 cs-figure">${t.id}</span>
                                    <span class="px-2 py-0.5 rounded-full bg-${cat.tone}-50 text-${cat.tone}-700 border border-${cat.tone}-200 text-[10px] font-semibold">
                                        <i class="fas ${cat.icon} mr-1"></i>${cat.label}
                                    </span>
                                    <span class="px-2 py-0.5 rounded-full bg-${pr.tone}-100 text-${pr.tone}-700 text-[10px] font-semibold">${pr.label}</span>
                                    ${slaBadge(sla)}
                                </div>
                                <p class="text-sm font-medium text-slate-700 mt-1.5">${t.subject}</p>
                                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-2 text-[11px] text-slate-500">
                                    <span><i class="fas fa-user mr-1 text-slate-400"></i>${t.customerName}</span>
                                    <a href="tel:${t.phone.replace(/\s/g, '')}" class="text-sky-700 hover:underline cs-figure"><i class="fas fa-phone mr-1 text-slate-400"></i>${t.phone}</a>
                                    ${t.relatedInvoice ? `<a href="orders-lookup.html?query=${encodeURIComponent(t.relatedInvoice)}" class="text-sky-700 hover:underline cs-figure"><i class="fas fa-receipt mr-1 text-slate-400"></i>${t.relatedInvoice}</a>` : ''}
                                    <span><i class="fas fa-comment-dots mr-1 text-slate-400"></i>${CS_CHANNEL[t.channel] || ''}</span>
                                    <span><i class="fas fa-clock mr-1 text-slate-400"></i>${csRelative(t.openedAt)}</span>
                                    <span><i class="fas fa-headset mr-1 text-slate-400"></i>${t.agent || 'មិនទាន់ចាត់តាំង'}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0 self-end sm:self-start">
                                <span class="px-2.5 py-1 rounded-full bg-${st.tone}-50 text-${st.tone}-700 border border-${st.tone}-200 text-[11px] font-semibold whitespace-nowrap">
                                    <i class="fas ${st.icon} mr-1"></i>${st.label}
                                </span>
                                <a href="view-ticket.html?id=${encodeURIComponent(t.id)}"
                                   class="px-3.5 py-2 rounded-xl bg-primary hover:bg-primary-dark text-white text-xs font-semibold transition shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                                    មើល <i class="fas fa-arrow-right text-[10px]"></i>
                                </a>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        /* ===== ផ្នែក ខ — ការដឹកជញ្ជូនមានបញ្ហា ===== */

        function renderDeliveryAlerts() {
            const host = document.getElementById('deliveryAlertSection');
            const list = csProblemDeliveries(5);
            const all = csProblemDeliveries();

            if (list.length === 0) {
                host.innerHTML = `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl px-5 py-4 flex items-center gap-3">
                        <span class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-circle-check"></i>
                        </span>
                        <p class="text-xs font-medium text-emerald-800">គ្មានបញ្ហាការដឹកជញ្ជូនក្នុងរយៈពេល 48 ម៉ោងចុងក្រោយ</p>
                    </div>`;
                return;
            }

            host.innerHTML = `
                <div class="bg-rose-50/60 border border-rose-200 border-l-4 border-l-rose-500 rounded-2xl p-5 space-y-3">
                    <div class="flex items-center justify-between gap-3">
                        <h3 class="text-sm font-semibold text-rose-900 flex items-center gap-2">
                            <i class="fas fa-truck-ramp-box text-rose-600"></i>
                            ការដឹកជញ្ជូនមានបញ្ហា
                            <span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 text-[11px] font-semibold cs-figure">${all.length}</span>
                        </h3>
                        <a href="delivery-status.html?status=failed" class="text-xs font-semibold text-rose-700 hover:text-rose-900 whitespace-nowrap">
                            មើលទាំងអស់ <i class="fas fa-arrow-right text-[10px]"></i>
                        </a>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                        ${list.map(d => `
                            <div class="bg-white rounded-xl border border-rose-100 p-3.5">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="text-xs font-semibold text-slate-700 cs-figure">${d.trackingCode}</span>
                                    <a href="orders-lookup.html?query=${encodeURIComponent(d.invoiceId)}" class="text-[11px] font-semibold text-sky-700 hover:underline cs-figure">${d.invoiceId}</a>
                                </div>
                                <p class="text-xs font-medium text-slate-700 mt-1.5">${d.customerName}</p>
                                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1.5 text-[11px] text-slate-500">
                                    <span><i class="fas fa-location-dot mr-1 text-slate-400"></i>${d.district}, ${d.province}</span>
                                    <span><i class="fas fa-id-badge mr-1 text-slate-400"></i>${d.driverName}</span>
                                    <span><i class="fas fa-clock mr-1 text-slate-400"></i>${csRelative(d.lastUpdated)}</span>
                                </div>
                                <p class="mt-2 px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-800 text-[11px] font-medium">
                                    <i class="fas fa-circle-exclamation mr-1"></i>${d.failureReason}
                                    ${d.rescheduledDate ? ` · គ្រោងដឹកវិញ ${d.rescheduledDate}` : ''}
                                </p>
                            </div>`).join('')}
                    </div>
                </div>`;
        }

        /* ===== ដំណើរការទំព័រ ===== */

        function render() {
            renderKpis();
            renderTabs();
            renderTickets();
            renderDeliveryAlerts();
        }

        // បិទបញ្ជីលទ្ធផលរហ័ស ពេលចុចនៅខាងក្រៅ
        document.addEventListener('click', (e) => {
            const box = document.getElementById('heroResults');
            const input = document.getElementById('heroSearchInput');
            if (!box || box.classList.contains('hidden')) return;
            if (!box.contains(e.target) && e.target !== input) box.classList.add('hidden');
        });

        // ផ្លូវកាត់គ្រាប់ចុច «/» ដើម្បីចូលទៅប្រអប់ស្វែងរក
        document.addEventListener('keydown', (e) => {
            const typing = ['INPUT', 'TEXTAREA'].includes((e.target.tagName || '').toUpperCase());
            if (e.key === '/' && !typing) {
                e.preventDefault();
                document.getElementById('heroSearchInput').focus();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                document.getElementById('heroSearchInput').focus();
            }
        });

        // នាឡិកាកាលកំណត់ឆ្លើយតបត្រូវរាប់ថយក្រោយជាបន្តបន្ទាប់
        setInterval(() => {
            renderKpis();
            renderTabs();
            renderTickets();
        }, 60000);

        // ធ្វើបច្ចុប្បន្នភាពពេលផ្ទាំងផ្សេងកែទិន្នន័យ
        window.onStoreChanged = render;

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>

</html>
