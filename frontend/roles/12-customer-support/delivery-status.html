<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - តាមដានស្ថានភាពដឹកជញ្ជូន</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <link rel="shortcut icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>

<body id="csPortal" data-active="delivery-status" class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- របារចំហៀង -->
    <div id="sidebarHost"></div>

    <!-- ផ្ទៃមាតិកាចម្បង -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">

        <!-- ក្បាលទំព័រ -->
        <div id="headerHost" data-title="តាមដានស្ថានភាពដឹកជញ្ជូនជាក់ស្តែង"
             data-subtitle="មើលដំណាក់កាលធ្វើដំណើររបស់កញ្ចប់ និងព័ត៌មានទំនាក់ទំនងអ្នកដឹក"></div>

        <!-- មាតិកាខាងក្នុង -->
        <main class="p-4 sm:p-6 space-y-6 flex-1">
            <!-- របារសកម្មភាពទំព័រ — ដកចេញពីក្បាលទំព័រ ដើម្បីរក្សាក្បាលទំព័រឲ្យស្អាត -->
            <div class="w-full flex flex-wrap items-center justify-end gap-2 no-print">
                <div class="flex flex-wrap items-center gap-2">
                    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-sky-50 border border-sky-200 text-sky-800 text-xs font-semibold">
                        <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></span>
                        <span>ប្រព័ន្ធតាមដានអ្នកដឹក: សកម្ម</span>
                    </div>
                </div>
            </div>


            <!-- កាតសង្ខេប -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 font-medium">កញ្ចប់កំពុងធ្វើដំណើរលើផ្លូវ</p>
                        <h3 class="text-2xl font-bold text-sky-600 mt-1" id="inTransitCount">2</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">ភ្នំពេញ និងខេត្ត</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl">
                        <i class="fas fa-truck-moving"></i>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 font-medium">បានប្រគល់ជូនជោគជ័យ</p>
                        <h3 class="text-2xl font-bold text-emerald-600 mt-1" id="deliveredCount">1</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">ក្នុងរយៈពេល 24 ម៉ោងចុងក្រោយ</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                        <i class="fas fa-house-circle-check"></i>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 font-medium">អ្នកដឹកជញ្ជូនកំពុងបំពេញការងារ</p>
                        <h3 class="text-2xl font-bold text-indigo-600 mt-1">3 នាក់</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">រថយន្ត 2 + ម៉ូតូ 1</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                        <i class="fas fa-motorcycle"></i>
                    </div>
                </div>
            </div>

            <!-- បញ្ជីកញ្ចប់ដឹកជញ្ជូន (Tracking Cards with Stepper) -->
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-route text-sky-600"></i>
                        <span>ដំណើរការដឹកជញ្ជូនជាក់ស្តែងតាមកញ្ចប់នីមួយៗ</span>
                    </h3>
                </div>

                <div id="deliveriesContainer" class="space-y-4">
                    <!-- Dynamic Delivery Stepper Cards -->
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        function updateDeliveryCounts() {
            const data = getCustomerSupportData();
            const inTransit = data.deliveries.filter(d => d.currentStage < 4).length;
            const delivered = data.deliveries.filter(d => d.currentStage === 4).length;

            document.getElementById('inTransitCount').textContent = inTransit;
            document.getElementById('deliveredCount').textContent = delivered;
        }

        function renderDeliveries() {
            const data = getCustomerSupportData();
            const container = document.getElementById('deliveriesContainer');
            if (!container) return;

            container.innerHTML = data.deliveries.map(del => {
                const stages = [
                    { num: 1, label: 'បានវេចខ្ចប់' },
                    { num: 2, label: 'ចេញពីឃ្លាំង' },
                    { num: 3, label: 'កំពុងធ្វើដំណើរ' },
                    { num: 4, label: 'បានប្រគល់ជូន' }
                ];

                const stepperHtml = stages.map((s, idx) => {
                    const isDone = del.currentStage >= s.num;
                    const isCurrent = del.currentStage === s.num;
                    return `
                        <div class="flex-1 flex flex-col items-center relative ${idx < stages.length - 1 ? 'after:content-[\'\'] after:absolute after:top-4 after:left-1/2 after:w-full after:h-0.5 ' + (del.currentStage > s.num ? 'after:bg-emerald-500' : 'after:bg-slate-200') : ''}">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs z-10 transition shadow-sm ${
                                isDone ? (isCurrent ? 'bg-sky-600 text-white ring-4 ring-sky-100' : 'bg-emerald-500 text-white') : 'bg-slate-100 text-slate-400 border border-slate-200'
                            }">
                                ${isDone && !isCurrent ? '<i class="fas fa-check"></i>' : s.num}
                            </div>
                            <span class="text-[11px] font-semibold mt-2 text-center ${isCurrent ? 'text-sky-700 font-bold' : (isDone ? 'text-slate-700' : 'text-slate-400')}">
                                ${s.label}
                            </span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-6 hover:border-slate-300 transition">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl ${del.currentStage === 4 ? 'bg-emerald-50 text-emerald-600' : 'bg-sky-50 text-sky-600'} flex items-center justify-center font-bold text-lg">
                                    <i class="fas ${del.currentStage === 4 ? 'fa-box-check' : 'fa-truck-fast'}"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="text-base font-bold text-slate-800">${del.trackingCode}</h3>
                                        <span class="font-mono text-xs text-sky-700 font-semibold">(${del.invoiceId})</span>
                                        ${del.currentStage === 4 ? 
                                            '<span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold">ជោគជ័យ</span>' : 
                                            '<span class="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-700 text-xs font-semibold animate-pulse">កំពុងដឹក</span>'}
                                    </div>
                                    <p class="text-xs text-slate-500 mt-0.5">
                                        <i class="fas fa-user mr-1 text-slate-400"></i> ${del.customerName} (${del.phone}) &bull; <i class="fas fa-location-dot ml-1 mr-1 text-slate-400"></i> ${del.destination}
                                    </p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 self-end sm:self-center">
                                <a href="tel:${del.driverPhone}" class="px-3.5 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
                                    <i class="fas fa-phone"></i> ខលអ្នកដឹក
                                </a>
                                ${del.currentStage < 4 ? `
                                    <button onclick="advanceDeliveryStage('${del.trackingCode}')" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                                        <i class="fas fa-forward-step"></i> បន្ទាប់
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Stepper Progress Bar -->
                        <div class="py-2 px-4 bg-slate-50/60 rounded-2xl border border-slate-100">
                            <div class="flex items-center justify-between w-full">
                                ${stepperHtml}
                            </div>
                        </div>

                        <!-- Driver Info and Last Updates -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-700 flex items-center justify-center font-bold text-sm">
                                    <i class="fas fa-id-badge"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-slate-800">${del.driverName} (${del.driverPhone})</p>
                                    <p class="text-slate-500 mt-0.5"><i class="fas fa-truck-pickup mr-1 text-slate-400"></i> ${del.vehicle}</p>
                                </div>
                            </div>

                            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center justify-between">
                                <div>
                                    <p class="text-slate-500 font-medium">បច្ចុប្បន្នភាពចុងក្រោយ:</p>
                                    <p class="font-semibold text-slate-800 mt-0.5">${del.lastUpdated}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-slate-500 font-medium">ម៉ោងរំពឹងមកដល់:</p>
                                    <p class="font-bold text-emerald-700 mt-0.5">${del.estimatedArrival}</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function advanceDeliveryStage(trackingCode) {
            const data = getCustomerSupportData();
            const del = data.deliveries.find(d => d.trackingCode === trackingCode);
            if (del && del.currentStage < 4) {
                del.currentStage += 1;
                if (del.currentStage === 4) {
                    del.estimatedArrival = 'បានប្រគល់រួចរាល់';
                    del.lastUpdated = 'ទើបតែប្រគល់ជូនអតិថិជន';
                } else if (del.currentStage === 3) {
                    del.lastUpdated = 'កំពុងធ្វើដំណើរជិតដល់ទីតាំងអតិថិជន';
                }
                saveCustomerSupportData(data);
                showToast(`បានកែសម្រួលដំណាក់កាលកញ្ចប់ ${trackingCode} ទៅជា «${del.stageLabels[del.currentStage - 1]}»`, 'success');
                updateDeliveryCounts();
                renderDeliveries();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDeliveryCounts();
            renderDeliveries();
        });
    </script>
</body>

</html>
