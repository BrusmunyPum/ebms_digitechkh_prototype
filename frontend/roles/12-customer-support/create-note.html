<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បង្កើតកំណត់ហេតុបម្រើអតិថិជន — eBMS v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0284c7',
                        'primary-dark': '#0369a1'
                    },
                    fontFamily: {
                        sans: ['"Kantumruy Pro"', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased" data-portal="csPortal" data-role-root="./" data-active="dashboard">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebarHost"></div>

        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Header (72px aligned) -->
            <header class="bg-white px-6 h-[72px] flex justify-between items-center border-b border-slate-200/80 flex-shrink-0 z-10 shadow-xs">
                <div class="flex items-center gap-3">
                    <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center transition border border-slate-200/70" title="ត្រឡប់ក្រោយ">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </a>
                    <div>
                        <h2 class="text-xl font-semibold text-slate-800 leading-tight">បង្កើតកំណត់ហេតុសេវាកម្ម (Support Ticket)</h2>
                        <p class="text-xs font-normal text-slate-500 mt-0.5">កត់ត្រាសំណួរ បណ្តឹង ឬសំណើជំនួយពីអតិថិជន</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="history.back()" class="h-10 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-medium transition cursor-pointer">
                        បោះបង់
                    </button>
                    <button type="button" onclick="submitSupportNote()" class="h-10 px-5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-medium flex items-center gap-2 shadow-sm transition cursor-pointer">
                        <i class="fas fa-paper-plane text-xs"></i>
                        <span>រក្សាទុក និងបញ្ជូនសំណើ</span>
                    </button>
                </div>
            </header>

            <!-- Main Content Form -->
            <main class="flex-1 overflow-y-auto p-6">
                <form id="noteForm" onsubmit="event.preventDefault(); submitSupportNote();" class="max-w-4xl space-y-6">
                    <!-- Customer & Order Section -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
                        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                            <i class="fas fa-user-headset text-sky-600"></i>
                            <span>ព័ត៌មានអតិថិជន & វិក្កយបត្រពាក់ព័ន្ធ</span>
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">ឈ្មោះអតិថិជន <span class="text-rose-500">*</span></label>
                                <input type="text" id="ticketCustomer" required placeholder="ឧ. អ៊ុច វ៉ាន់ដា" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">លេខទូរស័ព្ទ <span class="text-rose-500">*</span></label>
                                <input type="text" id="ticketPhone" required placeholder="ឧ. 012 345 678" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500 font-mono">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">លេខវិក្កយបត្រ (បើមាន)</label>
                                <input type="text" id="ticketInvoice" placeholder="ឧ. INV-2026-0891" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500 font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">ប្រភពទំនាក់ទំនង</label>
                                <select id="ticketChannel" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500">
                                    <option value="telegram">តេឡេក្រាម (Telegram)</option>
                                    <option value="call">ទូរស័ព្ទផ្ទាល់ (Hotline)</option>
                                    <option value="facebook">ទំព័រហ្វេសប៊ុក (Facebook Page)</option>
                                    <option value="walk_in">មកជួបផ្ទាល់ (Walk-in)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">កម្រិតអាទិភាព</label>
                                <select id="ticketPriority" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500">
                                    <option value="normal">ធម្មតា (SLA 60 នាទី)</option>
                                    <option value="urgent" selected>បន្ទាន់ (SLA 30 នាទី)</option>
                                    <option value="critical">បន្ទាន់ខ្លាំង (SLA 15 នាទី)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Ticket Subject & Details -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
                        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                            <i class="fas fa-comment-dots text-sky-600"></i>
                            <span>ខ្លឹមសារសំណើ និងកំណត់ហេតុដោះស្រាយ</span>
                        </h3>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1.5">ប្រភេទសំណើ / បណ្តឹង <span class="text-rose-500">*</span></label>
                            <select id="ticketCategory" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500">
                                <option value="delivery">សាកសួរទីតាំងដឹកជញ្ជូន / តាមដានអ្នកដឹក</option>
                                <option value="exchange">ស្នើសុំប្តូរទំនិញថ្មី (ទំនិញខូចខាតពេលដឹក)</option>
                                <option value="invoice">ស្នើសុំចម្លងវិក្កយបត្រពន្ធ</option>
                                <option value="pricing">សាកសួរតម្លៃ និងលក្ខខណ្ឌធានា</option>
                                <option value="other">សំណើផ្សេងៗ</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1.5">ចំណងជើងសង្ខេប <span class="text-rose-500">*</span></label>
                            <input type="text" id="ticketSubject" required placeholder="ឧ. អតិថិជនសួរនាំអំពីម៉ោងមកដល់របស់ឡានដឹកទំនិញ" class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1.5">កំណត់ហេតុលម្អិត & សកម្មភាពដោះស្រាយបឋម</label>
                            <textarea id="ticketNotes" rows="4" placeholder="កត់ត្រាព័ត៌មានដែលបានឆ្លើយតបជូនអតិថិជន និងការបញ្ជូនបន្តទៅកាន់ផ្នែកពាក់ព័ន្ធ..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-500"></textarea>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const inv = urlParams.get('invoice');
            const cust = urlParams.get('customer');
            const phone = urlParams.get('phone');

            if (inv) document.getElementById('ticketInvoice').value = inv;
            if (cust) document.getElementById('ticketCustomer').value = decodeURIComponent(cust);
            if (phone) document.getElementById('ticketPhone').value = decodeURIComponent(phone);
        });

        function submitSupportNote() {
            const cust = document.getElementById('ticketCustomer').value.trim();
            const phone = document.getElementById('ticketPhone').value.trim();
            const subject = document.getElementById('ticketSubject').value.trim();

            if (!cust || !phone || !subject) {
                showToast('សូមបំពេញព័ត៌មានចាំបាច់ (ឈ្មោះ, លេខទូរស័ព្ទ, ចំណងជើង)', 'error');
                return;
            }

            const nextId = `TCK-2026-08${Math.floor(Math.random() * 90) + 10}`;
            showToast(`បានបង្កើតសំបុត្របណ្តឹង ${nextId} និងជូនដំណឹងទៅកាន់ផ្នែកពាក់ព័ន្ធដោយជោគជ័យ`, 'success');

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        }
    </script>
</body>
</html>
