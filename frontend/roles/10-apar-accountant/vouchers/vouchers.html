<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ប័ណ្ណចំណាយទូទាត់</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="aparPortal" data-role-root=".." data-active="vouchers" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Content Top Header -->
        <div id="headerHost" data-title="ប័ណ្ណចំណាយទូទាត់"
             data-subtitle="គ្រប់គ្រងការទូទាត់បំណុលអ្នកផ្គត់ផ្គង់ (AP) កាត់ពន្ធកាត់ទុក (WHT) និងតាមដានការអនុម័ត"></div>

        <!-- Main Content -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <!-- Search & Filters -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="relative flex-1 min-w-[240px]">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-search text-xs"></i>
                        </span>
                        <input type="text" id="voucherSearch" oninput="renderVouchersTable()" placeholder="ស្វែងរកតាមលេខប័ណ្ណ ឈ្មោះអ្នកផ្គត់ផ្គង់ ឬលេខវិក្កយបត្រ..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs focus:bg-white focus:border-primary outline-none transition font-medium">
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs text-slate-500">សរុប: <strong id="voucherCount" class="text-slate-800">0</strong> ប័ណ្ណចំណាយ</span>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <a href="create-voucher.html" class="px-4 py-2 rounded-xl bg-primary hover:bg-[#142842] text-white font-medium text-xs flex items-center gap-2 shadow-sm transition">
                                <i class="fas fa-plus"></i>
                                <span>បង្កើតប័ណ្ណចំណាយថ្មី</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50/70 border-b border-slate-200/70 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                                <tr>
                                    <th class="py-3 px-4">លេខប័ណ្ណចំណាយ</th>
                                    <th class="py-3 px-4">អ្នកផ្គត់ផ្គង់ / អ្នកទទួលប្រាក់</th>
                                    <th class="py-3 px-4">យោងវិក្កយបត្រ (Bill)</th>
                                    <th class="py-3 px-4">កាលបរិច្ឆេទស្នើ</th>
                                    <th class="py-3 px-4 text-right">ទឹកប្រាក់សរុប</th>
                                    <th class="py-3 px-4 text-right">ពន្ធកាត់ទុក (WHT)</th>
                                    <th class="py-3 px-4 text-right">ទឹកប្រាក់បើកសុទ្ធ</th>
                                    <th class="py-3 px-4 text-center">ស្ថានភាព</th>
                                    <th class="py-3 px-4 text-center">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="vouchersTableBody" class="divide-y divide-slate-100 text-slate-700 font-medium"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPortalSidebar();
            renderVouchersTable();
        });

        function renderVouchersTable() {
            const store = getAPARStore();
            const search = (document.getElementById('voucherSearch').value || '').trim().toLowerCase();
            const filtered = store.vouchers.filter(v =>
                v.id.toLowerCase().includes(search) ||
                v.vendorName.toLowerCase().includes(search) ||
                v.billId.toLowerCase().includes(search)
            );

            document.getElementById('voucherCount').innerText = filtered.length;
            const tbody = document.getElementById('vouchersTableBody');

            const statusBadges = {
                pending: '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">រង់ចាំអនុម័ត</span>',
                approved: '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">បានអនុម័ត</span>',
                paid: '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">បានបើកប្រាក់រួច</span>'
            };

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-slate-400">ពុំមានទិន្នន័យប័ណ្ណចំណាយឡើយ</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(v => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-3 px-4 font-bold text-primary">
                        <a href="view-voucher.html?id=${v.id}" class="hover:underline">${v.id}</a>
                    </td>
                    <td class="py-3 px-4 font-medium text-slate-900">${v.vendorName}</td>
                    <td class="py-3 px-4 text-slate-600">${v.billId}</td>
                    <td class="py-3 px-4 text-slate-600">${v.date}</td>
                    <td class="py-3 px-4 text-right text-slate-700">$${v.grossAmount.toFixed(2)}</td>
                    <td class="py-3 px-4 text-right text-rose-600 font-semibold">${v.whtAmount > 0 ? '-$' + v.whtAmount.toFixed(2) : '-'}</td>
                    <td class="py-3 px-4 text-right font-bold text-slate-900 text-sm">$${v.netAmount.toFixed(2)}</td>
                    <td class="py-3 px-4 text-center">${statusBadges[v.status] || v.status}</td>
                    <td class="py-3 px-4 text-center">
                        <a href="view-voucher.html?id=${v.id}" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-primary hover:text-white text-slate-600 inline-flex items-center justify-center transition" title="មើលប័ណ្ណ">
                            <i class="fas fa-eye text-xs"></i>
                        </a>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>

</html>
