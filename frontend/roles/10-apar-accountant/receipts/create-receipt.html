<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ចេញបង្កាន់ដៃទទួលប្រាក់</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="aparPortal" data-role-root=".." data-active="receipts" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Content Top Header with Unified Back Button -->
        <div id="headerHost" data-title="ចេញបង្កាន់ដៃទទួលប្រាក់ផ្លូវការ"
             data-subtitle="កត់ត្រាការទូទាត់សាច់ប្រាក់ ឬផ្ទេរប្រាក់បាគង KHQR ពីអតិថិជន"
             data-back="receipts.html"></div>

        <!-- Main Form Container -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-6">
            <!-- របារសកម្មភាពទំព័រ — ដកចេញពីក្បាលទំព័រ ដើម្បីរក្សាក្បាលទំព័រឲ្យស្អាត -->
            <div class="w-full max-w-4xl mx-auto flex flex-wrap items-center justify-end gap-2 mb-4 no-print">
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" onclick="window.location.href='receipts.html'" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs transition">
                        បោះបង់
                    </button>
                    <button type="button" onclick="handleSaveReceipt()" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs shadow-sm transition flex items-center gap-2">
                        <i class="fas fa-check"></i>
                        <span>ចេញបង្កាន់ដៃទទួលប្រាក់</span>
                    </button>
                </div>
            </div>

            <div class="w-full max-w-4xl mx-auto space-y-5">

                <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm space-y-4">
                    <h3 class="text-sm font-semibold text-slate-800 border-b border-slate-100 pb-3 flex items-center gap-2">
                        <i class="fas fa-file-invoice text-emerald-600 text-xs"></i>
                        <span>ព័ត៌មានលម្អិតការទទួលប្រាក់</span>
                    </h3>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">លេខបង្កាន់ដៃ</label>
                            <input type="text" id="recId" value="REC-2026-0146" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2.5 font-bold text-primary outline-none">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">កាលបរិច្ឆេទទទួលប្រាក់ <span class="text-rose-500">*</span></label>
                            <input type="date" id="recDate" value="2026-09-26" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-primary font-medium">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block font-semibold text-slate-700 mb-1.5">អតិថិជន <span class="text-rose-500">*</span></label>
                            <select id="customerSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-primary font-medium cursor-pointer">
                                <option value="ហេង វិច្ឆិកា (ក្រុមហ៊ុន អេប៊ីស៊ី)">ហេង វិច្ឆិកា (ក្រុមហ៊ុន អេប៊ីស៊ី)</option>
                                <option value="ក្រុមហ៊ុន ភ្នំពេញ ត្រេឌីង ឯ.ក">ក្រុមហ៊ុន ភ្នំពេញ ត្រេឌីង ឯ.ក</option>
                                <option value="សាលាអន្តរជាតិ បាយ័ន">សាលាអន្តរជាតិ បាយ័ន</option>
                                <option value="ក្រុមហ៊ុន ដំរី មេឌា ឯ.ក">ក្រុមហ៊ុន ដំរី មេឌា ឯ.ក</option>
                                <option value="ហាងកុំព្យូទ័រ រស្មី ទំនើប">ហាងកុំព្យូទ័រ រស្មី ទំនើប</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs pt-1">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">យោងលេខវិក្កយបត្រ (Invoice Ref) <span class="text-rose-500">*</span></label>
                            <input type="text" id="invoiceRef" value="INV-2026-0125" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-primary font-medium">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">វិធីសាស្ត្រទូទាត់ <span class="text-rose-500">*</span></label>
                            <select id="paymentMethod" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-primary font-medium cursor-pointer">
                                <option value="KHQR បាគង">KHQR បាគង (Bakong Scan)</option>
                                <option value="ធនាគារ អេប៊ីអេ (ABA USD)">ធនាគារ អេប៊ីអេ (ABA USD)</option>
                                <option value="ធនាគារ កាណាឌីយ៉ា (Canadia USD)">ធនាគារ កាណាឌីយ៉ា (Canadia USD)</option>
                                <option value="សាច់ប្រាក់សុទ្ធ">សាច់ប្រាក់សុទ្ធ (Cash)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">លេខយោងធនាគារ/ស្លីប</label>
                            <input type="text" id="bankRef" placeholder="BKG-XXXXXX ឬ ABA-XXXXXX" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-primary font-medium">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs pt-1">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">ទឹកប្រាក់ទទួលជាក់ស្តែង ($) <span class="text-rose-500">*</span></label>
                            <input type="number" step="0.01" id="recAmount" value="3150.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-emerald-700 outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1.5">សម្គាល់ និងចំណាំ</label>
                            <input type="text" id="recNote" placeholder="ទូទាត់ថ្លៃវិក្កយបត្រពេញលេញ..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-primary font-medium">
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPortalSidebar();
        });

        function handleSaveReceipt() {
            const amount = parseFloat(document.getElementById('recAmount').value || 0);
            if (amount <= 0) {
                showToast('សូមបញ្ចូលទឹកប្រាក់ទទួលត្រឹមត្រូវ!', 'warning');
                return;
            }

            const store = getAPARStore();
            const newRec = {
                id: document.getElementById('recId').value,
                invoiceId: document.getElementById('invoiceRef').value.trim(),
                customerName: document.getElementById('customerSelect').value,
                date: document.getElementById('recDate').value,
                paymentMethod: document.getElementById('paymentMethod').value,
                bankRef: document.getElementById('bankRef').value.trim() || 'BKG-' + Math.floor(Math.random() * 90000000 + 10000000),
                amount: amount,
                currency: 'USD',
                status: 'verified',
                receivedBy: 'អ៊ុំ ម៉ានី (AP/AR)',
                note: document.getElementById('recNote').value.trim() || 'ទូទាត់ជោគជ័យ'
            };

            store.receipts.unshift(newRec);
            saveAPARStore(store);

            showToast('បានចេញបង្កាន់ដៃទទួលប្រាក់ ' + newRec.id + ' ដោយជោគជ័យ!', 'success');
            setTimeout(() => {
                window.location.href = 'receipts.html';
            }, 800);
        }
    </script>
</body>

</html>
