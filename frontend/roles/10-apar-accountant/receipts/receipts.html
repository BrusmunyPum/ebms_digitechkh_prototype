<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - បង្កាន់ដៃទទួលប្រាក់</title>
    <link rel="icon" type="image/png" href="../../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        'primary-dark': "#142842",
                        accent: "#0ea5e9",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../../shared/styles/portal.css">
</head>

<body id="aparPortal" data-role-root=".." data-active="receipts" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Content Top Header -->
        <div id="headerHost" data-title="បង្កាន់ដៃទទួលប្រាក់"
             data-subtitle="គ្រប់គ្រងការប្រមូលប្រាក់ពីអតិថិជន តាមដានស្លីបធនាគារ និងបោះពុម្ពបង្កាន់ដៃ"></div>

        <!-- Main Content -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 px-4 md:px-6 py-4">

            <div class="w-full space-y-4">

                <div id="claimsHost"></div>

                <!-- Search & Filters -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div class="relative flex-1 min-w-[240px]">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-search text-xs"></i>
                        </span>
                        <input type="text" id="receiptSearch" oninput="renderReceiptsTable()" placeholder="ស្វែងរកតាមលេខបង្កាន់ដៃ លេខវិក្កយបត្រ ឬឈ្មោះអតិថិជន..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs focus:bg-white focus:border-primary outline-none transition font-medium">
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs text-slate-500">សរុប: <strong id="receiptCount" class="text-slate-800">0</strong> បង្កាន់ដៃ</span>
                        <span class="w-px h-6 bg-slate-200 hidden sm:block"></span>
                        <div class="flex flex-wrap items-center gap-2 no-print">
                            <a href="create-receipt.html" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs flex items-center gap-2 shadow-sm transition">
                                <i class="fas fa-plus"></i>
                                <span>បង្កើតថ្មី</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50/70 border-b border-slate-200/70 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                                <tr>
                                    <th class="py-3 px-4">លេខបង្កាន់ដៃ</th>
                                    <th class="py-3 px-4">យោងវិក្កយបត្រ</th>
                                    <th class="py-3 px-4">អតិថិជន</th>
                                    <th class="py-3 px-4">កាលបរិច្ឆេទ</th>
                                    <th class="py-3 px-4">វិធីសាស្ត្រទូទាត់</th>
                                    <th class="py-3 px-4">លេខយោងធនាគារ</th>
                                    <th class="py-3 px-4 text-right">ទឹកប្រាក់ទទួល</th>
                                    <th class="py-3 px-4 text-center">ស្ថានភាព</th>
                                    <th class="py-3 px-4 text-center">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="receiptsTableBody" class="divide-y divide-slate-100 text-slate-700 font-medium"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/scripts/ui-components.js"></script>
    <script src="../data.js"></script>
    <script src="../../../shared/scripts/portal.js"></script>
    <script>
        function renderClaims() {
            const claims = listPaymentClaims('PENDING_VERIFICATION');
            document.getElementById('claimsHost').innerHTML = claims.length ? `
                <div class="bg-sky-50 border border-sky-200 rounded-2xl p-4 space-y-3">
                    <div class="flex items-center gap-2 text-sky-900">
                        <i class="fas fa-qrcode"></i>
                        <h3 class="text-sm font-semibold">ការទូទាត់ KHQR រង់ចាំផ្ទៀងផ្ទាត់ (${claims.length})</h3>
                    </div>
                    ${claims.map(c => `
                        <div class="bg-white rounded-xl border border-sky-100 p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
                            <div>
                                <p class="font-bold text-slate-800">${c.customerName}</p>
                                <p class="text-slate-500">វិក្កយបត្រ ${c.invoiceId} · លេខយោង ${c.bankRef} · ${fmtKhDateTime(c.at)}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-emerald-700 text-sm">${fmtUSD(c.amount)}</span>
                                <a href="create-receipt.html?claim=${c.id}" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium transition">ផ្ទៀងផ្ទាត់ និងចេញបង្កាន់ដៃ</a>
                            </div>
                        </div>`).join('')}
                </div>` : '';
        }

        function renderReceiptsTable() {
            const search = (document.getElementById('receiptSearch').value || '').trim().toLowerCase();
            const filtered = listReceipts().filter(r =>
                r.id.toLowerCase().includes(search) ||
                r.invoiceId.toLowerCase().includes(search) ||
                r.customerName.toLowerCase().includes(search)
            );

            document.getElementById('receiptCount').innerText = filtered.length;
            const tbody = document.getElementById('receiptsTableBody');

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-14 text-center text-slate-400">
                    <i class="fas fa-receipt text-3xl mb-2"></i>
                    <p class="text-sm font-medium">គ្មានបង្កាន់ដៃទទួលប្រាក់ក្នុងលក្ខខណ្ឌនេះទេ</p>
                    <button onclick="clearReceiptSearch()" class="mt-3 px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">ជម្រះតម្រង</button>
                </td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(r => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-3 px-4 font-bold text-primary">
                        <a href="view-receipt.html?id=${r.id}" class="hover:underline">${r.id}</a>
                    </td>
                    <td class="py-3 px-4 font-semibold text-slate-600">${r.invoiceId}</td>
                    <td class="py-3 px-4 font-medium text-slate-900">${r.customerName}</td>
                    <td class="py-3 px-4 text-slate-600">${fmtKhDate(r.date)}</td>
                    <td class="py-3 px-4">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">${r.paymentMethod}</span>
                    </td>
                    <td class="py-3 px-4 font-mono text-slate-500 text-[11px]">${r.bankRef || '—'}</td>
                    <td class="py-3 px-4 text-right font-bold text-emerald-700 text-sm">${fmtUSD(r.amount)}</td>
                    <td class="py-3 px-4 text-center">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">បានផ្ទៀងផ្ទាត់</span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="toggleRowActionMenu(event, 'rm-${r.id}')" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 inline-flex items-center justify-center transition">
                            <i class="fas fa-ellipsis-vertical text-xs"></i>
                        </button>
                        <div id="rm-${r.id}" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-left text-xs">
                            <a href="view-receipt.html?id=${r.id}" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition"><i class="fas fa-eye w-4 text-center"></i>មើលលម្អិត</a>
                            <a href="../../09-chief-accountant/ledger/view-journal.html?id=${r.journalId}" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition"><i class="fas fa-book w-4 text-center"></i>មើលទិន្នានុប្បវត្តិ ${r.journalId || ''}</a>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function clearReceiptSearch() {
            document.getElementById('receiptSearch').value = '';
            renderReceiptsTable();
        }

        function refresh() {
            renderClaims();
            renderReceiptsTable();
        }

        window.onStoreChanged = refresh;

        document.addEventListener('DOMContentLoaded', () => {
            renderPortalSidebar();
            refresh();
        });
    </script>
</body>

</html>
